name: Sync Pokémon Center Data

on:

  workflow_dispatch:

  schedule:

    - cron: "17 */6 * * *"


permissions:

  contents: write


jobs:

  sync:

    runs-on: ubuntu-latest

    steps:


      # =====================================================
      # Checkout
      # =====================================================

      - name:
          Checkout repository

        uses:
          actions/checkout@v6


      # =====================================================
      # Python
      # =====================================================

      - name:
          Setup Python

        uses:
          actions/setup-python@v6

        with:

          python-version:
            "3.12"


      # =====================================================
      # Dependencies
      # =====================================================

      - name:
          Install dependencies

        run: |

          python -m pip install \
            --upgrade pip

          pip install \
            beautifulsoup4


      # =====================================================
      # Sync
      # =====================================================

      - name:
          Sync Pokémon Center

        run: |

          python \
            scripts/sync_pokemon_center.py


      # =====================================================
      # Validate JSON
      # =====================================================

      - name:
          Validate generated JSON

        run: |

          python - <<'PY'

          import json
          from pathlib import Path

          file = Path(
              "data/pokemon_center.json"
          )

          if not file.exists():

              raise SystemExit(
                  "找不到 pokemon_center.json"
              )

          with file.open(
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          items = data.get(
              "list",
              []
          )

          if not isinstance(
              items,
              list
          ):

              raise SystemExit(
                  "pokemon_center.json 的 list 不是 array"
              )

          if len(items) == 0:

              raise SystemExit(
                  "同步結果為 0 筆，拒絕覆蓋資料"
              )

          print(
              "Pokémon Center：",
              len(items),
              "筆"
          )

          missing_pref = [
              x
              for x in items
              if x.get("pref") is None
          ]

          missing_coords = [
              x
              for x in items
              if not x.get("coords")
          ]

          print(
              "缺少縣市：",
              len(missing_pref)
          )

          print(
              "缺少座標：",
              len(missing_coords)
          )

          PY


      # =====================================================
      # Show data
      # =====================================================

      - name:
          Show Center summary

        run: |

          python - <<'PY'

          import json

          with open(
              "data/pokemon_center.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          for item in data["list"]:

              print(
                  item["name"],
                  "|",
                  item.get("address", ""),
                  "|",
                  item.get("coords")
              )

          PY


      # =====================================================
      # Commit
      # =====================================================

      - name:
          Commit changes

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/pokemon_center.json \
            center_history.json


          if git diff --cached --quiet; then

            echo "沒有資料變化"

          else

            git commit \
              -m "chore: sync Pokémon Center data"

            git push

          fi
