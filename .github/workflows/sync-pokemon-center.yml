name: Sync Pokémon Center

on:

  workflow_dispatch:

  schedule:

    - cron: "17 */6 * * *"


permissions:

  contents: write


jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      - name:
          Checkout repository

        uses:
          actions/checkout@v6


      - name:
          Setup Node.js

        uses:
          actions/setup-node@v6

        with:

          node-version: "24"


      - name:
          Check JavaScript syntax

        run: |

          node --check \
            scripts/sync_pokemon_center.js


      - name:
          Run Pokémon Center Sync

        run: |

          node \
            scripts/sync_pokemon_center.js


      - name:
          Validate generated JSON

        run: |

          node <<'NODE'

          const fs = require("fs");

          const path =
            "data/pokemon_center.json";

          if (
            !fs.existsSync(path)
          ) {

            throw new Error(
              "找不到 pokemon_center.json"
            );

          }


          const data =
            JSON.parse(
              fs.readFileSync(
                path,
                "utf8"
              )
            );


          const items =
            data.list || [];


          console.log(
            "Pokémon Center:",
            items.length
          );


          if (
            items.length === 0
          ) {

            throw new Error(
              "Pokémon Center 資料為 0 筆"
            );

          }


          const missingPref =
            items.filter(
              item =>
                item.pref == null
            ).length;


          const missingCoords =
            items.filter(
              item =>
                !Array.isArray(
                  item.coords
                )
            ).length;


          console.log(
            "缺少 pref:",
            missingPref
          );


          console.log(
            "缺少 coords:",
            missingCoords
          );

          NODE


      - name:
          Commit changes

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/pokemon_center.json \
            center_history.json


          if git diff --cached --quiet; then

            echo "沒有資料變化"

          else

            git commit \
              -m "chore: sync Pokémon Center data"

            git push

          fi
