name: Sync Pokémon Center Data

on:

  schedule:

    # 每 6 小時檢查一次
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:

  contents: write


jobs:

  sync:

    runs-on: ubuntu-latest

    steps:


      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout repository

        uses:
          actions/checkout@v4


      # =====================================================
      # 2. Setup Python
      # =====================================================

      - name: Setup Python

        uses:
          actions/setup-python@v5

        with:

          python-version:
            "3.x"


      # =====================================================
      # 3. Install dependencies
      # =====================================================

      - name:
          Install dependencies

        run:
          pip install beautifulsoup4


      # =====================================================
      # 4. Run Center Sync
      # =====================================================

      - name:
          Sync Pokémon Center

        run:
          python scripts/sync_pokemon_center.py


      # =====================================================
      # 5. Show result
      # =====================================================

      - name:
          Show generated data

        run: |

          python - <<'PY'

          import json

          with open(
              "data/pokemon_center.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print(
              "Pokémon Center 數量：",
              len(
                  data.get(
                      "list",
                      []
                  )
              )
          )

          PY


      # =====================================================
      # 6. Commit
      # =====================================================

      - name:
          Commit changes

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/pokemon_center.json \
            center_history.json


          if git diff --cached --quiet; then

            echo "沒有資料變化，不需要 Commit"

          else

            git commit \
              -m "chore: sync Pokémon Center data"

            git push

          fi
