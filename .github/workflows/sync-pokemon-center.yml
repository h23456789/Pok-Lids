name: Sync Pokémon Center

on:

  workflow_dispatch:

  schedule:

    - cron: "17 */6 * * *"


permissions:

  contents: write


jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      - name:
          Checkout repository

        uses:
          actions/checkout@v6


      - name:
          Setup Python

        uses:
          actions/setup-python@v6

        with:

          python-version:
            "3.12"


      - name:
          Install dependencies

        run: |

          python -m pip install \
            --upgrade pip

          pip install \
            beautifulsoup4


      - name:
          Check Python syntax

        run: |

          python -m py_compile \
            scripts/sync_pokemon_center.py


      - name:
          Run Pokémon Center Sync

        run: |

          python \
            scripts/sync_pokemon_center.py


      - name:
          Validate generated JSON

        run: |

          python - <<'PY'

          import json

          from pathlib import Path


          path = Path(
              "data/pokemon_center.json"
          )


          if not path.exists():

              raise SystemExit(
                  "找不到 pokemon_center.json"
              )


          with path.open(
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          items = data.get(
              "list",
              []
          )


          if not isinstance(
              items,
              list
          ):

              raise SystemExit(
                  "list 不是陣列"
              )


          if not items:

              raise SystemExit(
                  "Center 資料為 0 筆"
              )


          print(
              "Pokémon Center:",
              len(items),
              "筆"
          )


          print(
              "缺少縣市:",
              sum(
                  1
                  for item in items
                  if item.get("pref") is None
              )
          )


          print(
              "缺少座標:",
              sum(
                  1
                  for item in items
                  if not item.get("coords")
              )
          )

          PY


      - name:
          Commit changes

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/pokemon_center.json \
            center_history.json


          if git diff --cached --quiet; then

            echo "沒有資料變化"

          else

            git commit \
              -m "chore: sync Pokémon Center"

            git push

          fi
