name: Sync Pokémon Center

on:

  workflow_dispatch:

  schedule:

    - cron: "17 */6 * * *"


permissions:

  contents: write


jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      - name:
          Checkout

        uses:
          actions/checkout@v6


      - name:
          Setup Python

        uses:
          actions/setup-python@v6

        with:

          python-version:
            "3.12"


      - name:
          Install dependencies

        run: |

          python -m pip install \
            --upgrade pip

          pip install \
            beautifulsoup4


      - name:
          Run Pokémon Center Sync

        run: |

          python \
            scripts/sync_pokemon_center.py


      - name:
          Validate data

        run: |

          python - <<'PY'

          import json

          from pathlib import Path


          path = Path(
              "data/pokemon_center.json"
          )


          if not path.exists():

              raise SystemExit(
                  "pokemon_center.json 不存在"
              )


          with path.open(
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          items = data.get(
              "list",
              []
          )


          if not isinstance(
              items,
              list
          ):

              raise SystemExit(
                  "list 不是陣列"
              )


          if not items:

              raise SystemExit(
                  "資料為 0 筆，停止"
              )


          print(
              "Pokémon Center:",
              len(items)
          )


          missing_pref = [
              x
              for x
              in items
              if x.get("pref") is None
          ]


          missing_coords = [
              x
              for x
              in items
              if not x.get("coords")
          ]


          print(
              "缺少 pref:",
              len(missing_pref)
          )


          print(
              "缺少 coords:",
              len(missing_coords)
          )

          PY


      - name:
          Commit

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/pokemon_center.json \
            center_history.json


          if git diff --cached --quiet; then

            echo "沒有變化"

          else

            git commit \
              -m "chore: sync Pokémon Center"

            git push

          fi
