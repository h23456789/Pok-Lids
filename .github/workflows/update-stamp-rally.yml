name: Update Stamp Rally

on:

  schedule:
    # 台灣時間約每天 06:00
    - cron: "0 22 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-stamp-rally:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests beautifulsoup4


      - name: Update official Stamp Rally

        run: |

          python scripts/update_stamp_rally.py


      - name: Check changes

        id: changes

        run: |

          if git diff --quiet -- svgstamp_rally.json svgstamp_history.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      - name: Commit updated data

        if: steps.changes.outputs.changed == 'true'

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add svgstamp_rally.json svgstamp_history.json

          git commit -m "chore: auto update official Stamp Rally data"

          git push
