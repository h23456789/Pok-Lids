name: Update Pokémon GO GO Stamp Rally

on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:
  push:
    paths:
      - "update_stamp_rally.py"
      - ".github/workflows/update-stamp-rally.yml"

permissions:
  contents: write

jobs:
  update-go-stamp-rally:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Sync official Pokémon GO GO Stamp Rally
        run: python update_stamp_rally.py

      - name: Check changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- svgstamp_rally.json svgstamp_history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add svgstamp_rally.json svgstamp_history.json
          git commit -m "chore: sync official Pokémon GO GO Stamp Rally"
          git push
