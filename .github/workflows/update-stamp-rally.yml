name: Update Pokémon GO GO 集章趣

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-go-stamp-rally
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run official GO Stamp Rally sync
        run: python update_stamp_rally.py

      - name: Commit and push updates safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add svgstamp_rally.json svgstamp_history.json

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "chore: auto update Pokémon GO GO 集章趣 data"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
