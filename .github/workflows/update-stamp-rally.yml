name: Update Stamp Rally

on:

  schedule:

    # 每天台灣時間 06:00 左右執行
    # GitHub Actions 使用 UTC
    - cron: "0 22 * * *"

  workflow_dispatch:


permissions:

  contents: write


jobs:

  update-stamp-rally:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # =====================================================
      # Python
      # =====================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # =====================================================
      # Dependencies
      # =====================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests beautifulsoup4


      # =====================================================
      # Update
      # =====================================================

      - name: Update Stamp Rally

        run: |

          python scripts/update_stamp_rally.py


      # =====================================================
      # Check changes
      # =====================================================

      - name: Check changes

        id: changes

        run: |

          if git diff --quiet -- svgstamp_rally.json svgstamp_history.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # =====================================================
      # Commit
      # =====================================================

      - name: Commit updated data

        if: steps.changes.outputs.changed == 'true'

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add svgstamp_rally.json

          git add svgstamp_history.json

          git commit -m "chore: update official Stamp Rally data"

          git push
