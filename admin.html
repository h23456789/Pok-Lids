<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokémon Japan Collection｜GO 集章趣管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9f7fb;color:#315f66;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.panel{background:#fff;border-radius:22px;padding:20px;box-shadow:0 6px 25px rgba(70,130,140,.12);margin-bottom:16px}.head{background:linear-gradient(135deg,#c8edf5,#aee0ed);border-radius:22px;padding:22px;text-align:center}.head h1{margin:0;color:#397b83;font-size:26px}.head p{margin:8px 0 0;color:#58919a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-weight:800;color:#397b83}.field input,.field select{width:100%;padding:10px 12px;border:1px solid #c9dddd;border-radius:10px;font:inherit;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;flex-wrap:wrap;gap:8px}.btn{border:0;border-radius:999px;padding:10px 16px;background:#397b83;color:#fff;font-weight:900;cursor:pointer}.btn.alt{background:#e7f3f3;color:#397b83}.btn.warn{background:#b57922}.help{font-size:12px;color:#6f8e93;line-height:1.6}.status{padding:10px 12px;border-radius:10px;background:#eef7f7;margin-top:10px;font-size:13px;white-space:pre-wrap}.preview{border-radius:18px;background:#edf8f5;min-height:240px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.preview canvas{max-width:100%;max-height:420px;display:block;cursor:crosshair}.crop-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}.crop-tools label{font-size:13px;font-weight:800}.crop-tools input[type=checkbox]{transform:scale(1.15)}.point-box{border:1px solid #deebeb;border-radius:14px;padding:12px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#dcf8e8;color:#20a963;font-size:11px;font-weight:900}.badge.manual{background:#e8e1ff;color:#6f4bb8}.small{font-size:11px;color:#779397}.thumb{margin-top:10px;max-width:180px;max-height:120px;border-radius:10px;background:#eef6f6;object-fit:contain}.danger{color:#a64f4f}.ok{color:#239f62}
@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🎟️ Pokémon GO GO 集章趣｜管理後台</h1>
    <p>人工座標／圖章圖片／Pokémon Center 徽章管理</p>
  </div>

  <div class="panel">
    <h2>GitHub 設定</h2>
    <div class="grid">
      <div>
        <div class="field"><label>Repository</label><input id="repo" value="h23456789/Pok-Lids"></div>
        <div class="field"><label>Branch</label><input id="branch" value="main"></div>
      </div>
      <div>
        <div class="field"><label>GitHub Fine-grained Token</label><input id="token" type="password" placeholder="只在本次瀏覽器工作階段使用"></div>
        <div class="help">需要該 Repository 的 Contents: Read and write 權限。Token 不會寫入 localStorage。</div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn" id="loadBtn">載入目前活動</button>
    </div>
    <div id="status" class="status">尚未連線。</div>
  </div>

  <div class="panel">
    <h2>選擇活動與圖章</h2>
    <div class="field"><label>活動</label><select id="eventSelect"></select></div>
    <div class="field"><label>圖章／地點</label><select id="pointSelect"></select></div>
    <div id="pointInfo" class="point-box">請先載入活動資料。</div>
  </div>

  <div class="panel">
    <h2>① 手動座標</h2>
    <div class="row">
      <div class="field"><label>緯度 Latitude</label><input id="lat" inputmode="decimal"></div>
      <div class="field"><label>經度 Longitude</label><input id="lng" inputmode="decimal"></div>
    </div>
    <div class="field"><label>座標來源說明</label><input id="coordSource" placeholder="例如：人工確認地圖座標"></div>
    <div class="buttons">
      <button class="btn alt" id="clearCoordBtn">清除手動座標</button>
    </div>
  </div>

  <div class="panel">
    <h2>② 截圖裁切成圖章</h2>
    <div class="field"><label>上傳遊戲截圖</label><input id="imageInput" type="file" accept="image/*"></div>
    <div class="preview"><canvas id="canvas" width="900" height="600"></canvas></div>
    <div class="crop-tools">
      <label><input id="circleCrop" type="checkbox">輸出圓形圖章 PNG</label>
      <span class="small">在上面的截圖上按住滑鼠拖曳圈選；手機可用觸控拖曳。</span>
    </div>
    <div class="buttons" style="margin-top:10px">
      <button class="btn alt" id="exportBtn">裁切預覽</button>
      <button class="btn alt" id="downloadCropBtn">下載裁切圖片</button>
    </div>
    <div id="cropPreviewBox" style="margin-top:12px"></div>
    <div class="help">這裡的「圈選」是從遊戲截圖中框出真正圖章範圍。勾選圓形後，會輸出透明背景的圓形 PNG；未勾選則輸出原比例矩形 PNG。</div>
  </div>

  <div class="panel">
    <h2>③ 儲存人工修正</h2>
    <div class="field"><label>圖章圖片來源說明</label><input id="imageSource" placeholder="例如：使用者遊戲截圖人工裁切"></div>
    <div class="field"><label>如果你已有圖片網址，也可以直接輸入</label><input id="imageUrl" placeholder="https://... 或 assets/stamps/...png"></div>
    <div class="buttons">
      <button class="btn" id="saveBtn">儲存人工修正到 GitHub</button>
      <button class="btn alt" id="reloadBtn">重新載入</button>
    </div>
    <div id="saveStatus" class="status"></div>
  </div>
</div>

<script>
const state={events:[],list:[],overrides:{items:[]},cropBlob:null,cropDataUrl:"",img:null,scale:1,drawStart:null,drawEnd:null,rect:null};
const $=id=>document.getElementById(id);
function apiHeaders(){return {"Accept":"application/vnd.github+json","Authorization":"Bearer "+$("token").value.trim(),"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"};}
function b64ToUtf8(b64){return decodeURIComponent(escape(atob(b64)));}
function utf8ToB64(text){return btoa(unescape(encodeURIComponent(text)));}
function setStatus(msg,cls=""){ $("status").textContent=msg; $("status").className="status "+cls; }
function setSave(msg,cls=""){ $("saveStatus").textContent=msg; $("saveStatus").className="status "+cls; }
async function githubGet(path){
  const repo=$("repo").value.trim();
  const r=await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${encodeURIComponent($("branch").value.trim())}`,{headers:apiHeaders()});
  if(!r.ok) throw new Error(`GitHub ${r.status}: ${await r.text()}`);
  return r.json();
}
async function githubPut(path,content,message,sha){
  const repo=$("repo").value.trim();
  const body={message,content,branch:$("branch").value.trim()};
  if(sha) body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{method:"PUT",headers:apiHeaders(),body:JSON.stringify(body)});
  if(!r.ok) throw new Error(`GitHub ${r.status}: ${await r.text()}`);
  return r.json();
}
async function loadData(){
  try{
    if(!$("token").value.trim()) throw new Error("請先輸入 GitHub Token。");
    const [data,ov]=await Promise.all([githubGet("svgstamp_rally.json"),githubGet("svgstamp_manual_overrides.json").catch(()=>null)]);
    const json=JSON.parse(b64ToUtf8(data.content.replace(/\n/g,"")));
    state.events=Array.isArray(json.events)?json.events:[];
    state.list=Array.isArray(json.list)?json.list:[];
    if(ov){state.overrides=JSON.parse(b64ToUtf8(ov.content.replace(/\n/g,"")));if(!Array.isArray(state.overrides.items))state.overrides.items=[];}
    else state.overrides={version:"1.0",updated:new Date().toISOString().slice(0,10),items:[]};
    populateEvents();
    setStatus(`已載入 ${state.events.length} 個活動、${state.list.length} 個圖章；人工修正 ${state.overrides.items.length} 筆。` ,"ok");
  }catch(e){setStatus(e.message,"danger");}
}
function eventName(e){return e.eventZh||e.eventNameZh||e.event||e.eventName||e.id;}
function currentPoints(){
  const id=$("eventSelect").value;
  if(!id) return [];
  return state.list.filter(x=>String(x.eventId||x.event||x.eventName)===String(id));
}
function populateEvents(){
  const sel=$("eventSelect"); sel.innerHTML="";
  const events=state.events.length?state.events:Array.from(new Map(state.list.map(x=>[String(x.eventId||x.event||x.eventName),{eventId:String(x.eventId||x.event||x.eventName),event:eventName(x)}])).values());
  for(const e of events){const o=document.createElement("option");o.value=String(e.eventId||e.id||e.event);o.textContent=eventName(e);sel.appendChild(o);}
  populatePoints();
}
function populatePoints(){
  const sel=$("pointSelect");sel.innerHTML="";
  for(const p of currentPoints()){
    const o=document.createElement("option");o.value=String(p.id);o.textContent=getPointName(p);sel.appendChild(o);
  }
  if(!sel.options.length){const o=document.createElement("option");o.textContent="目前沒有此活動的圖章點資料";o.value="";sel.appendChild(o);}
  showPointInfo();
}
function getPointName(p){return p.nameZh||p.venueZh||p.name||p.venue||p.cityZh||p.city||p.id;}
function findOverride(p){
  const arr=state.overrides.items||[];
  return arr.find(o=>String(o.id||"")===String(p.id)) || arr.find(o=>String(o.eventId||"")===String(p.eventId||"") && normalize(o.venue||o.name||o.venueZh||o.nameZh)===normalize(getPointName(p)));
}
function normalize(v){return String(v||"").toLowerCase().replace(/\s+/g,"").replace(/[‐‑–—ー・.]/g,"");}
function showPointInfo(){
  const p=state.list.find(x=>String(x.id)===String($("pointSelect").value));
  if(!p){$("pointInfo").innerHTML="目前沒有資料。";return;}
  const o=findOverride(p);
  const coord=Array.isArray(o?.manualCoordinates)?o.manualCoordinates:(Array.isArray(p.coords)?p.coords:[p.lat,p.lng]);
  $("lat").value=Number.isFinite(Number(coord?.[0]))?coord[0]:"";
  $("lng").value=Number.isFinite(Number(coord?.[1]))?coord[1]:"";
  $("coordSource").value=o?.coordinatesSource||p.coordinatesSource||p.coordsSource||"";
  $("imageUrl").value=o?.manualStampImage||"";
  $("imageSource").value=o?.stampImageSource||p.stampImageSource||"";
  $("pointInfo").innerHTML=`<b>${escapeHtml(getPointName(p))}</b><br><span class="small">ID：${escapeHtml(p.id||"")}</span><br><span>目前座標：${Array.isArray(p.coords)?p.coords.join(", "):(p.lat??"")+" / "+(p.lng??"")}</span><br><span>目前圖片：${p.stampImage?"已有":"無"}</span>${o?'<br><span class="badge manual">已有人工修正</span>':''}`;
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
$("eventSelect").addEventListener("change",populatePoints);
$("pointSelect").addEventListener("change",showPointInfo);
$("clearCoordBtn").onclick=()=>{$("lat").value="";$('lng').value="";};

const canvas=$("canvas"),ctx=canvas.getContext("2d");
function fitImage(img){state.img=img;const maxW=canvas.parentElement.clientWidth||900,maxH=420;const s=Math.min(maxW/img.width,maxH/img.height,1);state.scale=s;canvas.width=Math.max(1,Math.round(img.width*s));canvas.height=Math.max(1,Math.round(img.height*s));ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);state.rect=null;}
$("imageInput").onchange=()=>{const f=$("imageInput").files?.[0];if(!f)return;const img=new Image();img.onload=()=>fitImage(img);img.src=URL.createObjectURL(f);};
function pointerPos(ev){const r=canvas.getBoundingClientRect();const cx=ev.clientX??ev.touches?.[0]?.clientX;const cy=ev.clientY??ev.touches?.[0]?.clientY;return{x:Math.max(0,Math.min(canvas.width,cx-r.left)),y:Math.max(0,Math.min(canvas.height,cy-r.top))};}
function redraw(){if(!state.img)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(state.img,0,0,canvas.width,canvas.height);if(state.rect){ctx.save();ctx.strokeStyle="#397b83";ctx.lineWidth=3;ctx.setLineDash([8,5]);ctx.strokeRect(state.rect.x,state.rect.y,state.rect.w,state.rect.h);ctx.fillStyle="rgba(57,123,131,.16)";ctx.fillRect(state.rect.x,state.rect.y,state.rect.w,state.rect.h);ctx.restore();}}
function startCrop(ev){if(ev.cancelable)ev.preventDefault();state.drawStart=pointerPos(ev);state.rect={x:state.drawStart.x,y:state.drawStart.y,w:0,h:0};redraw();}
function moveCrop(ev){if(!state.drawStart)return;if(ev.cancelable)ev.preventDefault();const p=pointerPos(ev);const x=Math.min(state.drawStart.x,p.x),y=Math.min(state.drawStart.y,p.y),w=Math.abs(p.x-state.drawStart.x),h=Math.abs(p.y-state.drawStart.y);state.rect={x,y,w,h};redraw();}
function endCrop(ev){if(ev.cancelable)ev.preventDefault();state.drawStart=null;redraw();}
canvas.addEventListener("pointerdown",startCrop);canvas.addEventListener("pointermove",moveCrop);canvas.addEventListener("pointerup",endCrop);canvas.addEventListener("pointercancel",endCrop);canvas.addEventListener("pointerleave",()=>{});
function createCropBlob(){
  if(!state.img||!state.rect||state.rect.w<3||state.rect.h<3)throw new Error("請先在截圖上圈選圖章範圍。");
  const r=state.rect,s=state.scale||1;const sx=r.x/s,sy=r.y/s,sw=r.w/s,sh=r.h/s;
  const out=document.createElement("canvas");out.width=Math.max(1,Math.round(sw));out.height=Math.max(1,Math.round(sh));const octx=out.getContext("2d");
  if($("circleCrop").checked){const size=Math.min(out.width,out.height);const sq=document.createElement("canvas");sq.width=size;sq.height=size;const q=sq.getContext("2d");q.beginPath();q.arc(size/2,size/2,size/2,0,Math.PI*2);q.closePath();q.clip();const dx=(size-out.width)/2,dy=(size-out.height)/2;q.drawImage(state.img,sx,sy,sw,sh,dx,dy,out.width,out.height);const final=sq;return new Promise(res=>final.toBlob(b=>res({blob:b,dataUrl:final.toDataURL("image/png")}),"image/png"));}
  octx.drawImage(state.img,sx,sy,sw,sh,0,0,out.width,out.height);return new Promise(res=>out.toBlob(b=>res({blob:b,dataUrl:out.toDataURL("image/png")}),"image/png"));
}
$("exportBtn").onclick=async()=>{try{const x=await createCropBlob();state.cropBlob=x.blob;state.cropDataUrl=x.dataUrl;$("cropPreviewBox").innerHTML=`<img class="thumb" src="${x.dataUrl}" alt="裁切預覽">`;setSave("裁切完成，可儲存到 GitHub。","ok");}catch(e){setSave(e.message,"danger");}};
$("downloadCropBtn").onclick=()=>{if(!state.cropBlob){setSave("請先裁切預覽。","danger");return;}const a=document.createElement("a");a.href=URL.createObjectURL(state.cropBlob);a.download="stamp-crop.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};

async function uploadImage(){
  if(!state.cropBlob)return $("imageUrl").value.trim()||"";
  const p=state.list.find(x=>String(x.id)===String($("pointSelect").value));
  const safe=String(p?.id||Date.now()).replace(/[^a-zA-Z0-9_-]/g,"_");
  const path=`assets/stamps/${safe}.png`;
  const buf=await state.cropBlob.arrayBuffer();let bin="";const bytes=new Uint8Array(buf);for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
  const content=btoa(bin);
  let sha=null;try{const old=await githubGet(path);sha=old.sha;}catch{}
  await githubPut(path,content,"chore: update manual GO stamp image",sha);
  return path;
}
async function saveOverride(){
  try{
    if(!$("token").value.trim())throw new Error("請先輸入 GitHub Token。");
    const p=state.list.find(x=>String(x.id)===String($("pointSelect").value));if(!p)throw new Error("請先選擇圖章。");
    let coords=null;const la=$("lat").value.trim(),ln=$("lng").value.trim();if(la!==""||ln!==""){const lat=Number(la),lng=Number(ln);if(!Number.isFinite(lat)||!Number.isFinite(lng))throw new Error("座標格式不正確。");coords=[lat,lng];}
    const uploadedImage=await uploadImage();const imageUrl=uploadedImage||$("imageUrl").value.trim();
    const item={id:String(p.id),eventId:String(p.eventId||$("eventSelect").value),venue:p.venue||p.name||getPointName(p),name:p.name||getPointName(p)};
    if(coords)item.manualCoordinates=coords;else item.manualCoordinates=[];
    if($("coordSource").value.trim())item.coordinatesSource=$("coordSource").value.trim();
    if(imageUrl)item.manualStampImage=imageUrl;
    if($("imageSource").value.trim())item.stampImageSource=$("imageSource").value.trim();
    const arr=state.overrides.items||[];const idx=arr.findIndex(x=>String(x.id||"")===item.id);if(idx>=0)arr[idx]={...arr[idx],...item};else arr.push(item);state.overrides.items=arr;state.overrides.version="1.0";state.overrides.updated=new Date().toISOString();
    let sha=null;try{const old=await githubGet("svgstamp_manual_overrides.json");sha=old.sha;}catch{}
    const text=JSON.stringify(state.overrides,null,2)+"\n";await githubPut("svgstamp_manual_overrides.json",utf8ToB64(text),"chore: update manual GO stamp overrides",sha);
    setSave(`已儲存。\n圖章：${getPointName(p)}\n${coords?`座標：${coords.join(", ")}\n`:""}${imageUrl?`圖片：${imageUrl}`:""}\nGitHub Actions 下一次同步時會保留人工資料。`,"ok");
    showPointInfo();
  }catch(e){setSave(e.message,"danger");}
}
$("saveBtn").onclick=saveOverride;$("loadBtn").onclick=loadData;$("reloadBtn").onclick=loadData;
</script>
</body>
</html>
