<!doctype html>
<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>
  Pokémon Japan Collection｜日本寶可夢收集圖鑑
</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  background:#f4f7f8;
  color:#263238;
}

body.no-scroll{
  overflow:hidden;
}

button{
  font:inherit;
}

img{
  max-width:100%;
  display:block;
}

.hidden{
  display:none !important;
}

.muted{
  color:#78909c;
}

/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  background:
    rgba(255,255,255,.94);

  backdrop-filter:
    blur(12px);

  border-bottom:
    1px solid #dce5e8;

  padding:
    14px 18px;
}

.header-inner{
  max-width:1400px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.logo-title{
  font-size:20px;
  font-weight:800;
}

.logo-subtitle{
  margin-top:3px;
  font-size:12px;
  color:#78909c;
}

/* =========================================================
   MAIN
========================================================= */

main{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.section-title{
  font-size:24px;
  font-weight:800;
  margin-bottom:14px;
}

.section-description{
  color:#607d8b;
  margin-bottom:18px;
}

/* =========================================================
   TABS
========================================================= */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;

  overflow-x:auto;
  padding-bottom:4px;
}

.tab{
  flex:0 0 auto;

  border:1px solid #d5e0e4;
  background:#fff;
  color:#546e7a;

  border-radius:999px;

  padding:
    10px 18px;

  cursor:pointer;

  font-weight:700;

  transition:.2s ease;
}

.tab:hover{
  transform:translateY(-1px);
}

.tab.active{
  background:#397b83;
  border-color:#397b83;
  color:#fff;
}

/* =========================================================
   SUMMARY
========================================================= */

.summary{
  display:flex;
  flex-wrap:wrap;
  gap:12px;

  margin-bottom:20px;
}

.summary-card{
  background:#fff;

  border:
    1px solid #dce5e8;

  border-radius:14px;

  padding:
    14px 18px;

  min-width:150px;

  box-shadow:
    0 4px 14px rgba(38,50,56,.05);
}

.summary-label{
  font-size:12px;
  color:#78909c;
}

.summary-value{
  margin-top:4px;
  font-size:24px;
  font-weight:800;
}

/* =========================================================
   REGION
========================================================= */

#regions{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(240px,1fr)
    );

  gap:16px;
}

.region-card{
  background:#fff;

  border:
    1px solid #dce5e8;

  border-radius:18px;

  overflow:hidden;

  cursor:pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.region-card:hover{
  transform:translateY(-3px);

  box-shadow:
    0 10px 28px rgba(38,50,56,.10);
}

.region-images{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  height:150px;

  background:#eef3f4;
}

.region-image{
  width:100%;
  height:100%;

  object-fit:cover;
}

.region-empty{
  grid-column:1/-1;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#90a4ae;
}

.region-info{
  padding:15px;
}

.region-name{
  font-size:18px;
  font-weight:800;
}

.region-count{
  margin-top:5px;

  font-size:20px;
  font-weight:800;

  color:#397b83;
}

.region-percent{
  margin-top:4px;

  font-size:12px;
  color:#78909c;
}

/* =========================================================
   PANELS
========================================================= */

.panel{
  position:fixed;

  inset:0;

  z-index:300;

  background:
    rgba(20,30,34,.45);

  opacity:0;

  visibility:hidden;

  transition:
    opacity .2s ease,
    visibility .2s ease;
}

.panel.show{
  opacity:1;
  visibility:visible;
}

.panel-content{
  position:absolute;

  right:0;
  top:0;
  bottom:0;

  width:min(
    900px,
    100%
  );

  background:#f7fafb;

  overflow:auto;

  transform:translateX(30px);

  transition:
    transform .25s ease;
}

.panel.show .panel-content{
  transform:translateX(0);
}

.panel-header{
  position:sticky;

  top:0;

  z-index:5;

  background:
    rgba(255,255,255,.95);

  backdrop-filter:
    blur(12px);

  border-bottom:
    1px solid #dce5e8;

  padding:15px 18px;

  display:flex;

  align-items:center;

  gap:10px;
}

.panel-title{
  flex:1;

  font-size:22px;
  font-weight:800;
}

.close-btn,
.back-btn{
  border:0;

  background:#eef3f4;

  color:#455a64;

  width:40px;
  height:40px;

  border-radius:12px;

  cursor:pointer;

  font-size:18px;
}

.panel-body{
  padding:18px;
}

/* =========================================================
   PREFECTURE
========================================================= */

#prefectureGrid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(220px,1fr)
    );

  gap:14px;
}

.prefecture-card{
  background:#fff;

  border:
    1px solid #dce5e8;

  border-radius:16px;

  padding:16px;

  cursor:pointer;

  transition:.2s ease;
}

.prefecture-card:hover{
  transform:translateY(-2px);

  box-shadow:
    0 8px 22px rgba(38,50,56,.08);
}

.prefecture-card-top{
  display:flex;

  justify-content:space-between;

  gap:10px;
}

.prefecture-name{
  font-size:17px;
  font-weight:800;
}

.prefecture-count{
  font-weight:800;
  color:#397b83;
}

.prefecture-progress{
  height:8px;

  margin-top:13px;

  background:#e6edef;

  border-radius:999px;

  overflow:hidden;
}

.prefecture-progress-bar{
  height:100%;

  background:#397b83;

  border-radius:999px;
}

.prefecture-percent{
  margin-top:7px;

  font-size:12px;

  color:#78909c;
}

/* =========================================================
   COLLECTION
========================================================= */

#collectionGrid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(170px,1fr)
    );

  gap:14px;
}

.collection-item{
  position:relative;

  background:#fff;

  border:
    1px solid #dce5e8;

  border-radius:16px;

  overflow:hidden;

  cursor:pointer;

  transition:.2s ease;
}

.collection-item:hover{
  transform:translateY(-2px);

  box-shadow:
    0 8px 20px rgba(38,50,56,.08);
}

.collection-item.not-obtained{
  opacity:.62;
}

.collection-item.obtained{
  border-color:#74b99f;
}

.collection-image-wrap{
  aspect-ratio:1/1;

  background:#eef3f4;

  display:flex;

  align-items:center;

  justify-content:center;
}

.collection-image{
  width:100%;
  height:100%;

  object-fit:contain;
}

.collection-city{
  padding:
    10px 12px 4px;

  font-weight:800;

  font-size:14px;
}

.collection-status{
  padding:
    0 12px 12px;

  font-size:12px;

  color:#78909c;
}

.collection-item.obtained
.collection-status{
  color:#2e7d61;
}

/* =========================================================
   MODAL
========================================================= */

#modalOverlay{
  position:fixed;

  inset:0;

  z-index:500;

  background:
    rgba(0,0,0,.55);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;
}

#modalOverlay.show{
  display:flex;
}

.modal{
  width:min(
    680px,
    100%
  );

  max-height:
    calc(100vh - 40px);

  overflow:auto;

  background:#fff;

  border-radius:20px;

  padding:20px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.25);
}

.modal-title{
  font-size:22px;
  font-weight:800;
}

.modal-image{
  width:100%;
  max-height:380px;

  object-fit:contain;

  margin:
    15px auto;
}

.modal-info{
  display:grid;

  gap:8px;

  font-size:14px;
}

.modal-row{
  display:flex;

  gap:10px;
}

.modal-label{
  width:100px;

  color:#78909c;
}

.modal-value{
  flex:1;

  font-weight:600;
}

.modal-actions{
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:18px;
}

.modal-action{
  border:0;

  padding:
    10px 14px;

  border-radius:10px;

  cursor:pointer;

  background:#397b83;

  color:#fff;

  font-weight:700;
}

/* =========================================================
   HISTORY
========================================================= */

.history-filter{
  display:flex;

  gap:8px;

  margin-bottom:14px;

  overflow-x:auto;
}

.history-filter button{
  border:
    1px solid #d5e0e4;

  background:#fff;

  border-radius:999px;

  padding:
    8px 14px;

  cursor:pointer;
}

.history-filter button.active{
  background:#397b83;
  border-color:#397b83;
  color:#fff;
}

.history-card{
  background:#fff;

  border:
    1px solid #dce5e8;

  border-radius:14px;

  padding:14px;

  margin-bottom:10px;
}

.history-type{
  display:inline-block;

  margin-left:8px;

  padding:
    4px 8px;

  border-radius:999px;

  font-size:11px;

  font-weight:700;
}

.history-type.lid{
  background:#ffe5e5;
  color:#b71c1c;
}

.history-type.center{
  background:#fff3cd;
  color:#8a6500;
}

.history-type.stamp{
  background:#e6defd;
  color:#5e35b1;
}

/* =========================================================
   ERROR / LOADING
========================================================= */

.error-box{
  background:#fff1f1;

  color:#b71c1c;

  border:
    1px solid #ffcdd2;

  border-radius:14px;

  padding:20px;
}

.loading{
  padding:40px;

  text-align:center;

  color:#78909c;
}

/* =========================================================
   STAMP RALLY
========================================================= */

.stamp-event-card{
  background:#fff;

  border:
    1px solid #dce5e8;

  border-radius:16px;

  padding:16px;

  margin-bottom:14px;
}

.stamp-event-title{
  font-size:18px;
  font-weight:800;
}

.stamp-event-date{
  margin-top:5px;

  font-size:12px;

  color:#78909c;
}

.stamp-status{
  display:inline-block;

  margin-top:8px;

  padding:
    5px 9px;

  border-radius:999px;

  font-size:11px;

  font-weight:800;
}

.stamp-status.active{
  background:#e2f5ea;
  color:#287a52;
}

.stamp-status.upcoming{
  background:#fff3cd;
  color:#8a6500;
}

.stamp-status.ended{
  background:#eceff1;
  color:#607d8b;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  main{
    padding:14px;
  }

  .header-inner{
    align-items:flex-start;
  }

  .logo-title{
    font-size:17px;
  }

  .summary-card{
    flex:1;
    min-width:120px;
  }

  #regions{
    grid-template-columns:
      repeat(2,1fr);
  }

  .region-images{
    height:110px;
  }

  #prefectureGrid{
    grid-template-columns:1fr;
  }

  #collectionGrid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .panel-body{
    padding:14px;
  }

}

/* =========================================================
   MOBILE SMALL
========================================================= */

@media(max-width:420px){

  #regions{
    grid-template-columns:
      repeat(2,1fr);
    gap:10px;
  }

  .region-images{
    height:95px;
  }

  .region-info{
    padding:11px;
  }

  .region-name{
    font-size:15px;
  }

  .region-count{
    font-size:17px;
  }

  .summary{
    gap:8px;
  }

  .summary-card{
    min-width:100px;
    padding:12px;
  }

  .summary-value{
    font-size:20px;
  }

  #collectionGrid{
    gap:10px;
  }

}

/* =========================================================
   COLLECTION CHECK
========================================================= */

.collection-check{
  position:absolute;

  top:8px;
  right:8px;

  width:30px;
  height:30px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.92);

  box-shadow:
    0 2px 8px rgba(0,0,0,.12);

  font-size:16px;
}

.collection-item.obtained
.collection-check{
  background:#74b99f;
  color:#fff;
}

.collection-item.not-obtained
.collection-check{
  color:#90a4ae;
}

/* =========================================================
   STAMP EVENT
========================================================= */

.stamp-event-meta{
  margin-top:10px;

  display:flex;

  flex-wrap:wrap;

  gap:6px;
}

.stamp-event-location{
  font-size:12px;

  color:#607d8b;
}

.stamp-event-count{
  margin-top:10px;

  font-size:13px;

  color:#607d8b;
}

/* =========================================================
   EMPTY REGION
========================================================= */

.empty-region-message{
  background:#fff;

  border:
    1px solid #dce5e8;

  border-radius:16px;

  padding:25px;

  text-align:center;

  color:#78909c;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
  width:8px;
  height:8px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:#cbd8dc;
  border-radius:999px;
}

::-webkit-scrollbar-thumb:hover{
  background:#aebfc4;
}

</style>

</head>


<body>

<header>

  <div class="header-inner">

    <div>

      <div class="logo-title">
        Pokémon Japan Collection
      </div>

      <div class="logo-subtitle">
        日本寶可夢收集圖鑑
      </div>

    </div>

  </div>

</header>


<main>

  <!-- =====================================================
       TABS
  ====================================================== -->

  <div class="tabs">

    <button
      id="tabLid"
      class="tab active"
      onclick="switchCollectionType('lid')"
    >
      🔴 Poké Lid
    </button>

    <button
      id="tabCenter"
      class="tab"
      onclick="switchCollectionType('center')"
    >
      🏬 Pokémon Center
    </button>

    <button
      id="tabStamp"
      class="tab"
      onclick="switchCollectionType('stamp')"
    >
      🎟️ Stamp Rally
    </button>

  </div>


  <!-- =====================================================
       TITLE
  ====================================================== -->

  <div
    class="section-title"
    id="sectionTitle"
  >
    🔴 Poké Lid 蒐集進度
  </div>


  <div class="section-description">

    <span id="progressLabel">
      Poké Lid 已收集：
    </span>

    <span id="totalObtained">
      0
    </span>

    /

    <span id="totalCount">
      0
    </span>

  </div>


  <!-- =====================================================
       SUMMARY
  ====================================================== -->

  <div
    class="summary"
    id="summary"
  >

    <div class="summary-card">

      <div class="summary-label">
        已收集
      </div>

      <div
        class="summary-value"
        id="summaryObtained"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        總數
      </div>

      <div
        class="summary-value"
        id="summaryTotal"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        完成率
      </div>

      <div
        class="summary-value"
        id="summaryPercent"
      >
        0%
      </div>

    </div>

  </div>


  <!-- =====================================================
       REGION
  ====================================================== -->

  <div id="regions"></div>


  <!-- =====================================================
       HISTORY
  ====================================================== -->

  <section style="margin-top:40px">

    <div class="section-title">
      更新紀錄
    </div>


    <div class="history-filter">

      <button
        id="historyAll"
        class="active"
        onclick="setHistoryFilter('all')"
      >
        全部
      </button>

      <button
        id="historyLid"
        onclick="setHistoryFilter('lid')"
      >
        🔴 Poké Lid
      </button>

      <button
        id="historyCenter"
        onclick="setHistoryFilter('center')"
      >
        🏬 Pokémon Center
      </button>

      <button
        id="historyStamp"
        onclick="setHistoryFilter('stamp')"
      >
        🎟️ Stamp Rally
      </button>

    </div>


    <div id="history"></div>

  </section>

</main>


<!-- =======================================================
     PREFECTURE PANEL
======================================================= -->

<div
  id="prefecturePanel"
  class="panel"
  onclick="prefectureOverlayClick(event)"
>

  <div class="panel-content">

    <div class="panel-header">

      <button
        class="back-btn"
        onclick="closePrefecturePanel()"
      >
        ←
      </button>


      <div
        id="prefectureTitle"
        class="panel-title"
      >
        地區
      </div>

    </div>


    <div class="panel-body">

      <div
        id="prefectureSummary"
        class="section-description"
      >
        已收集 0 / 0
      </div>


      <div id="prefectureGrid"></div>

    </div>

  </div>

</div>


<!-- =======================================================
     COLLECTION PANEL
======================================================= -->

<div
  id="collectionPanel"
  class="panel"
>

  <div class="panel-content">

    <div class="panel-header">

      <button
        class="back-btn"
        onclick="backToPrefectureList()"
      >
        ←
      </button>


      <div
        id="collectionTitle"
        class="panel-title"
      >
        收集
      </div>

    </div>


    <div class="panel-body">

      <div
        id="collectionSummary"
        class="section-description"
      >
        已收集 0 / 0
      </div>


      <div id="collectionGrid"></div>

    </div>

  </div>

</div>


<!-- =======================================================
     MODAL
======================================================= -->

<div
  id="modalOverlay"
  onclick="modalOverlayClick(event)"
>

  <div class="modal">

    <div id="modalContent"></div>

  </div>

</div>

/* =========================================================
   FETCH
========================================================= */

async function fetchJSON(url){

  const response =
    await fetch(
      url +
      (
        url.includes("?")
        ? "&"
        : "?"
      ) +
      "t=" +
      Date.now()
    );


  if(
    !response.ok
  ){

    throw new Error(
      `${response.status} ${response.statusText}`
    );

  }


  return response.json();

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeList(json){

  if(
    Array.isArray(json)
  ){

    return json;

  }


  if(
    Array.isArray(json.list)
  ){

    return json.list;

  }


  if(
    Array.isArray(json.data)
  ){

    return json.data;

  }


  if(
    Array.isArray(json.items)
  ){

    return json.items;

  }


  return [];

}


/* =========================================================
   ITEM ID
========================================================= */

function getItemId(item){

  return String(

    item.id ??
    item.ID ??
    item.key ??
    item.name ??
    item.title ??
    JSON.stringify(item)

  );

}


/* =========================================================
   PREFECTURE CODE
========================================================= */

function getPrefCode(item){

  const candidates = [

    item.__prefCode,

    item.prefCode,

    item.pref_code,

    item.prefectureCode,

    item.prefecture_code,

    item.pref,

    item.prefecture

  ];


  for(
    const value
    of candidates
  ){

    if(
      value === undefined ||
      value === null ||
      value === ""
    ){

      continue;

    }


    const n =
      Number(value);


    if(
      Number.isFinite(n) &&
      PREF[n]
    ){

      return n;

    }


    const text =
      String(value)
        .trim();


    for(
      const [
        code,
        name
      ]
      of Object.entries(PREF)
    ){

      if(
        text === name ||
        text.includes(name)
      ){

        return Number(code);

      }

    }

  }


  return null;

}


/* =========================================================
   TITLE
========================================================= */

function getItemTitle(
  type,
  item
){

  if(
    type === "stamp"
  ){

    return String(

      item.name ??
      item.location ??
      item.title ??
      item.city ??
      "Stamp Rally"

    );

  }


  if(
    type === "center"
  ){

    return String(

      item.name ??
      item.title ??
      item.city ??
      "Pokémon Center"

    );

  }


  return String(

    item.name ??
    item.title ??
    item.city ??
    "Poké Lid"

  );

}


/* =========================================================
   IMAGE
========================================================= */

function getItemImageUrl(
  type,
  item
){

  const value =

    item.image ??
    item.imageUrl ??
    item.image_url ??
    item.stampImage ??
    item.stamp_image ??
    item.icon ??
    item.iconUrl ??
    item.photo ??
    "";


  return String(
    value || ""
  );

}


/* =========================================================
   STAMP STATUS
========================================================= */

function getStampStatus(
  item
){

  if(
    item.status
  ){

    const value =
      String(
        item.status
      ).toLowerCase();


    if(
      [
        "active",
        "upcoming",
        "ended"
      ].includes(value)
    ){

      return value;

    }

  }


  const now =
    new Date();


  const start =
    item.startDate
      ? new Date(
          item.startDate
        )
      : null;


  const end =
    item.endDate
      ? new Date(
          item.endDate +
          "T23:59:59"
        )
      : null;


  if(
    start &&
    now < start
  ){

    return "upcoming";

  }


  if(
    end &&
    now > end
  ){

    return "ended";

  }


  return "active";

}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function storageKey(
  type
){

  return (
    "pokemon_collection_" +
    type
  );

}


function loadLocalCollection(
  type
){

  try{

    const raw =
      localStorage.getItem(
        storageKey(type)
      );


    if(
      !raw
    ){

      return;

    }


    const parsed =
      JSON.parse(raw);


    if(
      Array.isArray(parsed)
    ){

      obtainedIds[type] =
        new Set(
          parsed.map(
            String
          )
        );

    }

  }catch(error){

    console.warn(
      "Local collection load error:",
      error
    );

  }

}


function saveLocalCollection(
  type
){

  try{

    localStorage.setItem(

      storageKey(type),

      JSON.stringify(
        [
          ...obtainedIds[type]
        ]
      )

    );

  }catch(error){

    console.warn(
      "Local collection save error:",
      error
    );

  }

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadDataSet(
  type
){

  try{

    const json =
      await fetchJSON(
        DATA_URLS[type]
      );


    const list =
      normalizeList(
        json
      );


    dataSets[type] =
      list.map(
        item => {

          const copy =
            {
              ...item
            };


          copy.__prefCode =
            getPrefCode(
              copy
            );


          return copy;

        }
      );


    buildGroups(
      type
    );

  }catch(error){

    console.error(
      `${type} load failed:`,
      error
    );


    dataSets[type] =
      [];


    groups[type] =
      {};

  }

}


/* =========================================================
   GROUP
========================================================= */

function buildGroups(
  type
){

  groups[type] =
    {};


  for(
    const item
    of dataSets[type]
  ){

    const code =
      Number(
        item.__prefCode
      );


    const prefName =
      PREF[code];


    if(
      !prefName
    ){

      continue;

    }


    if(
      !groups[type][prefName]
    ){

      groups[type][prefName] =
        [];

    }


    groups[type][prefName]
      .push(item);

  }

}

        <div class="modal-label">
          地址
        </div>

        <div class="modal-value">

          ${escapeHtml(
            item.address
          )}

        </div>

      </div>

    `;

  }


  /* =======================================================
     COORDINATES
  ====================================================== */

  const lat =
    item.lat ??
    (
      Array.isArray(
        item.coords
      )
      ?
      item.coords[0]
      :
      null
    );


  const lng =
    item.lng ??
    item.lon ??
    (
      Array.isArray(
        item.coords
      )
      ?
      item.coords[1]
      :
      null
    );


  if(
    lat !== null &&
    lng !== null &&
    lat !== "" &&
    lng !== ""
  ){

    html += `

      <div class="modal-row">

        <div class="modal-label">
          座標
        </div>

        <div class="modal-value">

          ${escapeHtml(
            lat
          )}
          ,
          ${escapeHtml(
            lng
          )}

        </div>

      </div>

    `;

  }


  /* =======================================================
     EXTRA INFORMATION
  ====================================================== */

  if(
    item.description
  ){

    html += `

      <div class="modal-row">

        <div class="modal-label">
          說明
        </div>

        <div class="modal-value">

          ${escapeHtml(
            item.description
          )}

        </div>

      </div>

    `;

  }


  html += `

    </div>

    <div class="modal-actions">

  `;


  /* =======================================================
     COLLECTION BUTTON
  ====================================================== */

  html += `

    <button
      class="modal-action"
      onclick="
        toggleObtained(
          '${escapeHtml(
            getItemId(item)
          )}'
        )
      "
    >

      ${
        obtained
          ?
          "↩️ 設為未收集"
          :
          "✅ 標記已收集"
      }

    </button>

  `;


  /* =======================================================
     MAP BUTTONS
  ====================================================== */

  if(
    lat !== null &&
    lng !== null &&
    lat !== "" &&
    lng !== "" &&
    Number.isFinite(Number(lat)) &&
    Number.isFinite(Number(lng))
  ){

    html += `

      <button
        class="modal-action"
        onclick="
          openGoogleMaps(
            ${Number(lat)},
            ${Number(lng)}
          )
        "
      >
        Google Maps
      </button>


      <button
        class="modal-action"
        onclick="
          openAppleMaps(
            ${Number(lat)},
            ${Number(lng)}
          )
        "
      >
        Apple Maps
      </button>

    `;

  }


  html += `

    </div>

  `;


  document.getElementById(
    "modalContent"
  ).innerHTML =
    html;


  document
    .getElementById(
      "modalOverlay"
    )
    .classList
    .add(
      "show"
    );

}


/* =========================================================
   TOGGLE OBTAINED
========================================================= */

function toggleObtained(
  id
){

  const set =
    obtainedIds[
      collectionType
    ];


  const normalizedId =
    String(id);


  if(
    set.has(
      normalizedId
    )
  ){

    set.delete(
      normalizedId
    );

  }else{

    set.add(
      normalizedId
    );

  }


  saveLocalCollection(
    collectionType
  );


  updateOverall();

  renderRegions();


  if(
    currentRegion
  ){

    renderPrefectureSummary();

    renderPrefectureGrid();

  }


  if(
    currentPrefecture
  ){

    currentCollectionItems =
      groups[
        collectionType
      ][
        currentPrefecture
      ] ||
      [];


    updateCollectionSummary();

    renderCollectionGrid();

  }


  if(
    currentItem
  ){

    openModalFromItem(
      currentItem
    );

  }

}


/* =========================================================
   MODAL CLOSE
========================================================= */

function closeModal(){

  document
    .getElementById(
      "modalOverlay"
    )
    .classList
    .remove(
      "show"
    );

}


function modalOverlayClick(
  event
){

  if(
    event.target ===
    document.getElementById(
      "modalOverlay"
    )
  ){

    closeModal();

  }

}


/* =========================================================
   GOOGLE MAPS
========================================================= */

function openGoogleMaps(
  lat,
  lng
){

  window.open(

    `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,

    "_blank"

  );

}


/* =========================================================
   APPLE MAPS
========================================================= */

function openAppleMaps(
  lat,
  lng
){

  window.open(

    `https://maps.apple.com/?ll=${lat},${lng}`,

    "_blank"

  );

}


/* =========================================================
   BACK
========================================================= */

function backToPrefectureList(){

  closeModal();


  document
    .getElementById(
      "collectionPanel"
    )
    .classList
    .remove(
      "show"
    );


  renderPrefectureSummary();

  renderPrefectureGrid();


  document
    .getElementById(
      "prefecturePanel"
    )
    .classList
    .add(
      "show"
    );

}


/* =========================================================
   HISTORY FILE
========================================================= */

async function loadHistoryFile(
  type
){

  try{

    const json =
      await fetchJSON(
        HISTORY_URLS[type]
      );


    return (

      json.history ||
      []

    ).map(

      entry => ({

        ...entry,

        type

      })

    );

  }catch(error){

    console.warn(
      `${type} history load failed:`,
      error
    );


    return [];

  }

}


/* =========================================================
   LOAD HISTORY
========================================================= */

async function loadHistory(){

  const [
    lidHistory,
    centerHistory,
    stampHistory
  ] =

    await Promise.all([

      loadHistoryFile(
        "lid"
      ),

      loadHistoryFile(
        "center"
      ),

      loadHistoryFile(
        "stamp"
      )

    ]);


  historyEntries = [

    ...lidHistory,

    ...centerHistory,

    ...stampHistory

  ];


  historyEntries.sort(

    (a,b) =>

      new Date(
        b.time ||
        0
      ) -

      new Date(
        a.time ||
        0
      )

  );


  renderHistory();

}


/* =========================================================
   HISTORY FILTER
========================================================= */

function setHistoryFilter(
  filter
){

  currentHistoryFilter =
    filter;


  [
    "All",
    "Lid",
    "Center",
    "Stamp"
  ].forEach(
    name => {

      const id =
        "history" +
        name;


      const el =
        document.getElementById(
          id
        );


      if(
        el
      ){

        let mappedFilter =
          "all";


        if(
          name === "Lid"
        ){

          mappedFilter =
            "lid";

        }
        else if(
          name === "Center"
        ){

          mappedFilter =
            "center";

        }
        else if(
          name === "Stamp"
        ){

          mappedFilter =
            "stamp";

        }


        el.classList.toggle(

          "active",

          mappedFilter ===
          filter

        );

      }

    }
  );


  renderHistory();

}


/* =========================================================
   HISTORY RENDER
========================================================= */

function renderHistory(){

  const el =
    document.getElementById(
      "history"
    );


  let logs =
    historyEntries;


  if(
    currentHistoryFilter !==
    "all"
  ){

    logs =
      logs.filter(
        item =>
          item.type ===
          currentHistoryFilter
      );

  }


  if(
    !logs.length
  ){

    el.innerHTML = `

      <span class="muted">

        尚無更新紀錄。

      </span>

    `;

    return;

  }


  el.innerHTML =

    logs
      .slice(
        0,
        50
      )
      .map(

        item => {

          let typeName = "";


          if(
            item.type === "lid"
          ){

            typeName =
              "Poké Lid";

          }
          else if(
            item.type === "center"
          ){

            typeName =
              "Pokémon Center";

          }
          else{

            typeName =
              "🎟️ Stamp Rally";

          }


          return `

            <div class="history-card">

              <b>

                ${escapeHtml(
                  item.time ||
                  ""
                )}

              </b>


              <span
                class="history-type ${
                  item.type
                }"
              >

                ${typeName}

              </span>


              <br>


              <span class="muted">

                版本：
                ${escapeHtml(
                  item.total ?? 
                  ""
                )}
                筆

              </span>


              <br>


              🟢 新增
              ${
                (
                  item.added ||
                  []
                ).length
              }


              　


              🔴 移除
              ${
                (
                  item.removed ||
                  []
                ).length
              }


              　


              🟡 修改
              ${
                (
                  item.changed ||
                  []
                ).length
              }

            </div>

          `;

        }

      )
      .join("");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,

    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[char])

  );

}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
  "keydown",

  event => {

    if(
      event.key !==
      "Escape"
    ){

      return;

    }


    const modal =
      document.getElementById(
        "modalOverlay"
      );


    const collection =
      document.getElementById(
        "collectionPanel"
      );


    const prefecture =
      document.getElementById(
        "prefecturePanel"
      );


    if(
      modal.classList.contains(
        "show"
      )
    ){

      closeModal();

      return;

    }


    if(
      collection.classList.contains(
        "show"
      )
    ){

      backToPrefectureList();

      return;

    }


    if(
      prefecture.classList.contains(
        "show"
      )
    ){

      closePrefecturePanel();

    }

  }

);
