<style>

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,"Noto Sans TC",sans-serif;
  max-width:1200px;
  margin:24px auto;
  padding:0 16px;
  background:#f5f6f8;
  color:#222;

h1{

}

.box{
  background:#fff;
  padding:18px;
  border-radius:12px;
  margin:12px 0;

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  margin:4px;
  cursor:pointer;
  background:#222;
  color:#fff;
}

button:disabled{
  opacity:.5;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(230px,1fr));
  gap:10px;
}

  background:#fff;
  padding:12px;
  border-radius:10px;
  box-shadow:0 1px 4px #ddd;

.muted{

  font-size:13px;
}

code,
pre{
  background:#111;
  color:#eee;
  border-radius:8px;
}

pre{
  padding:12px;
  overflow:auto;
}


/* =========================
   MAP
========================= */

  height:700px;
  border-radius:12px;
  overflow:hidden;
}

.map-wrapper{
  position:relative;
}


/* 行政區 Hover Tooltip */

  font-size:14px;
  font-weight:bold;
}


/* 行政區名稱數量 Marker */

  background:#222;
  color:#fff;

  border:3px solid #fff;

  padding:8px 14px;

    0 2px 8px rgba(0,0,0,.35);

  font-size:15px;
  font-weight:bold;

  white-space:nowrap;
}


/* Poké Lid 小點 */

.poke-dot{
  width:14px;
  height:14px;

  background:#e53935;

  border:2px solid #fff;

  border-radius:50%;

  box-shadow:
    0 1px 5px rgba(0,0,0,.45);

  touch-action:manipulation;
}


/* =========================
   FLOAT CARD
========================= */

#pokeCardOverlay{

  position:fixed;

  inset:0;

  z-index:9999;

  display:none;

  align-items:center;
  justify-content:center;

  pointer-events:none;
}

#pokeCard{

  width:min(430px,calc(100vw - 24px));

  max-height:
    calc(100vh - 24px);

  overflow:auto;

  background:#fff;

  border-radius:18px;

  box-shadow:
    0 15px 50px rgba(0,0,0,.35);

  padding:20px;

  position:relative;

  pointer-events:auto;

  -webkit-overflow-scrolling:touch;

  touch-action:auto;
}


/* 關閉 */

#pokeCardClose{

  position:absolute;

  right:10px;
  top:10px;

  width:38px;
  height:38px;

  padding:0;
  margin:0;

  border-radius:50%;

  background:#222;

  color:#fff;

  font-size:22px;

  line-height:38px;
}


/* 圖片 */

#pokeCardImage{

  width:100%;

  max-height:280px;

  object-fit:contain;

  border-radius:12px;

  background:#f3f3f3;

  margin-bottom:14px;

  display:none;
}


/* 標題 */

.poke-title{

  font-size:22px;

  font-weight:bold;

  padding-right:45px;

  margin-bottom:14px;
}


/* 資料列 */

.info-row{

  margin:9px 0;

  line-height:1.5;

}


/* 座標按鈕 */

.coord-button{

  width:100%;

  margin:10px 0 0;

  padding:13px;

  background:#f1f1f1;

  color:#222;

  border:1px solid #ddd;

  font-family:monospace;

  font-size:15px;

  cursor:pointer;

  touch-action:manipulation;

  user-select:none;

  -webkit-user-select:none;
}

.coord-button:hover{

  background:#e7e7e7;

}

.coord-copied{

  background:#198754 !important;

  color:#fff !important;

  border-color:#198754 !important;

}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  body{

    margin:10px auto;

  }

  #map{

    height:620px;

  }

  #pokeCard{

  }

  }

/* =========================
   LEAFLET
========================= */

.leaflet-tooltip{

  font-size:14px;

  font-weight:bold;

/* =========================================================
   HISTORY
========================================================= */

async function loadHistory(){

  try{

    const r=
      await fetch(
        "history.json?ts="+Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!r.ok)
      throw Error();


    const h=
      await r.json();


    const el=
      document.getElementById(
        "history"
      );


    const logs=
      h.history || [];


    if(!logs.length){

      el.innerHTML=
        '<span class="muted">尚無更新紀錄。</span>';

      return;

    }


    el.innerHTML=

      logs
      .slice()
      .reverse()
      .slice(0,50)
      .map(item=>{

        const added=
          item.added || [];

        const removed=
          item.removed || [];

        const changed=
          item.changed || [];


        return `

        <div
          class="card"
          style="margin:8px 0">

          <b>
            ${escapeHtml(
              item.time || ""
            )}
          </b>

          <br>

          <span class="muted">

            版本：
            ${item.total ?? ""} 筆

          </span>

          <br>

          🟢 新增 ${added.length}

         　

          🔴 移除 ${removed.length}

         　

          🟡 修改 ${changed.length}


          ${
            added.length ||
            removed.length ||
            changed.length

            ?

            `

            <details>

              <summary>
                查看變更
              </summary>


              ${
                added.length

                ?

                `<b>新增</b><br>

                ${
                  added
                  .map(x=>
                    `＋
                    ${escapeHtml(x.prefecture||"")}
                    ｜
                    ${escapeHtml(x.title||"")}
                    ｜
                    ${x.lat},${x.lng}`
                  )
                  .join("<br>")
                }

                <br>`

                :

                ""
              }


              ${
                removed.length

                ?

                `<b>移除</b><br>

                ${
                  removed
                  .map(x=>
                    `－
                    ${escapeHtml(x.prefecture||"")}
                    ｜
                    ${escapeHtml(x.title||"")}
                    ｜
                    ${x.lat},${x.lng}`
                  )
                  .join("<br>")
                }

                <br>`

                :

                ""
              }


              ${
                changed.length

                ?

                `<b>修改</b><br>

                ${
                  changed
                  .map(x=>
                    `↔
                    ${escapeHtml(x.prefecture||"")}
                    ｜
                    ${escapeHtml(x.title||"")}`
                  )
                  .join("<br>")
                }`

                :

                ""
              }

            </details>

            `

            :

            ""

          }

        </div>

        `;

      })
      .join("");


    document.getElementById(
      "syncInfo"
    ).textContent=

      `GitHub 最新同步：
      ${h.last_sync||"未知"}
      ｜每 5 分鐘自動檢查一次`;

  }

  catch(e){

    document.getElementById(
      "history"
    ).textContent=
      "尚無 History 資料。";

  }

}


/* =========================================================
   LOAD DATA
========================================================= */

fetch(

  DATA_URL+
  "?ts="+Date.now(),

  {
    cache:"no-store"
  }

)

.then(r=>{

  if(!r.ok)

    throw Error(
      "GitHub 資料無法取得"
    );

  return r.json();

})

.then(j=>{

  /*
    支援：

    {
      list:[]
    }

    或直接 []
  */

  data=
    Array.isArray(j)
      ? j
      : (j.list || []);


  groups={};


  for(
    const x of data
  ){

    const p=
      PREF[x.pref] ||
      String(x.pref);


    if(!groups[p])
      groups[p]=[];


    groups[p].push(x);

  }


  document.getElementById(
    "status"
  ).textContent=

    `已載入 ${data.length} 筆，
    共 ${Object.keys(groups).length}
    個都道府縣。`;


  ["all","json","csv"]
  .forEach(id=>{

    document
      .getElementById(id)
      .disabled=false;

  });


  render();

  renderMap();

  loadHistory();

})

.catch(e=>{

  document.getElementById(
    "status"
  ).textContent=
    "載入失敗："+e.message;

});



/* =========================================================
   DOWNLOAD FUNCTIONS
========================================================= */

function safe(s){

  return String(s)
    .replace(
      /[\\/:*?"<>|]/g,
      "_"
    );

}


function blob(
  s,
  type="text/plain;charset=utf-8"
){

  return new Blob(
    ["\ufeff",s],
    {
      type:type
    }
  );

}


function save(b,n){

  const a=
    document.createElement("a");


  a.href=
    URL.createObjectURL(b);


  a.download=n;


  document.body.appendChild(a);


  a.click();


  a.remove();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        a.href
      );
    },
    1000
  );

}


function txt(
  items,
  groupName
){

  return items
    .map(x=>
      `${x.coords[0]},
      ${x.coords[1]},
      ${x.city||groupName}`
    )
    .map(x=>
      x.replace(/\s+/g," ")
    )
    .join("\n");

}


function one(p){

  save(

    blob(
      txt(groups[p],p)
    ),

    `${safe(p)}.txt`

  );

}


function downloadAll(){

  let out=[];


  for(
    const p of
    Object.keys(groups).sort()
  ){

    out.push(
      `# ===== ${p} (${groups[p].length}) =====`
    );


    out.push(
      txt(groups[p],p),
      ""
    );

  }


  save(

    blob(
      out.join("\n")
    ),

    "poke_lid_2026_by_prefecture.txt"

  );

}


function downloadJSON(){

  const out={};


  for(
    const p of
    Object.keys(groups).sort()
  ){

    out[p]=

      groups[p]
      .map(x=>({

        lat:
          String(
            x.coords[0]
          ),

        lng:
          String(
            x.coords[1]
          ),

        title:
          String(
            x.city||p
          )

      }));

  }


  save(

    new Blob(

      [
        JSON.stringify(
          out,
          null,
          0
        )
      ],

      {
        type:
          "application/json;charset=utf-8"
      }

    ),

    "poke_lid_2026_favorite_lists.json"

  );

}


function downloadCSV(){

  const rows=[

    [
      "id",
      "prefecture",
      "city",
      "lat",
      "lng",
      "name",
      "address",
      "pokemons"
    ]

  ];


  for(
    const x of data
  ){

    rows.push([

      x.id,

      PREF[x.pref] ||
        x.pref,

      x.city || "",

      x.coords?.[0] ||
        "",

      x.coords?.[1] ||
        "",

      x.city || "",

      x.address || "",

      (x.pokemons||[])
        .join("|")

    ]);

  }


  const csv=

    rows
    .map(r=>

      r.map(v=>

        `"${String(v)
          .replaceAll(
            '"',
            '""'
          )}"`

      ).join(",")

    )
    .join("\n");


  save(

    blob(
      csv,
      "text/csv;charset=utf-8"
    ),

    "poke_lid_2026.csv"

  );

}



/* =========================================================
   GROUP LIST
========================================================= */

function render(){

  const el=
    document.getElementById(
      "groups"
    );


  el.innerHTML="";


  for(
    const p of
    Object.keys(groups).sort()
  ){

    const items=
      groups[p];


    const d=
      document.createElement("div");


    d.className="card";


    d.innerHTML=`

      <b>
        ${escapeHtml(p)}
      </b>

      <br>

      <span class="muted">

        ${items.length}
        個 Poké Lid

      </span>

      <br>

      <button
        onclick='one(${JSON.stringify(p)})'>

        下載此都道府縣 TXT

      </button>

    `;


    el.appendChild(d);

  }

}

========================================================= */

let prefectureLayers={};

let selectedPrefecture=null;

const PREF_CENTER={

/* =========================================================
   INIT MAP
========================================================= */

function initMap(){

  if(map)
    return;


  map=
    L.map(
      "map",
      {

        zoomControl:true,

        scrollWheelZoom:true,

        doubleClickZoom:true,

        touchZoom:true,

        dragging:true,

        tap:true

      }
    );


  /*
    日本預設：

    Zoom 6
  */

  map.setView(
    [36.2,138.3],
    6
  );


  /*
    =========================
    Point Layer
    =========================
  */

  pointLayer=
    L.layerGroup()
      .addTo(map);


  /*
    =========================
    GeoJSON
    =========================
  */

  fetch(
    "prefectures.geojson?ts="+Date.now(),
    {
      cache:"no-store"
    }
  )

  .then(r=>{

    if(!r.ok){

      throw Error(
        "prefectures.geojson 載入失敗"
      );

    }

    return r.json();

  })

  .then(geo=>{

    L.geoJSON(

      geo,

      {

        style:function(){

          return {

            color:"#555",

            weight:1,

            fillColor:"#dfe3e8",

            fillOpacity:.65

          };

        },


        onEachFeature:
        function(
          feature,
          layer
        ){

          /*
            支援不同 GeoJSON 欄位名稱
          */

          const name=

            feature.properties.name ||

            feature.properties.nam_ja ||

            feature.properties.N03_001 ||

            feature.properties.NAME_1 ||

            feature.properties.NAME;


          if(!name)
            return;


          const items=
            groups[name] || [];


          /*
            =========================
            Hover Tooltip
            =========================
          */

          layer.bindTooltip(

            `${escapeHtml(name)}
            　<b>${items.length}</b> 個`,

            {

              sticky:true,

              direction:"top",

              className:
                "pref-tooltip"

            }

          );


          /*
            =========================
            Mouse Over
            =========================
          */

          layer.on(
            "mouseover",
            function(){

              layer.setStyle({

                weight:2,

                fillOpacity:.85

              });

              layer.bringToFront();

            }
          );


          /*
            =========================
            Mouse Out
            =========================
          */

          layer.on(
            "mouseout",
            function(){

              layer.setStyle({

                weight:1,

                fillOpacity:.65

              });

            }
          );


          /*
            =========================
            CLICK
            =========================

            PC：

            mouse click


            Mobile：

            touch → Leaflet click
          */

          layer.on(
            "click",
            function(e){

              if(e){

                L.DomEvent
                  .stopPropagation(e);

              }


              showPrefecture(
                name
              );

            }
          );


          /*
            =========================
            TOUCH START
            =========================
          */

          layer.on(
            "touchstart",
            function(e){

              if(e){

                L.DomEvent
                  .stopPropagation(e);

              }

            }
          );


          /*
            =========================
            TOUCH END
            =========================
          */

          layer.on(
            "touchend",
            function(e){

              if(e){

                L.DomEvent
                  .stopPropagation(e);

              }


              /*
                手機直接執行

                避免某些 Safari /
                Chrome 沒有轉成 click
              */

              clearTimeout(
                layer._touchTimer
              );


              layer._touchTimer=

                setTimeout(
                  ()=>{

                    showPrefecture(
                      name
                    );

                  },
                  30
                );

            }
          );


          /*
            儲存 layer
          */

          prefectureLayers[name]=
            layer;

        }

      }

    ).addTo(map);

  })

  .catch(err=>{

    console.error(err);

  });


  /*
    =========================
    Map blank click
    =========================
  */

  map.on(
    "click",
    function(){

      if(
        selectedPrefecture
      ){

        closePokeCard();


        selectedPrefecture=
          null;


        pointLayer.clearLayers();


        map.setView(
          [36.2,138.3],
          6
        );

      }

    }
  );

}



/* =========================================================
   RENDER MAP
========================================================= */

function renderMap(){

  initMap();

}



/* =========================================================
   SHOW PREFECTURE
========================================================= */

function showPrefecture(p){

  const items=
    groups[p] || [];


  selectedPrefecture=
    p;


  /*
    關閉原本小卡
  */

  closePokeCard();


  /*
    清除舊點
  */

  pointLayer.clearLayers();


  /*
    =========================
    移動地圖
    =========================
  */

  const layer=
    prefectureLayers[p];


  if(layer){

    const bounds=
      layer.getBounds();


    if(bounds.isValid()){

      map.fitBounds(

        bounds,

        {

          padding:[
            70,
            70
          ],

          maxZoom:9,

          animate:true,

          duration:.4

        }

      );

    }

  }

  else{

    const center=
      PREF_CENTER[p] ||
      [36.2,138.3];


    map.setView(

      center,

      8,

      {
        animate:true
      }

    );

  }


  /*
    =========================
    建立小點
    =========================
  */

  let validCount=0;


  for(
    const x of items
  ){

    const lat=
      Number(
        x.coords?.[0]
      );


    const lng=
      Number(
        x.coords?.[1]
      );


    /*
      無效座標跳過
    */

    if(

      !Number.isFinite(lat) ||

      !Number.isFinite(lng)

    ){

      continue;

    }


    validCount++;


    /*
      =========================
      Icon
      =========================
    */

    const icon=
      L.divIcon({

        className:"",

        html:
          `<div class="poke-dot"></div>`,

        iconSize:[
          14,
          14
        ],

        iconAnchor:[
          7,
          7
        ]

      });


    /*
      =========================
      Marker
      =========================
    */

    const marker=
      L.marker(

        [
          lat,
          lng
        ],

        {

          icon:icon,

          interactive:true,

          keyboard:true,

          bubblingMouseEvents:false

        }

      );


    marker.addTo(
      pointLayer
    );


    /*
      =========================
      PC CLICK
      =========================
    */

    marker.on(
      "click",
      function(e){

        if(e){

          L.DomEvent
            .stopPropagation(e);

        }


        showPokeCard(x);

      }
    );


    /*
      =========================
      MOBILE TOUCH
      =========================
    */

    marker.on(
      "touchstart",
      function(e){

        if(e){

          L.DomEvent
            .stopPropagation(e);

        }

      }
    );


    marker.on(
      "touchend",
      function(e){

        if(e){

          L.DomEvent
            .stopPropagation(e);

        }


        showPokeCard(x);

      }
    );

  }


  console.log(

    `[Poké Lid]
    ${p}：
    ${validCount}/${items.length}
    個點位`

  );

}



/* =========================================================
   SHOW POKE CARD
========================================================= */

function showPokeCard(x){

  const overlay=
    document.getElementById(
      "pokeCardOverlay"
    );


  const title=
    document.getElementById(
      "pokeCardTitle"
    );


  const content=
    document.getElementById(
      "pokeCardContent"
    );


  const image=
    document.getElementById(
      "pokeCardImage"
    );


  /*
    =========================
    座標
    =========================
  */

  const lat=
    Number(
      x.coords?.[0]
    );


  const lng=
    Number(
      x.coords?.[1]
    );


  const coord=
    `${lat},${lng}`;


  /*
    =========================
    Title
    =========================
  */

  title.textContent=
    x.city ||
    x.title ||
    "Poké Lid";


  /*
    =========================
    Image
    =========================
  */

  const imageUrl=

    x.image ||

    x.image_url ||

    x.imageUrl ||

    x.picture ||

    "";


  if(imageUrl){

    image.src=
      imageUrl;

    image.style.display=
      "block";


    image.onerror=
      function(){

        image.style.display=
          "none";

      };

  }

  else{

    image.style.display=
      "none";

  }


  /*
    =========================
    Content
    =========================
  */

  content.innerHTML=`

    <div class="info-row">

      <b>都道府縣：</b>

      ${escapeHtml(
        PREF[x.pref] ||
        x.pref ||
        ""
      )}

    </div>


    <div class="info-row">

      <b>地點：</b>

      ${escapeHtml(
        x.city ||
        x.title ||
        ""
      )}

    </div>


    <div class="info-row">

      <b>地址：</b>

      ${escapeHtml(
        x.address ||
        "無資料"
      )}

    </div>


    <div class="info-row">

      <b>Pokémon：</b>

      ${escapeHtml(
        (x.pokemons||[])
          .join("、") ||
        "無資料"
      )}

    </div>


    <div class="info-row">

      <b>座標：</b>

    </div>


    <button
      id="copyCoordButton"
      class="coord-button"
      type="button">

      📍 ${coord}

    </button>

  `;


  /*
    =========================
    Copy Button
    =========================
  */

  const copyButton=
    document.getElementById(
      "copyCoordButton"
    );


  function copyCoordinate(e){

    /*
      非常重要：

      阻止事件跑到 Leaflet map
    */

    if(e){

      e.preventDefault();

      e.stopPropagation();

    }


    /*
      Clipboard API
    */

    if(

      navigator.clipboard &&

      window.isSecureContext

    ){

      navigator.clipboard
        .writeText(coord)

        .then(()=>{

          copiedFeedback(
            copyButton
          );

        })

        .catch(()=>{

          fallbackCopy(
            coord,
            copyButton
          );

        });

    }

    else{

      fallbackCopy(
        coord,
        copyButton
      );

    }

  }


  /*
    PC
  */

  copyButton.addEventListener(
    "click",
    copyCoordinate
  );


  /*
    Mobile
  */

  copyButton.addEventListener(

    "touchend",

    copyCoordinate,

    {
      passive:false
    }

  );


  /*
    防止 touch 穿透
  */

  copyButton.addEventListener(

    "touchstart",

    function(e){

      e.stopPropagation();

    },

    {
      passive:true
    }

  );


  /*
    禁止卡片事件穿透 Leaflet
  */

  L.DomEvent
    .disableClickPropagation(
      document.getElementById(
        "pokeCard"
      )
    );


  L.DomEvent
    .disableScrollPropagation(
      document.getElementById(
        "pokeCard"
      )
    );


  /*
    顯示
  */

  overlay.style.display=
    "flex";

}



/* =========================================================
   FALLBACK COPY
========================================================= */

function fallbackCopy(
  text,
  button
){

  const textarea=
    document.createElement(
      "textarea"
    );


  textarea.value=
    text;


  textarea.style.position=
    "fixed";


  textarea.style.left=
    "-9999px";


  document.body.appendChild(
    textarea
  );


  textarea.focus();

  textarea.select();


  try{

    document.execCommand(
      "copy"
    );


    copiedFeedback(
      button
    );

  }

  catch(e){

    alert(
      "複製失敗，請手動複製座標："+text
    );

  }


  textarea.remove();

}



/* =========================================================
   COPIED FEEDBACK
========================================================= */

function copiedFeedback(
  button
){

  const oldText=
    button.textContent;


  button.textContent=
    "✓ 已複製";


  button.classList.add(
    "coord-copied"
  );


  setTimeout(
    ()=>{

      button.textContent=
        oldText;


      button.classList.remove(
        "coord-copied"
      );

    },
    1500
  );

}



/* =========================================================
   CLOSE CARD
========================================================= */

function closePokeCard(){

  const overlay=
    document.getElementById(
      "pokeCardOverlay"
    );


  overlay.style.display=
    "none";

}



/* =========================================================
   CLOSE BUTTON
========================================================= */

document
  .getElementById(
    "pokeCardClose"
  )
  .addEventListener(
    "click",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      closePokeCard();

    }
  );



/* =========================================================
   CARD OUTSIDE CLICK
========================================================= */

document
  .getElementById(
    "pokeCardOverlay"
  )
  .addEventListener(
    "click",
    function(e){

      const overlay=
        document.getElementById(
          "pokeCardOverlay"
        );


      /*
        只有點到卡片外層
        才關閉
      */

      if(
        e.target === overlay
      ){

        closePokeCard();

      }

    }
  );



/* =========================================================
   CARD TOUCH
========================================================= */

document
  .getElementById(
    "pokeCard"
  )
  .addEventListener(
    "touchstart",
    function(e){

      e.stopPropagation();

    },
    {
      passive:true
    }
  );



/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Escape"
    ){

      closePokeCard();

    }

  }
);



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(s){

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      m=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m])
    );

}
