<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>
  Pokémon Japan Collection｜日本寶可夢收集圖鑑
</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;

  background:#e9f7fb;
  color:#315f66;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
}

.no-scroll{
  overflow:hidden;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  border-radius:24px;

  padding:
    28px
    24px
    22px;

  text-align:center;

  margin-bottom:18px;

  position:relative;

  overflow:hidden;
}

.header:before,
.header:after{
  content:"";

  position:absolute;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .45
    );
}

.header:before{
  width:140px;
  height:140px;

  top:-70px;
  left:-40px;
}

.header:after{
  width:180px;
  height:180px;

  right:-70px;
  bottom:-90px;
}

.logo-title{
  position:relative;
  z-index:1;
}

.logo-title h1{
  margin:0;

  color:#397b83;

  font-size:30px;

  font-weight:900;

  letter-spacing:2px;
}

.logo-title p{
  margin:
    8px
    0
    0;

  color:#58919a;

  font-size:14px;
}


/* =========================================================
   TABS
========================================================= */

.main-tabs{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      1fr
    );

  gap:14px;

  margin-bottom:20px;
}

.main-tab{
  border:0;

  border-radius:20px;

  padding:
    16px
    18px;

  background:#fff;

  color:#397b83;

  cursor:pointer;

  box-shadow:
    0
    4px
    16px
    rgba(
      70,
      130,
      140,
      .12
    );

  transition:.18s;
}

.main-tab:hover{
  transform:
    translateY(-2px);
}

.main-tab.active{
  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );
}

.main-tab-icon{
  font-size:28px;
}

.main-tab-title{
  margin-top:4px;

  font-size:21px;

  font-weight:900;
}

.main-tab-sub{
  margin-top:3px;

  color:#7a989d;

  font-size:12px;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-bar{
  background:#8fd58d;

  color:#fff;

  border-radius:999px;

  padding:
    11px
    20px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:18px;

  font-size:23px;

  font-weight:900;

  box-shadow:
    0
    4px
    12px
    rgba(
      76,
      150,
      90,
      .15
    );

  margin-bottom:20px;
}


/* =========================================================
   TITLE
========================================================= */

.section-title{
  text-align:center;

  color:#397b83;

  font-size:22px;

  font-weight:900;

  margin:
    22px
    0
    14px;
}


/* =========================================================
   REGION / EVENT CARD
========================================================= */

.region-grid{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:18px;
}

.region-card{
  background:#fff;

  border-radius:20px;

  overflow:hidden;

  box-shadow:
    0
    4px
    16px
    rgba(
      70,
      130,
      140,
      .12
    );

  cursor:pointer;

  transition:.18s;
}

.region-card:hover{
  transform:
    translateY(-3px);

  box-shadow:
    0
    8px
    24px
    rgba(
      70,
      130,
      140,
      .18
    );
}

.region-images{
  height:185px;

  background:#9de0cc;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  padding:
    18px
    12px;

  position:relative;

  overflow:hidden;
}

.region-images:before{
  content:"";

  position:absolute;

  inset:0;

  opacity:.16;

  background-image:
    radial-gradient(
      circle at 20px 20px,
      #fff 0 10px,
      transparent 11px
    ),
    radial-gradient(
      circle at 65px 65px,
      #fff 0 10px,
      transparent 11px
    );

  background-size:
    90px
    90px;
}

.region-image{
  width:31%;

  max-width:135px;

  aspect-ratio:1;

  object-fit:contain;

  position:relative;

  z-index:1;

  filter:
    drop-shadow(
      0
      3px
      4px
      rgba(
        0,
        0,
        0,
        .20
      )
    );
}

.region-empty{
  color:#fff;

  font-weight:700;

  position:relative;

  z-index:1;

  font-size:50px;
}

.region-info{
  background:#fff;

  padding:
    17px
    12px
    18px;

  text-align:center;
}

.region-name{
  font-size:22px;

  font-weight:900;

  color:#4c7f86;

  margin-bottom:6px;
}

.region-count{
  color:#27bea9;

  font-size:27px;

  font-weight:900;
}

.region-percent{
  margin-top:3px;

  color:#83a3a7;

  font-size:13px;
}


/* =========================================================
   DOWNLOAD
========================================================= */

.download-box{
  background:#fff;

  border-radius:20px;

  margin-top:20px;

  padding:18px;

  box-shadow:
    0
    4px
    16px
    rgba(
      70,
      130,
      140,
      .10
    );

  display:flex;

  justify-content:center;

  gap:10px;
}

.download-btn{
  border:0;

  border-radius:999px;

  padding:
    9px
    16px;

  background:#e9f7fb;

  color:#397b83;

  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   HISTORY
========================================================= */

.history-box{
  background:#fff;

  border-radius:20px;

  margin-top:20px;

  padding:18px;

  box-shadow:
    0
    4px
    16px
    rgba(
      70,
      130,
      140,
      .10
    );
}

.history-box h2{
  margin:
    0
    0
    12px;

  text-align:center;

  color:#397b83;
}

.history-filter{
  display:flex;

  gap:8px;

  justify-content:center;

  margin-bottom:12px;

  flex-wrap:wrap;
}

.history-filter button{
  border:0;

  border-radius:999px;

  padding:
    9px
    16px;

  background:#e9f7fb;

  color:#397b83;

  font-weight:900;

  cursor:pointer;
}

.history-filter button.active{
  background:#c8edf5;
}

.history-card{
  padding:
    12px
    14px;

  border-radius:14px;

  background:#f7fcfc;

  margin:
    8px
    0;

  font-size:13px;
}

.history-type{
  display:inline-block;

  border-radius:999px;

  padding:
    3px
    8px;

  margin-left:6px;

  background:#d9f3e8;

  color:#23885c;

  font-weight:900;
}

.muted{
  color:#789398;
}


/* =========================================================
   FIRST PANEL
========================================================= */

.prefecture-panel,
.collection-panel,
.modal-overlay{
  position:fixed;

  inset:0;

  z-index:10000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:14px;

  background:
    rgba(
      20,
      55,
      60,
      .52
    );
}

.prefecture-panel.show,
.collection-panel.show,
.modal-overlay.show{
  display:flex;
}

.collection-panel{
  z-index:10500;
}


/* =========================================================
   WINDOWS
========================================================= */

.prefecture-window,
.collection-window,
.poke-modal{
  background:#f7fcfc;

  border-radius:26px;

  overflow:hidden;

  box-shadow:
    0
    20px
    80px
    rgba(
      0,
      0,
      0,
      .35
    );

  display:flex;

  flex-direction:column;
}

.prefecture-window{
  width:
    min(
      850px,
      100%
    );

  max-height:
    calc(
      100vh - 28px
    );
}

.collection-window{
  width:
    min(
      1100px,
      100%
    );

  max-height:
    calc(
      100vh - 28px
    );
}


/* =========================================================
   PANEL HEADER
========================================================= */

.prefecture-header,
.collection-header{
  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  padding:
    20px
    22px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;
}

.prefecture-title,
.collection-title{
  color:#397b83;

  font-size:25px;

  font-weight:900;
}

.prefecture-summary,
.collection-summary{
  margin-top:5px;

  color:#58919a;

  font-size:14px;
}

.panel-close,
.collection-close,
.modal-close{
  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  cursor:pointer;
}

.panel-close,
.collection-close{
  width:42px;
  height:42px;

  font-size:27px;
}

.collection-header-actions{
  display:flex;

  align-items:center;

  gap:8px;
}

.back-btn{
  border:0;

  border-radius:999px;

  padding:
    9px
    14px;

  background:#fff;

  color:#397b83;

  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   PREFECTURE
========================================================= */

.prefecture-grid{
  padding:20px;

  overflow:auto;

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:14px;
}

.prefecture-card{
  background:#fff;

  border-radius:18px;

  padding:15px;

  cursor:pointer;

  box-shadow:
    0
    3px
    12px
    rgba(
      70,
      130,
      140,
      .10
    );
}

.prefecture-card-top{
  display:flex;

  justify-content:space-between;

  gap:10px;

  margin-bottom:10px;
}

.prefecture-name{
  font-size:20px;

  font-weight:900;

  color:#397b83;
}

.prefecture-count{
  font-size:14px;

  font-weight:900;

  color:#27bea9;
}

.prefecture-progress{
  height:10px;

  background:#edf3f3;

  border-radius:999px;

  overflow:hidden;
}

.prefecture-progress-bar{
  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #76d8bd,
      #27c978
    );
}

.prefecture-percent{
  margin-top:7px;

  font-size:12px;

  color:#829a9e;
}


/* =========================================================
   COLLECTION
========================================================= */

.collection-toolbar{
  background:#fff;

  padding:
    12px
    20px;

  border-bottom:
    1px solid
    #e7eeee;
}

.collection-legend{
  display:flex;

  gap:16px;

  font-size:13px;

  color:#637f83;
}

.legend-item{
  display:flex;

  align-items:center;

  gap:6px;
}

.legend-dot{
  width:12px;
  height:12px;

  border-radius:50%;
}

.legend-dot.green{
  background:#27c978;

  box-shadow:
    0
    0
    9px
    rgba(
      39,
      201,
      120,
      .9
    );
}

.legend-dot.red{
  background:#ef4b55;

  box-shadow:
    0
    0
    9px
    rgba(
      239,
      75,
      85,
      .9
    );
}

.collection-grid{
  padding:20px;

  overflow:auto;

  display:grid;

  grid-template-columns:
    repeat(
      5,
      minmax(0,1fr)
    );

  gap:20px;
}


/* =========================================================
   COLLECTION ITEM
========================================================= */

.collection-item{
  background:#fff;

  border-radius:18px;

  padding:10px;

  cursor:pointer;

  text-align:center;

  transition:.18s;
}

.collection-item:hover{
  transform:
    translateY(-4px);
}

.collection-item.obtained{
  box-shadow:
    0
    0
    0
    2px
    rgba(
      39,
      201,
      120,
      .50
    ),
    0
    0
    24px
    rgba(
      39,
      201,
      120,
      .85
    ),
    0
    8px
    20px
    rgba(
      39,
      201,
      120,
      .15
    );
}

.collection-item.not-obtained{
  box-shadow:
    0
    0
    0
    2px
    rgba(
      239,
      75,
      85,
      .15
    );
}

.collection-image-wrap{
  aspect-ratio:1;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#f5fbfb;

  border-radius:14px;

  overflow:hidden;
}

.collection-image{
  width:100%;
  height:100%;

  object-fit:contain;
}

.collection-city{
  margin-top:8px;

  font-size:14px;

  font-weight:900;

  color:#397b83;

  min-height:38px;
}

.collection-status{
  margin-top:4px;

  font-size:12px;

  font-weight:900;

  color:#27c978;
}

.not-obtained .collection-status{
  color:#ef4b55;
}


/* =========================================================
   MODAL
========================================================= */

.poke-modal{
  width:
    min(
      520px,
      100%
    );

  max-height:
    calc(
      100vh - 28px
    );

  position:relative;
}

.modal-close{
  position:absolute;

  right:12px;
  top:12px;

  width:42px;
  height:42px;

  font-size:27px;

  z-index:2;
}

.modal-image-wrap{
  background:#e8f8f0;

  padding:22px;

  text-align:center;
}

.modal-image{
  width:
    min(
      360px,
      80vw
    );

  height:280px;

  object-fit:contain;
}

.modal-content{
  padding:20px;
}

.modal-type{
  font-size:13px;

  font-weight:900;

  color:#27bea9;
}

.modal-pref{
  font-size:14px;

  color:#7a989d;

  margin-top:4px;
}

.modal-city{
  font-size:25px;

  font-weight:900;

  color:#397b83;

  margin-top:5px;
}

.modal-address{
  margin-top:8px;

  color:#637f83;
}

.coordinate{
  display:inline-block;

  margin-top:10px;

  padding:
    7px
    10px;

  background:#eef7f7;

  border-radius:8px;

  cursor:pointer;
}

.copy-hint{
  display:none;

  color:#27c978;

  margin-left:7px;

  font-weight:900;
}


/* =========================================================
   STAMP DETAILS
========================================================= */

.stamp-event{
  margin-top:12px;

  padding:
    10px
    12px;

  border-radius:12px;

  background:#eaf8f4;

  color:#397b83;

  font-weight:900;
}

.stamp-dates{
  margin-top:8px;

  color:#637f83;
}

.stamp-status{
  display:inline-block;

  margin-top:8px;

  padding:
    4px
    9px;

  border-radius:999px;

  background:#d9f3e8;

  color:#23885c;

  font-size:12px;

  font-weight:900;
}

.stamp-reward{
  margin-top:8px;

  color:#7a6a3c;
}


/* =========================================================
   MAP
========================================================= */

.map-navigation{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

  margin-top:14px;
}

.navigation-btn{
  border:0;

  border-radius:12px;

  padding:11px;

  cursor:pointer;

  font-weight:900;
}

.apple-map-btn{
  background:#eef3ff;

  color:#3564a5;
}

.google-map-btn{
  background:#eef9ef;

  color:#39834e;
}


/* =========================================================
   OBTAIN
========================================================= */

.obtain-row{
  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-top:16px;

  padding-top:14px;

  border-top:
    1px solid
    #e5eeee;
}

.obtain-label{
  display:flex;

  align-items:center;

  gap:8px;

  font-weight:900;

  color:#397b83;
}

.obtain-label input{
  width:22px;
  height:22px;

  accent-color:#27c978;
}

.save-status{
  color:#27c978;

  font-weight:900;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

  .region-grid{
    grid-template-columns:1fr;
  }

  .collection-grid{
    grid-template-columns:
      repeat(
        3,
        minmax(0,1fr)
      );

    padding:12px;

    gap:12px;
  }

  .collection-city{
    font-size:12px;
  }

  .modal-image{
    height:240px;
  }

}

@media(max-width:520px){

  .container{
    padding:12px;
  }

  .logo-title h1{
    font-size:23px;
  }

  .main-tabs{
    gap:8px;
  }

  .main-tab{
    padding:
      12px
      8px;
  }

  .main-tab-title{
    font-size:17px;
  }

  .progress-bar{
    font-size:18px;
  }

  .prefecture-grid{
    grid-template-columns:1fr;

    padding:12px;
  }

  .collection-header{
    padding:15px;
  }

  .collection-title{
    font-size:19px;
  }

  .collection-header-actions{
    gap:4px;
  }

  .back-btn{
    padding:
      8px
      10px;

    font-size:12px;
  }

  .collection-grid{
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

  .map-navigation{
    grid-template-columns:1fr;
  }

  .download-box{
    flex-wrap:wrap;
  }

}

</style>
</head>


<body>

<div class="container">

<header class="header">

  <div class="logo-title">

    <h1>
      POKÉMON JAPAN COLLECTION
    </h1>

    <p>
      日本寶可夢收集圖鑑
    </p>

  </div>

</header>


<!-- =========================================================
     TABS
========================================================= -->

<div class="main-tabs">

  <button
    id="tabLid"
    class="main-tab active"
    onclick="switchCollectionType('lid')"
  >

    <div class="main-tab-icon">
      🔴
    </div>

    <div class="main-tab-title">
      Poké Lid
    </div>

    <div class="main-tab-sub">
      日本寶可夢井蓋
    </div>

  </button>


  <button
    id="tabStamp"
    class="main-tab"
    onclick="switchCollectionType('stamp')"
  >

    <div class="main-tab-icon">
      🎟️
    </div>

    <div class="main-tab-title">
      Stamp Rally
    </div>

    <div class="main-tab-sub">
      限時活動圖章
    </div>

  </button>

</div>


<!-- =========================================================
     PROGRESS
========================================================= -->

<div class="progress-bar">

  <span>
    ◉
  </span>

  <span>

    <span id="progressLabel">
      Poké Lid 已收集：
    </span>

    <b id="totalObtained">
      0
    </b>

    ／

    <b id="totalCount">
      0
    </b>

  </span>

  <span>
    ◉
  </span>

</div>


<div
  id="sectionTitle"
  class="section-title"
>
  🔴 Poké Lid 蒐集進度
</div>


<div
  id="regions"
  class="region-grid"
>

  <div class="loading">
    資料載入中……
  </div>

</div>


<!-- =========================================================
     DOWNLOAD
========================================================= -->

<div class="download-box">

  <button
    class="download-btn"
    onclick="downloadAll()"
  >
    TXT
  </button>

  <button
    class="download-btn"
    onclick="downloadJSON()"
  >
    JSON
  </button>

  <button
    class="download-btn"
    onclick="downloadCSV()"
  >
    CSV
  </button>

</div>


<!-- =========================================================
     HISTORY
========================================================= -->

<div class="history-box">

  <h2>
    📜 更新 History
  </h2>

  <div class="history-filter">

    <button
      id="historyAll"
      class="active"
      onclick="setHistoryFilter('all')"
    >
      全部
    </button>

    <button
      id="historyLid"
      onclick="setHistoryFilter('lid')"
    >
      🔴 Poké Lid
    </button>

    <button
      id="historyStamp"
      onclick="setHistoryFilter('stamp')"
    >
      🎟️ Stamp Rally
    </button>

  </div>

  <div id="history">
    載入中……
  </div>

</div>

</div>


<!-- =========================================================
     PREFECTURE PANEL
========================================================= -->

<div
  id="prefecturePanel"
  class="prefecture-panel"
  onclick="prefectureOverlayClick(event)"
>

  <div
    class="prefecture-window"
    onclick="event.stopPropagation()"
  >

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,

    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[char])
  );

}


function getItemId(

    obtainedIds[type] =

  }

}

function resolvePrefecture(
  item
){

  const raw =
    String(
      item.pref ||
      ""
    ).trim();

  if(
    PREF_ALIAS[raw]
  ){

    return PREF_ALIAS[raw];

  }

  const text = [

    item.city,

    item.address,

    item.location,

    item.name,

    item.title

  ]
  .filter(Boolean)
  .join(" ");

  for(
    const [
      name,
      code
    ]
    of Object.entries(
      PREF_ALIAS
    )
  ){

    if(
      text.includes(name)
    ){

      return code;

    }

  }

  return null;

}

  return "";

}


function getStampStatus(
  item
){

  const now =
    new Date();

  const start =
    item.startDate
    ?
    new Date(
      item.startDate
    )
    :
    null;

  const end =
    item.endDate
    ?
    new Date(
      item.endDate +
      "T23:59:59"
    )
    :
    null;

  if(
    start &&
    now < start
  ){

    return "即將開始";

  }

  if(
    end &&
    now > end
  ){

    return "已結束";

  }

  return "進行中";

}


/* =========================================================
   JSON
========================================================= */

async function fetchJSON(
  url
){

  const response =
    await fetch(

      url +
      (
        url.includes("?")
        ?
        "&"
        :
        "?"
      ) +
      "ts=" +
      Date.now(),

      {
        cache:"no-store"
      }

    );

  if(
    !response.ok
  ){

    throw new Error(
      `HTTP ${response.status}`
    );

  }

  const json =
    await response.json();

  if(
    !json ||
    !Array.isArray(
      json.list
    )
  ){

    throw new Error(
      "JSON list 格式錯誤"
    );

  }

  return json;

}


/* =========================================================
   LOAD
========================================================= */

async function loadDataSet(
  type
){

  let errorMessage =
    "";

  for(
    const url
    of [
      DATA_URLS[type],
      RAW_DATA_URLS[type]
    ]
  ){

    try{

      const json =
        await fetchJSON(
          url
        );

      dataSets[type] =

        json.list.map(
          item => ({

            ...item,

            eventId:
              item.eventId ||
              ""

          })
        );

      buildGroups(
        type
      );

      return;

    }catch(error){

      errorMessage =
        error.message;

      console.warn(
        `[${type}]`,
        url,
        error
      );

    }

  }

  dataSets[type] =
    [];

  buildGroups(
    type
  );

  if(
    type === collectionType
  ){

    document.getElementById(
      "regions"
    ).innerHTML = `

      <div class="error-box">

        ⚠️ 資料載入失敗

        <br><br>

        ${escapeHtml(
          errorMessage
        )}

      </div>

    `;

  }

}


/* =========================================================
   GROUP
========================================================= */

function buildGroups(
  type
){

  groups[type] =
    {};

  for(
    const item
    of dataSets[type]
  ){

    item.__prefCode =
      resolvePrefecture(
        item
      );

    if(
      item.__prefCode
    ){

      const name =
        PREF[
          item.__prefCode
        ];

      if(
        !groups[type][name]
      ){

        groups[type][name] =
          [];

      }

      groups[type][name].push(
        item
      );

    }

  }

}

========================================================= */

function getStampEvents(){

  const map =
    new Map();

  for(
    const item
    of dataSets.stamp
  ){

    const eventId =

      item.eventId ||

      item.event ||

      item.eventName ||

      "STAMP-EVENT";

    if(
      !map.has(
        eventId
      )
    ){

      map.set(
        eventId,
        {
          id:eventId,

          eventName:
            getStampEventName(
              item
            ),

          items:[]

        }
      );

    }

    map.get(
      eventId
    )
    .items
    .push(
      item
    );

  }

  return [
    ...map.values()
  ];

}


function renderStampEvents(){

      event.items.length;

    const percent =
      total

        obtained /
        total *

      0;

  const el =
    document.getElementById(

    REGIONS[

    "";

  for(
    const prefCode

      PREF[

        total *

/* =========================================================
   COPY
========================================================= */

async function copyCoordinate(
  event
){

  if(event){
    event.stopPropagation();
  }

  const text =
    document
      .getElementById(
        "modalCoordinate"
      )
      .textContent
      .trim();

  if(
    !text ||
    text ===
      "無座標資料"
  ){

    return;

  }

  try{

    await navigator.clipboard.writeText(
      text
    );

  }catch{

    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value =
      text;

    document.body.appendChild(
      textarea
    );

    textarea.select();

    document.execCommand(
      "copy"
    );

    textarea.remove();

  }

  const hint =
    document.getElementById(
      "copyHint"
    );

  hint.style.display =
    "inline";

  setTimeout(
    () =>
      hint.style.display =
        "none",
    1200
  );

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(
  blob,
  name
){

  const a =
    document.createElement(
      "a"
    );

  a.href =
    URL.createObjectURL(
      blob
    );

  a.download =
    name;

  a.click();

  URL.revokeObjectURL(
    a.href
  );

}


function downloadJSON(){

  downloadBlob(

    new Blob(

      [
        JSON.stringify(
          {
            version:"3.0",
            source:"official",
            list:
              dataSets[
                collectionType
              ]
          },
          null,
          2
        )
      ],

      {
        type:
          "application/json;charset=utf-8"
      }

    ),

    collectionType ===
    "lid"

    ?

    "poke_lid.json"

    :

    "stamp_rally.json"

  );

}


function downloadCSV(){

  const rows = [

    [
      "id",
      "prefecture",
      "name",
      "event",
      "startDate",
      "endDate",
      "address",
      "image",
      "reward"
    ]

  ];

  for(
    const item
    of dataSets[
      collectionType
    ]
  ){

    rows.push([

      item.id,

      PREF[
        item.__prefCode
      ]
      ||
      item.pref
      ||
      "",

      getItemTitle(
        collectionType,
        item
      ),

      collectionType ===
      "stamp"

      ?

      getStampEventName(
        item
      )

      :

      "",

      item.startDate ||
      "",

      item.endDate ||
      "",

      item.address ||
      item.location ||
      "",

      item.image ||
      item.stampImage ||
      "",

      item.reward ||
      ""

    ]);

  }

  const csv =

    "\ufeff" +

    rows
      .map(
        row =>
          row
            .map(
              value =>
                `"${String(
                  value
                ).replaceAll(
                  '"',
                  '""'
                )}"`
            )
            .join(",")
      )
      .join("\n");

  downloadBlob(

    new Blob(
      [
        csv
      ],
      {
        type:
          "text/csv;charset=utf-8"
      }
    ),

    collectionType ===
    "lid"

    ?

    "poke_lid.csv"

    :

    "stamp_rally.csv"

  );

}


function downloadAll(){

  const text =
    dataSets[
      collectionType
    ]
    .map(
      item => {

        const pref =
          PREF[
            item.__prefCode
          ]
          ||
          item.pref
          ||
          "";

        return [

          getItemTitle(
            collectionType,
            item
          ),

          pref,

          item.address ||
          item.location ||
          "",

          collectionType ===
          "stamp"

          ?

          getStampEventName(
            item
          )

          :

          "",

          item.startDate ||
          "",

          item.endDate ||
          "",

          item.reward ||
          ""

        ].join("\n");

      }
    )
    .join(
      "\n\n"
    );

  downloadBlob(

    new Blob(
      [
        text
      ],
      {
        type:
          "text/plain;charset=utf-8"
      }
    ),

    collectionType ===
    "lid"

    ?

    "poke_lid.txt"

    :

    "stamp_rally.txt"

  );

}


/* =========================================================
   HISTORY
========================================================= */

async function loadHistoryFile(
  type
){

  try{

    const json =
      await fetchJSON(
        HISTORY_URLS[type]
      );

    return (
      json.history ||
      []
    )
    .map(
      item => ({
        ...item,
        type
      })
    );

  }catch{

    return [];

  }

}


async function loadHistory(){

  const [
    lidHistory,
    stampHistory
  ] =
    await Promise.all([

      loadHistoryFile(
        "lid"
      ),

      loadHistoryFile(
        "stamp"
      )

    ]);

  historyEntries = [

    ...lidHistory,
    ...stampHistory

  ];

  historyEntries.sort(

    (a,b) =>

      new Date(
        b.time ||
        0
      ) -

      new Date(
        a.time ||
        0
      )

  );

  renderHistory();

}


function setHistoryFilter(
  filter
){

  currentHistoryFilter =
    filter;

  document
    .getElementById(
      "historyAll"
    )
    .classList
    .toggle(
      "active",
      filter === "all"
    );

  document
    .getElementById(
      "historyLid"
    )
    .classList
    .toggle(
      "active",
      filter === "lid"
    );

  document
    .getElementById(
      "historyStamp"
    )
    .classList
    .toggle(
      "active",
      filter === "stamp"
    );

  renderHistory();

}


function renderHistory(){

  let logs =
    historyEntries;

  if(
    currentHistoryFilter !==
    "all"
  ){

    logs =
      logs.filter(
        item =>
          item.type ===
          currentHistoryFilter
      );

  }

  const el =
    document.getElementById(
      "history"
    );

  if(
    !logs.length
  ){

    el.innerHTML = `

      <span class="muted">

        尚無更新紀錄。

      </span>

    `;

    return;

  }

  el.innerHTML =

    logs
      .slice(
        0,
        50
      )
      .map(

        item => `

          <div class="history-card">

            <b>
              ${escapeHtml(
                item.time ||
                ""
              )}
            </b>

            <span class="history-type">

              ${
                item.type ===
                "lid"

                ?

                "Poké Lid"

                :

                "Stamp Rally"

              }

            </span>

            <br>

            <span class="muted">

              ${escapeHtml(
                item.event ||
                ""
              )}

             　
              版本：

              ${escapeHtml(
                item.total ??
                ""
              )}

              筆

            </span>

            <br>

            🟢 新增
            ${
              (
                item.added ||
                []
              ).length
            }

            　

            🔴 移除
            ${
              (
                item.removed ||
                []
              ).length
            }

            　

            🟡 修改
            ${
              (
                item.changed ||
                []
              ).length
            }

          </div>

        `

      )
      .join("");

}

        .classList

    }

    if(
      document
        .getElementById(
          "prefecturePanel"
        )
        .classList
        .contains(
          "show"
        )
    ){

      closePrefecturePanel();

    }

  }
);
