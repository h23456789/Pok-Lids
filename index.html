<!doctype html>
<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Poké Lids 2026 分組座標下載器</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

/* =========================================================
   基本
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    Arial,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  max-width:1200px;

  margin:24px auto;

  padding:0 16px;

  background:#f5f6f8;

  color:#222;

}

h1{
  margin:0 0 8px;
}

h3{
  margin-top:0;
}

p{
  line-height:1.6;
}

.box{

  background:#fff;

  padding:18px;

  border-radius:12px;

  margin:12px 0;

  box-shadow:
    0 1px 5px rgba(0,0,0,.10);

}

.muted{

  color:#666;

  font-size:13px;

}


/* =========================================================
   Button
========================================================= */

button{

  border:0;

  border-radius:8px;

  padding:10px 14px;

  margin:4px;

  cursor:pointer;

  background:#222;

  color:#fff;

  font-size:14px;

}

button:hover{
  opacity:.85;
}

button:disabled{

  opacity:.5;

  cursor:not-allowed;

}


/* =========================================================
   上方資訊
========================================================= */

.top-info{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin:12px 0;

}

.info-chip{

  background:#f1f3f5;

  border-radius:999px;

  padding:7px 12px;

  font-size:13px;

}


/* =========================================================
   下載
========================================================= */

.download-area{

  display:flex;

  flex-wrap:wrap;

  gap:4px;

}

.download-area button{

  min-width:145px;

}


/* =========================================================
   地圖
========================================================= */

#map{

  width:100%;

  height:700px;

  border-radius:12px;

  overflow:hidden;

  background:#eef1f4;

  border:1px solid #ddd;

}

.leaflet-container{

  background:#eef1f4;

}


/* =========================================================
   Leaflet Zoom
========================================================= */

.leaflet-control-zoom{

  margin-left:12px !important;

  margin-top:12px !important;

}

.leaflet-control-zoom a{

  width:40px !important;

  height:40px !important;

  line-height:38px !important;

  font-size:22px !important;

}


/* =========================================================
   滑鼠移到行政區的資訊框
========================================================= */

.pref-hover-tooltip{

  background:
    rgba(255,255,255,.98) !important;

  border:
    2px solid #222 !important;

  border-radius:
    12px !important;

  box-shadow:
    0 4px 14px rgba(0,0,0,.30) !important;

  padding:
    7px 12px !important;

  color:#111 !important;

  font-family:
    Arial,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  min-width:135px;

  text-align:center;

}


/*
 * Leaflet Tooltip 小三角
 */

.pref-hover-tooltip:before{

  border-top-color:#222 !important;

}


/*
 * Tooltip 內文字
 */

.pref-tooltip-name{

  font-size:18px;

  font-weight:900;

  line-height:1.25;

}

.pref-tooltip-count{

  font-size:27px;

  font-weight:900;

  line-height:1.15;

  margin-top:3px;

}

.pref-tooltip-unit{

  font-size:14px;

  font-weight:700;

  margin-left:2px;

}


/* =========================================================
   地圖 Header
========================================================= */

.map-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:12px;

  flex-wrap:wrap;

}

.map-status{

  background:#f1f3f5;

  border-radius:8px;

  padding:8px 12px;

  font-size:13px;

}


/* =========================================================
   圖例
========================================================= */

.legend{

  display:flex;

  flex-wrap:wrap;

  gap:12px;

  margin-top:12px;

  padding:5px 0;

}

.legend-item{

  display:flex;

  align-items:center;

  gap:5px;

  font-size:13px;

}

.legend-box{

  width:28px;

  height:18px;

  border-radius:4px;

  border:1px solid rgba(0,0,0,.15);

}


/* =========================================================
   Poké Lid Marker
========================================================= */

.poke-marker{

  width:18px;

  height:18px;

  border-radius:50%;

  background:#111;

  border:3px solid #fff;

  box-shadow:
    0 1px 6px rgba(0,0,0,.65);

}


/* =========================================================
   選取行政區
========================================================= */

#selectedPrefecture{

  display:none;

}

.pref-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:12px;

  flex-wrap:wrap;

  margin-bottom:14px;

}

.pref-title h3{

  margin:0 0 3px;

  font-size:22px;

}

.pref-actions{

  display:flex;

  flex-wrap:wrap;

  gap:3px;

}


/* =========================================================
   Poké Lid 列表
========================================================= */

.poke-list{

  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(250px,1fr));

  gap:10px;

}

.poke-item{

  background:#f7f8fa;

  border:1px solid #e1e5e9;

  border-radius:10px;

  padding:12px;

  cursor:pointer;

  transition:
    transform .15s,
    background .15s,
    box-shadow .15s;

}

.poke-item:hover{

  background:#edf1f5;

  transform:translateY(-2px);

  box-shadow:
    0 3px 8px rgba(0,0,0,.10);

}

.poke-title{

  font-weight:800;

  font-size:15px;

  margin-bottom:5px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}

.poke-coord{

  font-family:
    Consolas,
    monospace;

  font-size:12px;

  color:#555;

}

.poke-address{

  margin-top:5px;

  font-size:12px;

  color:#777;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


/* =========================================================
   History
========================================================= */

.history-card{

  background:#fafafa;

  border:1px solid #e5e5e5;

  border-radius:9px;

  padding:12px;

  margin:8px 0;

}

.badge{

  display:inline-block;

  border-radius:999px;

  padding:3px 9px;

  font-size:12px;

  margin:2px;

  background:#222;

  color:#fff;

}

.badge-green{
  background:#198754;
}

.badge-red{
  background:#dc3545;
}

.badge-yellow{
  background:#d99a00;
}


/* =========================================================
   Loading
========================================================= */

.loading{

  padding:40px;

  text-align:center;

  color:#666;

}


/* =========================================================
   Mobile
========================================================= */

@media(max-width:700px){

  body{

    margin:10px auto;

    padding:0 10px;

  }

  #map{

    height:530px;

  }

  .download-area{

    flex-direction:column;

  }

  .download-area button{

    width:100%;

    margin:3px 0;

  }

  .poke-list{

    grid-template-columns:1fr;

  }

  .pref-hover-tooltip{

    min-width:110px;

    padding:5px 8px !important;

  }

  .pref-tooltip-name{

    font-size:15px;

  }

  .pref-tooltip-count{

    font-size:22px;

  }

  .pref-tooltip-unit{

    font-size:12px;

  }

}

</style>

</head>

  <h3>

    GitHub Actions 會定期同步最新資料，

  </p>

<!-- =======================================================
     Leaflet
======================================================= -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =========================================================
   URL
========================================================= */

const DATA_URL =
  "https://raw.githubusercontent.com/yukidaruma/pokefuta-tracker/main/data/data.json";

const GEOJSON_URL =
  "./prefectures.geojson";

const HISTORY_URL =
  "./history.json";


/* =========================================================
   日本 47 都道府縣
========================================================= */

const PREF = {

  1:"北海道",
  2:"青森県",
  3:"岩手県",
  4:"宮城県",
  5:"秋田県",
  6:"山形県",
  7:"福島県",

  8:"茨城県",
  9:"栃木県",
  10:"群馬県",
  11:"埼玉県",
  12:"千葉県",
  13:"東京都",
  14:"神奈川県",

  15:"新潟県",
  16:"富山県",
  17:"石川県",
  18:"福井県",
  19:"山梨県",
  20:"長野県",

  21:"岐阜県",
  22:"静岡県",
  23:"愛知県",
  24:"三重県",
  25:"滋賀県",
  26:"京都府",

  27:"大阪府",
  28:"兵庫県",
  29:"奈良県",
  30:"和歌山県",

  31:"鳥取県",
  32:"島根県",
  33:"岡山県",
  34:"広島県",
  35:"山口県",

  36:"徳島県",
  37:"香川県",
  38:"愛媛県",
  39:"高知県",

  40:"福岡県",
  41:"佐賀県",
  42:"長崎県",
  43:"熊本県",
  44:"大分県",
  45:"宮崎県",
  46:"鹿児島県",
  47:"沖縄県"

};


/* =========================================================
   Global
========================================================= */

let data = [];

let groups = {};

let map = null;

let prefectureLayer = null;

let pointLayer = null;

let selectedPrefecture = null;


/* =========================================================
   Escape HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"

        }[m];

      }
    );

}


/* =========================================================
   Safe filename
========================================================= */

function safe(value){

  return String(value ?? "")
    .replace(
      /[\\/:*?"<>|]/g,
      "_"
    );

}


/* =========================================================
   Blob
========================================================= */

function blob(
  text,
  type="text/plain;charset=utf-8"
){

  return new Blob(

    [
      "\ufeff",
      text
    ],

    {
      type
    }

  );

}


/* =========================================================
   Save
========================================================= */

function save(
  blobData,
  filename
){

  const a =
    document.createElement("a");


  const url =
    URL.createObjectURL(
      blobData
    );


  a.href =
    url;

  a.download =
    filename;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    function(){

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


/* =========================================================
   TXT
========================================================= */

function txt(
  items,
  groupName
){

  return items
    .map(
      function(x){

        const lat =
          x.coords?.[0] ??
          "";

        const lng =
          x.coords?.[1] ??
          "";

        const title =
          x.city ||
          groupName ||
          "";


        return `${lat},${lng},${title}`;

      }
    )
    .join("\n");

}


/* =========================================================
   Prefecture 排序
========================================================= */

function getPrefNumber(
  name
){

  for(
    const [number,pref]
    of Object.entries(PREF)
  ){

    if(
      pref === name
    ){

      return Number(
        number
      );

    }

  }


  return 999;

}


/* =========================================================
   Load Data
========================================================= */

async function loadData(){

  try{

    const response =
      await fetch(

        DATA_URL +
        "?ts=" +
        Date.now(),

        {
          cache:"no-store"
        }

      );


    if(!response.ok){

      throw new Error(
        "GitHub data.json 無法取得"
      );

    }


    const json =
      await response.json();


    data =
      Array.isArray(
        json.list
      )
      ?
      json.list
      :
      [];


    groups = {};


    for(
      const item
      of data
    ){

      const pref =
        PREF[item.pref] ||
        String(
          item.pref ??
          "未知"
        );


      if(
        !groups[pref]
      ){

        groups[pref] = [];

      }


      groups[pref].push(
        item
      );

    }


    document
      .getElementById(
        "statusChip"
      )
      .textContent =
      `已載入 ${data.length} 筆｜${Object.keys(groups).length} 個都道府縣`;


    document
      .getElementById(
        "all"
      )
      .disabled =
      false;


    document
      .getElementById(
        "json"
      )
      .disabled =
      false;


    document
      .getElementById(
        "csv"
      )
      .disabled =
      false;


    await loadGeoJSON();


    await loadHistory();

  }
  catch(error){

    console.error(
      error
    );


    document
      .getElementById(
        "statusChip"
      )
      .textContent =
      "載入失敗：" +
      error.message;

  }

}


/* =========================================================
   Load History
========================================================= */

async function loadHistory(){

  try{

    const response =
      await fetch(

        HISTORY_URL +
        "?ts=" +
        Date.now(),

        {
          cache:"no-store"
        }

      );


    if(!response.ok){

      throw new Error();

    }


    const history =
      await response.json();


    const logs =
      history.history ||
      [];


    const el =
      document.getElementById(
        "history"
      );


    if(
      !logs.length
    ){

      el.innerHTML =
        '<span class="muted">尚無更新紀錄。</span>';


      document
        .getElementById(
          "syncChip"
        )
        .textContent =
        "GitHub 同步：尚無紀錄";


      return;

    }


    el.innerHTML =
      logs
        .slice()
        .reverse()
        .slice(0,50)
        .map(
          function(item){

            const added =
              item.added ||
              [];

            const removed =
              item.removed ||
              [];

            const changed =
              item.changed ||
              [];


            return `

              <div class="history-card">

                <b>
                  ${escapeHtml(
                    item.time ||
                    ""
                  )}
                </b>

                <br>

                <span class="muted">

                  版本：
                  ${item.total ?? ""}
                  筆

                </span>

                <br><br>


                <span
                  class="badge badge-green"
                >

                  🟢 新增
                  ${added.length}

                </span>


                <span
                  class="badge badge-red"
                >

                  🔴 移除
                  ${removed.length}

                </span>


                <span
                  class="badge badge-yellow"
                >

                  🟡 修改
                  ${changed.length}

                </span>


                ${
                  (
                    added.length ||
                    removed.length ||
                    changed.length
                  )

                  ?

                  `

                  <details
                    style="margin-top:10px"
                  >

                    <summary>
                      查看變更
                    </summary>


                    ${
                      added.length

                      ?

                      `

                      <p>
                        <b>
                          🟢 新增
                        </b>
                      </p>

                      ${
                        added
                          .map(
                            function(x){

                              return `＋
                              ${escapeHtml(
                                x.prefecture ||
                                ""
                              )}
                              ｜${escapeHtml(
                                x.title ||
                                ""
                              )}
                              ｜${escapeHtml(
                                x.lat
                              )},${escapeHtml(
                                x.lng
                              )}`;

                            }
                          )
                          .join("<br>")
                      }

                      `

                      :

                      ""

                    }


                    ${
                      removed.length

                      ?

                      `

                      <p>
                        <b>
                          🔴 移除
                        </b>
                      </p>

                      ${
                        removed
                          .map(
                            function(x){

                              return `－
                              ${escapeHtml(
                                x.prefecture ||
                                ""
                              )}
                              ｜${escapeHtml(
                                x.title ||
                                ""
                              )}
                              ｜${escapeHtml(
                                x.lat
                              )},${escapeHtml(
                                x.lng
                              )}`;

                            }
                          )
                          .join("<br>")
                      }

                      `

                      :

                      ""

                    }


                    ${
                      changed.length

                      ?

                      `

                      <p>
                        <b>
                          🟡 修改
                        </b>
                      </p>

                      ${
                        changed
                          .map(
                            function(x){

                              return `↔
                              ${escapeHtml(
                                x.prefecture ||
                                ""
                              )}
                              ｜${escapeHtml(
                                x.title ||
                                ""
                              )}`;

                            }
                          )
                          .join("<br>")
                      }

                      `

                      :

                      ""

                    }

                  </details>

                  `

                  :

                  ""

                }

              </div>

            `;

          }
        )
        .join("");


    document
      .getElementById(
        "syncChip"
      )
      .textContent =
      `GitHub 最新同步：${
        history.last_sync ||
        "未知"
      }`;

  }
  catch(error){

    document
      .getElementById(
        "history"
      )
      .innerHTML =
      '<span class="muted">尚無 History 資料。第一次 GitHub Actions 執行後會建立。</span>';


    document
      .getElementById(
        "syncChip"
      )
      .textContent =
      "GitHub 同步：等待第一次執行";

  }

}


/* =========================================================
   Load GeoJSON
========================================================= */

async function loadGeoJSON(){

  try{

    const response =
      await fetch(

        GEOJSON_URL +
        "?ts=" +
        Date.now(),

        {
          cache:"no-store"
        }

      );


    if(!response.ok){

      throw new Error(
        "prefectures.geojson 無法取得"
      );

    }


    const geojson =
      await response.json();


    initMap();


    drawPrefectures(
      geojson
    );

  }
  catch(error){

    console.error(
      error
    );


    document
      .getElementById(
        "map"
      )
      .innerHTML = `

        <div
          style="
            padding:40px;
            text-align:center;
            color:#b00020;
          "
        >

          <h3>
            地圖資料載入失敗
          </h3>

          <p>
            找不到：
            <code>
              prefectures.geojson
            </code>
          </p>

          <p class="muted">

            請確認
            <code>
              prefectures.geojson
            </code>
            與
            <code>
              index.html
            </code>
            放在同一層。

          </p>

        </div>

      `;

  }

}


/* =========================================================
   Initialize Map
========================================================= */

function initMap(){

  if(map){

    return;

  }


  map =
    L.map(
      "map",
      {

        zoomControl:true,

        minZoom:4,

        maxZoom:12,

        scrollWheelZoom:true,

        doubleClickZoom:true,

        dragging:true

      }
    );


  map.setView(
    [36.2,138.3],
    5
  );


  pointLayer =
    L.layerGroup()
      .addTo(map);

}


/* =========================================================
   Color
========================================================= */

function getColor(
  count
){

  if(
    count <= 0
  ){

    return "#eeeeee";

  }


  if(
    count <= 2
  ){

    return "#dbeafe";

  }


  if(
    count <= 5
  ){

    return "#93c5fd";

  }


  if(
    count <= 10
  ){

    return "#60a5fa";

  }


  if(
    count <= 20
  ){

    return "#3b82f6";

  }


  return "#1d4ed8";

}


/* =========================================================
   GeoJSON Property
========================================================= */

function getGeoPrefName(
  feature
){

  const p =
    feature.properties ||
    {};


  const possible = [

    p.name,

    p.NAME,

    p.Name,

    p.nam,

    p.NAM,

    p.prefecture,

    p.PREFECTURE,

    p.pref,

    p.PREF,

    p.n03_001,

    p.N03_001,

    p["都道府県"],

    p["都道府県名"]

  ];


  for(
    const value
    of possible
  ){

    if(value){

      return String(
        value
      );

    }

  }


  return "";

}


/* =========================================================
   Normalize Prefecture
========================================================= */

function normalizePrefName(
  name
){

  if(!name){

    return "";

  }


  const text =
    String(name)
      .trim();


  const englishMap = {

    Hokkaido:"北海道",

    Aomori:"青森県",
    Iwate:"岩手県",
    Miyagi:"宮城県",
    Akita:"秋田県",
    Yamagata:"山形県",
    Fukushima:"福島県",

    Ibaraki:"茨城県",
    Tochigi:"栃木県",
    Gunma:"群馬県",
    Saitama:"埼玉県",
    Chiba:"千葉県",
    Tokyo:"東京都",
    Kanagawa:"神奈川県",

    Niigata:"新潟県",
    Toyama:"富山県",
    Ishikawa:"石川県",
    Fukui:"福井県",
    Yamanashi:"山梨県",
    Nagano:"長野県",

    Gifu:"岐阜県",
    Shizuoka:"静岡県",
    Aichi:"愛知県",
    Mie:"三重県",
    Shiga:"滋賀県",
    Kyoto:"京都府",

    Osaka:"大阪府",
    Hyogo:"兵庫県",
    Nara:"奈良県",
    Wakayama:"和歌山県",

    Tottori:"鳥取県",
    Shimane:"島根県",
    Okayama:"岡山県",
    Hiroshima:"広島県",
    Yamaguchi:"山口県",

    Tokushima:"徳島県",
    Kagawa:"香川県",
    Ehime:"愛媛県",
    Kochi:"高知県",

    Fukuoka:"福岡県",
    Saga:"佐賀県",
    Nagasaki:"長崎県",
    Kumamoto:"熊本県",
    Oita:"大分県",
    Miyazaki:"宮崎県",
    Kagoshima:"鹿児島県",
    Okinawa:"沖縄県"

  };


  if(
    englishMap[text]
  ){

    return englishMap[text];

  }


  for(
    const pref
    of Object.values(PREF)
  ){

    if(
      text === pref
    ){

      return pref;

    }

  }


  /*
   * 例如：
   * 東京 → 東京都
   * 大阪 → 大阪府
   */

  for(
    const pref
    of Object.values(PREF)
  ){

    const short =
      pref
        .replace(
          "県",
          ""
        )
        .replace(
          "府",
          ""
        )
        .replace(
          "都",
          ""
        );


    if(
      text === short
    ){

      return pref;

    }

  }


  return text;

}


/* =========================================================
   行政區 Style
========================================================= */

function prefectureStyle(
  feature
){

  const rawName =
    getGeoPrefName(
      feature
    );


  const pref =
    normalizePrefName(
      rawName
    );


  const count =
    groups[pref]
      ?
      groups[pref].length
      :
      0;


  return {

    fillColor:
      getColor(
        count
      ),

    weight:1.5,

    opacity:1,

    color:"#ffffff",

    fillOpacity:.88

  };

}


/* =========================================================
   Hover Highlight
========================================================= */

function highlightFeature(
  e
){

  const layer =
    e.target;


  layer.setStyle({

    weight:3,

    color:"#222",

    fillOpacity:1

  });


  if(
    !L.Browser.ie &&
    !L.Browser.opera &&
    !L.Browser.edge
  ){

    layer.bringToFront();

  }

}


/* =========================================================
   Reset Highlight
========================================================= */

function resetHighlight(
  e
){

  if(
    prefectureLayer
  ){

    prefectureLayer
      .resetStyle(
        e.target
      );

  }

}


/* =========================================================
   Hover Tooltip
========================================================= */

function createHoverTooltip(
  pref,
  count
){

  return `

    <div>

      <div class="pref-tooltip-name">

        ${escapeHtml(
          pref
        )}

      </div>


      <div class="pref-tooltip-count">

        ${count}

        <span
          class="pref-tooltip-unit"
        >

          個

        </span>

      </div>

    </div>

  `;

}


/* =========================================================
   行政區事件
========================================================= */

function onEachPrefecture(
  feature,
  layer
){

  const rawName =
    getGeoPrefName(
      feature
    );


  const pref =
    normalizePrefName(
      rawName
    );


  const count =
    groups[pref]
      ?
      groups[pref].length
      :
      0;


  /*
   * Tooltip
   *
   * 注意：
   *
   * permanent:false
   *
   * 所以不會永久顯示。
   */

  layer.bindTooltip(

    createHoverTooltip(
      pref,
      count
    ),

    {

      sticky:true,

      direction:"top",

      opacity:1,

      className:
        "pref-hover-tooltip",

      permanent:false

    }

  );


  /*
   * Mouse Events
   */

  layer.on({

    mouseover:function(e){

      highlightFeature(
        e
      );

      /*
       * 顯示縣名＋數量
       */

      e.target.openTooltip();

    },


    mouseout:function(e){

      resetHighlight(
        e
      );

      e.target.closeTooltip();

    },


    click:function(){

      selectPrefecture(
        pref,
        layer
      );

    }

  });

}


/* =========================================================
   Draw Prefectures
========================================================= */

function drawPrefectures(
  geojson
){

  if(
    prefectureLayer
  ){

    map.removeLayer(
      prefectureLayer
    );

  }


  prefectureLayer =
    L.geoJSON(

      geojson,

      {

        style:
          prefectureStyle,

        onEachFeature:
          onEachPrefecture

      }

    )
    .addTo(map);


  /*
   * 自動適合日本全圖
   */

  try{

    map.fitBounds(
      prefectureLayer.getBounds(),
      {
        padding:[20,20]
      }
    );

  }
  catch(error){

    console.warn(
      "fitBounds 失敗",
      error
    );

  }

}


/* =========================================================
   Select Prefecture
========================================================= */

function selectPrefecture(
  pref,
  clickedLayer
){

  selectedPrefecture =
    pref;


  const items =
    groups[pref] ||
    [];


  /*
   * Map Status
   */

  document
    .getElementById(
      "mapStatus"
    )
    .textContent =
    `${pref}｜${items.length} 個 Poké Lid`;


  /*
   * Zoom
   */

  if(
    clickedLayer
  ){

    try{

      map.fitBounds(

        clickedLayer.getBounds(),

        {

          padding:
            [30,30],

          maxZoom:
            8

        }

      );

    }
    catch(error){

      console.warn(
        error
      );

    }

  }


  /*
   * 清除舊點位
   */

  pointLayer.clearLayers();


  /*
   * 顯示該區 Poké Lid
   */

  for(
    const item
    of items
  ){

    addPoint(
      item
    );

  }


  /*
   * 地圖下面顯示列表
   */

  renderSelectedPrefecture(
    pref,
    items
  );

}


/* =========================================================
   Add Poké Lid Point
========================================================= */

function addPoint(
  item
){

  const lat =
    Number(
      item.coords?.[0]
    );


  const lng =
    Number(
      item.coords?.[1]
    );


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){

    return;

  }


  const title =
    item.city ||
    "";


  const pref =
    PREF[item.pref] ||
    "";


  const marker =
    L.marker(

      [lat,lng],

      {

        icon:
          L.divIcon({

            className:"",

            html:
              `<div class="poke-marker"></div>`,

            iconSize:
              [18,18],

            iconAnchor:
              [9,9]

          })

      }

    );


  marker.bindPopup(

    `

      <div
        style="
          min-width:220px;
          line-height:1.6;
        "
      >

        <b>
          ${escapeHtml(
            title
          )}
        </b>

        <br>

        都道府縣：
        ${escapeHtml(
          pref
        )}

        <br>

        座標：
        ${lat},
        ${lng}

        ${
          item.address

          ?

          `

          <br>

          地址：
          ${escapeHtml(
            item.address
          )}

          `

          :

          ""

        }

      </div>

    `

  );


  marker.addTo(
    pointLayer
  );

}


/* =========================================================
   Render Selected Prefecture
========================================================= */

function renderSelectedPrefecture(
  pref,
  items
){

  const container =
    document.getElementById(
      "selectedPrefecture"
    );


  const info =
    document.getElementById(
      "cityInfo"
    );


  container.style.display =
    "block";


  let list = "";


  if(
    items.length
  ){

    list =
      items
        .map(

          function(item,index){

            const lat =
              item.coords?.[0] ??
              "";

            const lng =
              item.coords?.[1] ??
              "";


            return `

              <div

                class="poke-item"

                onclick="
                  focusPoint(
                    ${Number(lat)},
                    ${Number(lng)}
                  )
                "

              >

                <div class="poke-title">

                  ${index+1}.
                  ${escapeHtml(
                    item.city ||
                    pref
                  )}

                </div>


                <div class="poke-coord">

                  ${escapeHtml(
                    lat
                  )}
                  ,
                  ${escapeHtml(
                    lng
                  )}

                </div>


                ${
                  item.address

                  ?

                  `

                  <div
                    class="poke-address"
                  >

                    ${escapeHtml(
                      item.address
                    )}

                  </div>

                  `

                  :

                  ""

                }

              </div>

            `;

          }

        )
        .join("");

  }
  else{

    list = `

      <div class="muted">

        此都道府縣目前沒有 Poké Lid。

      </div>

    `;

  }


  info.innerHTML = `

    <div class="pref-header">

      <div class="pref-title">

        <h3>

          🗾
          ${escapeHtml(
            pref
          )}

        </h3>


        <span class="muted">

          共
          <b>
            ${items.length}
          </b>
          個 Poké Lid

        </span>

      </div>


      <div class="pref-actions">

        <button
          onclick="closePrefecture()"
        >

          ✕

          關閉

        </button>

      </div>

    </div>


    <div class="poke-list">

      ${list}

    </div>

  `;


  /*
   * 滑到地圖下面的點位區
   */

  setTimeout(

    function(){

      container.scrollIntoView({

        behavior:"smooth",

        block:"start"

      });

    },

    100

  );

}


/* =========================================================
   Focus Point
========================================================= */

function focusPoint(
  lat,
  lng
){

  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){

    return;

  }


  map.setView(

    [lat,lng],

    Math.max(
      map.getZoom(),
      9
    ),

    {

      animate:true

    }

  );


  pointLayer.eachLayer(

    function(marker){

      const pos =
        marker.getLatLng();


      if(

        Math.abs(
          pos.lat -
          lat
        ) < 0.000001

        &&

        Math.abs(
          pos.lng -
          lng
        ) < 0.000001

      ){

        marker.openPopup();

      }

    }

  );

}


/* =========================================================
   Close Prefecture
========================================================= */

function closePrefecture(){

  document
    .getElementById(
      "selectedPrefecture"
    )
    .style.display =
    "none";


  selectedPrefecture =
    null;


  document
    .getElementById(
      "mapStatus"
    )
    .textContent =
    "日本全圖";


  /*
   * 非常重要：
   *
   * 回到日本全圖時
   * 清除所有 Poké Lid Marker
   */

  pointLayer.clearLayers();


  /*
   * 回日本全圖
   */

  if(
    prefectureLayer
  ){

    try{

      map.fitBounds(

        prefectureLayer.getBounds(),

        {

          padding:
            [20,20]

        }

      );

    }
    catch(error){

      map.setView(
        [36.2,138.3],
        5
      );

    }

  }
  else{

    map.setView(
      [36.2,138.3],
      5
    );

  }

}


/* =========================================================
   Download All TXT
========================================================= */

function downloadAll(){

  const output = [];


  const names =
    Object.keys(groups)
      .sort(

        function(a,b){

          return (
            getPrefNumber(a) -
            getPrefNumber(b)
          );

        }

      );


  for(
    const pref
    of names
  ){

    output.push(

      `# ===== ${pref} (${groups[pref].length}) =====`

    );


    output.push(

      txt(
        groups[pref],
        pref
      )

    );


    output.push("");

  }


  save(

    blob(
      output.join("\n")
    ),

    "poke_lid_2026_by_prefecture.txt"

  );

}


/* =========================================================
   Download JSON
========================================================= */

function downloadJSON(){

  const output = {};


  const names =
    Object.keys(groups)
      .sort(

        function(a,b){

          return (
            getPrefNumber(a) -
            getPrefNumber(b)
          );

        }

      );


  for(
    const pref
    of names
  ){

    output[pref] =
      groups[pref]
        .map(

          function(x){

            return {

              lat:
                String(
                  x.coords?.[0] ??
                  ""
                ),

              lng:
                String(
                  x.coords?.[1] ??
                  ""
                ),

              title:
                String(
                  x.city ||
                  pref
                )

            };

          }

        );

  }


  save(

    new Blob(

      [
        JSON.stringify(
          output,
          null,
          0
        )
      ],

      {

        type:
          "application/json;charset=utf-8"

      }

    ),

    "poke_lid_2026_favorite_lists.json"

  );

}


/* =========================================================
   Download CSV
========================================================= */

function downloadCSV(){

  const rows = [

    [

      "id",
      "prefecture",
      "city",
      "lat",
      "lng",
      "name",
      "address",
      "pokemons"

    ]

  ];


  for(
    const x
    of data
  ){

    rows.push([

      x.id,

      PREF[x.pref] ||
      x.pref ||
      "",

      x.city ||
      "",

      x.coords?.[0] ??
      "",

      x.coords?.[1] ??
      "",

      x.city ||
      "",

      x.address ||
      "",

      (
        x.pokemons ||
        []
      ).join("|")

    ]);

  }


  const csv =
    rows
      .map(

        function(row){

          return row
            .map(

              function(value){

                return `"${String(
                  value ?? ""
                ).replaceAll(
                  '"',
                  '""'
                )}"`;

              }

            )
            .join(",");

        }

      )
      .join("\n");


  save(

    blob(
      csv,
      "text/csv;charset=utf-8"
    ),

    "poke_lid_2026.csv"

  );

}
