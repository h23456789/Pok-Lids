<!doctype html> 
<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>
  Pokémon Japan Collection｜日本寶可夢收集圖鑑
</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#e9f7fb;
  color:#315f66;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
}

body.no-scroll{
  overflow:hidden;
}

button{
  font:inherit;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  border-radius:24px;

  padding:
    28px
    24px
    22px;

  text-align:center;

  margin-bottom:18px;

  position:relative;

  overflow:hidden;
}

.header:before,
.header:after{
  content:"";

  position:absolute;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .45
    );
}

.header:before{
  width:140px;
  height:140px;

  top:-70px;
  left:-40px;
}

.header:after{
  width:180px;
  height:180px;

  right:-70px;
  bottom:-90px;
}

.logo-title{
  position:relative;
  z-index:1;
}

.logo-title h1{
  margin:0;

  color:#397b83;

  font-size:30px;
  font-weight:900;

  letter-spacing:2px;
}

.logo-title p{
  margin:
    8px
    0
    0;

  color:#58919a;

  font-size:14px;
}


/* =========================================================
   TABS
========================================================= */

.main-tabs{
  display:grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap:14px;

  margin-bottom:20px;
}

.main-tab{
  border:0;

  border-radius:20px;

  padding:
    16px
    18px;

  background:#fff;

  color:#397b83;

  cursor:pointer;

  box-shadow:
    0
    4px
    16px
    rgba(
      70,
      130,
      140,
      .12
    );

  transition:.18s;
}

.main-tab:hover{
  transform:
    translateY(-2px);
}

.main-tab.active{
  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );
}

.main-tab-icon{
  font-size:28px;
}

.main-tab-title{
  margin-top:4px;

  font-size:21px;
  font-weight:900;
}

.main-tab-sub{
  margin-top:3px;

  color:#7a989d;

  font-size:12px;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-bar{
  background:#8fd58d;

  color:#fff;

  border-radius:999px;

  padding:
    11px
    20px;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:18px;

  font-size:23px;

  font-weight:900;

  box-shadow:
    0
    4px
    12px
    rgba(
      76,
      150,
      90,
      .15
    );

  margin-bottom:20px;
}

.progress-bar .ball{
  font-size:24px;
}


/* =========================================================
   TITLE
========================================================= */

.section-title{
  text-align:center;

  color:#397b83;

  font-size:22px;

  font-weight:900;

  margin:
    22px
    0
    14px;
}


/* =========================================================
   REGION
========================================================= */

.region-grid{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:18px;
}

.region-card{
  background:#fff;

  border-radius:20px;

  overflow:hidden;

  box-shadow:
    0
    4px
    16px
    rgba(
      70,
      130,
      140,
      .12
    );

  cursor:pointer;

  transition:.18s;
}

.region-card:hover{
  transform:
    translateY(-3px);

  box-shadow:
    0
    8px
    24px
    rgba(
      70,
      130,
      140,
      .18
    );
}

.region-images{
  height:185px;

  background:#9de0cc;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:8px;

  padding:
    18px
    12px;

  position:relative;

  overflow:hidden;
}

.region-images:before{
  content:"";

  position:absolute;

  inset:0;

  opacity:.16;

  background-image:
    radial-gradient(
      circle at 20px 20px,
      #fff 0 10px,
      transparent 11px
    ),
    radial-gradient(
      circle at 65px 65px,
      #fff 0 10px,
      transparent 11px
    );

  background-size:
    90px
    90px;
}

.region-image{
  width:31%;

  max-width:135px;

  aspect-ratio:1;

  object-fit:contain;

  position:relative;

  z-index:1;

  filter:
    drop-shadow(
      0
      3px
      4px
      rgba(
        0,
        0,
        0,
        .20
      )
    );
}

.region-empty{
  color:#fff;

  font-weight:700;

  position:relative;

  z-index:1;
}

.region-info{
  background:#fff;

  padding:
    17px
    12px
    18px;

  text-align:center;
}

.region-name{
  font-size:22px;

  font-weight:900;

  color:#4c7f86;

  margin-bottom:6px;
}

.region-count{
  color:#27bea9;

  font-size:27px;

  font-weight:900;
}

.region-percent{
  margin-top:3px;

  color:#83a3a7;

  font-size:13px;
}


/* =========================================================
   FIRST LAYER
========================================================= */

.prefecture-panel{
  position:fixed;

  inset:0;

  z-index:10000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:14px;

  background:
    rgba(
      20,
      55,
      60,
      .52
    );
}

.prefecture-panel.show{
  display:flex;
}

.prefecture-window{
  width:
    min(
      850px,
      100%
    );

  max-height:
    calc(
      100vh - 28px
    );

  background:#f7fcfc;

  border-radius:26px;

  overflow:hidden;

  box-shadow:
    0
    20px
    80px
    rgba(
      0,
      0,
      0,
      .35
    );

  display:flex;

  flex-direction:column;
}

.prefecture-header{
  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  padding:
    20px
    22px;

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:15px;
}

.prefecture-header-title{
  min-width:0;
}

.prefecture-title{
  color:#397b83;

  font-size:25px;

  font-weight:900;
}

.prefecture-summary{
  margin-top:5px;

  color:#58919a;

  font-size:14px;
}

.panel-close{
  width:42px;
  height:42px;

  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  font-size:27px;

  cursor:pointer;

  flex-shrink:0;
}

.prefecture-grid{
  padding:20px;

  overflow:auto;

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:14px;
}

.prefecture-card{
  background:#fff;

  border-radius:18px;

  padding:15px;

  cursor:pointer;

  box-shadow:
    0
    3px
    12px
    rgba(
      70,
      130,
      140,
      .10
    );

  transition:.15s;
}

.prefecture-card:hover{
  transform:
    translateY(-3px);
}

.prefecture-card-top{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;

  margin-bottom:10px;
}

.prefecture-name{
  font-size:20px;

  font-weight:900;

  color:#397b83;
}

.prefecture-count{
  font-size:14px;

  font-weight:900;

  color:#27bea9;
}

.prefecture-progress{
  height:10px;

  background:#edf3f3;

  border-radius:999px;

  overflow:hidden;
}

.prefecture-progress-bar{
  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #76d8bd,
      #27c978
    );
}

.prefecture-percent{
  margin-top:7px;

  font-size:12px;

  color:#829a9e;
}


/* =========================================================
   SECOND LAYER
========================================================= */

.collection-panel{
  position:fixed;

  inset:0;

  z-index:10500;

  display:none;

  align-items:center;
  justify-content:center;

  padding:14px;

  background:
    rgba(
      20,
      55,
      60,
      .52
    );
}

.collection-panel.show{
  display:flex;
}

.collection-window{
  width:
    min(
      1100px,
      100%
    );

  max-height:
    calc(
      100vh - 28px
    );

  background:#f7fcfc;

  border-radius:26px;

  overflow:hidden;

  box-shadow:
    0
    20px
    80px
    rgba(
      0,
      0,
      0,
      .35
    );

  display:flex;

  flex-direction:column;
}

.collection-header{
  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  padding:
    20px
    22px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;
}

.collection-header-left{
  min-width:0;
}

.collection-title{
  color:#397b83;

  font-size:25px;

  font-weight:900;
}

.collection-summary{
  margin-top:5px;

  color:#58919a;

  font-size:14px;
}

.collection-header-actions{
  display:flex;

  align-items:center;

  gap:8px;
}

.back-btn{
  border:0;

  border-radius:999px;

  padding:
    9px
    14px;

  background:#fff;

  color:#397b83;

  font-weight:900;

  cursor:pointer;
}

.collection-close{
  width:42px;
  height:42px;

  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  font-size:27px;

  cursor:pointer;
}

.collection-toolbar{
  background:#fff;

  padding:
    12px
    20px;

  border-bottom:
    1px solid
    #e7eeee;
}

.collection-legend{
  display:flex;

  gap:16px;

  font-size:13px;

  color:#637f83;
}

.legend-item{
  display:flex;

  align-items:center;

  gap:6px;
}

.legend-dot{
  width:12px;
  height:12px;

  border-radius:50%;
}

.legend-dot.green{
  background:#27c978;

  box-shadow:
    0
    0
    9px
    rgba(
      39,
      201,
      120,
      .9
    );
}

.legend-dot.red{
  background:#ef4b55;

  box-shadow:
    0
    0
    9px
    rgba(
      239,
      75,
      85,
      .9
    );
}

.collection-grid{
  padding:20px;

  overflow:auto;

  display:grid;

  grid-template-columns:
    repeat(
      5,
      minmax(0,1fr)
    );

  gap:20px;
}


/* =========================================================
   COLLECTION CARD
========================================================= */

.collection-item{
  background:#fff;

  border-radius:18px;

  padding:10px;

  cursor:pointer;

  text-align:center;

  transition:.18s;
}

.collection-item:hover{
  transform:
    translateY(-4px);
}

.collection-item.obtained{
  box-shadow:
    0
    0
    0
    2px
    rgba(
      39,
      201,
      120,
      .50
    ),
    0
    0
    24px
    rgba(
      39,
      201,
      120,
      .85
    ),
    0
    8px
    20px
    rgba(
      39,
      201,
      120,
      .15
    );
}

.collection-item.not-obtained{
  box-shadow:
    0
    0
    0
    2px
    rgba(
      239,
      75,
      85,
      .45
    ),
    0
    0
    24px
    rgba(
      239,
      75,
      85,
      .75
    ),
    0
    8px
    20px
    rgba(
      239,
      75,
      85,
      .12
    );
}

.collection-image-wrap{
  width:100%;

  aspect-ratio:1;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:14px;

  background:#9de0cc;

  overflow:hidden;
}

.collection-image{
  width:100%;

  height:100%;

  object-fit:contain;

  filter:
    drop-shadow(
      0
      3px
      5px
      rgba(
        0,
        0,
        0,
        .22
      )
    );
}

.collection-city{
  margin-top:9px;

  color:#397b83;

  font-size:14px;

  font-weight:900;

  line-height:1.35;

  min-height:19px;
}

.collection-status{
  margin-top:3px;

  font-size:11px;

  font-weight:800;
}

.collection-item.obtained
.collection-status{
  color:#27bd7a;
}

.collection-item.not-obtained
.collection-status{
  color:#ef4b55;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
  position:fixed;

  inset:0;

  z-index:11000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:18px;

  background:
    rgba(
      20,
      55,
      60,
      .55
    );
}

.modal-overlay.show{
  display:flex;
}

.poke-modal{
  width:
    min(
      430px,
      calc(100vw - 28px)
    );

  max-height:
    calc(
      100vh - 35px
    );

  overflow:auto;

  background:#fff;

  border-radius:24px;

  box-shadow:
    0
    20px
    70px
    rgba(
      0,
      0,
      0,
      .35
    );

  position:relative;

  z-index:11001;
}

.modal-close{
  position:absolute;

  top:12px;
  right:12px;

  z-index:5;

  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  font-size:25px;

  cursor:pointer;

  box-shadow:
    0
    2px
    10px
    rgba(
      0,
      0,
      0,
      .15
    );
}

.modal-image-wrap{
  background:#9de0cc;

  padding:18px;

  text-align:center;
}

.modal-image{
  width:
    min(
      300px,
      80vw
    );

  aspect-ratio:1;

  object-fit:contain;

  display:block;

  margin:auto;

  filter:
    drop-shadow(
      0
      5px
      8px
      rgba(
        0,
        0,
        0,
        .2
      )
    );
}

.modal-content{
  padding:20px;
}

.modal-type{
  font-size:12px;

  color:#6d959b;

  margin-bottom:2px;
}

.modal-pref{
  font-size:13px;

  color:#7b999d;
}

.modal-city{
  font-size:25px;

  font-weight:900;

  color:#397b83;

  margin:
    3px
    0
    10px;

  line-height:1.35;
}

.modal-address{
  color:#637f83;

  font-size:14px;

  line-height:1.6;

  margin-bottom:12px;
}

.coordinate{
  display:inline-block;

  padding:
    9px
    12px;

  background:#f0f8f7;

  color:#277e77;

  border-radius:10px;

  font-family:monospace;

  font-size:14px;

  cursor:pointer;

  user-select:none;

  max-width:100%;

  overflow-wrap:anywhere;
}

.copy-hint{
  display:inline-block;

  margin-left:8px;

  color:#27bd7a;

  font-size:13px;

  font-weight:800;

  opacity:0;

  transition:.2s;
}

.copy-hint.show{
  opacity:1;
}


/* =========================================================
   STAMP RALLY
========================================================= */

.stamp-event{
  margin-top:6px;
  color:#397b83;
  font-size:14px;
  font-weight:900;
  line-height:1.45;
}

.stamp-dates{
  margin-top:4px;
  color:#7b999d;
  font-size:12px;
}

.stamp-reward{
  margin-top:10px;
  padding:10px 12px;
  border-radius:12px;
  background:#fff7df;
  color:#8a6a13;
  font-size:13px;
  line-height:1.5;
}

.stamp-status{
  display:inline-block;
  margin-top:8px;
  padding:4px 9px;
  border-radius:999px;
  background:#edf5f5;
  color:#397b83;
  font-size:11px;
  font-weight:900;
}

.history-type.stamp{
  background:#e9e1ff;
  color:#6f4bb8;
}

@media(max-width:700px){
  .main-tabs{
    grid-template-columns:
      repeat(3, 1fr);
  }
}

/* =========================================================
   NAVIGATION
========================================================= */

.map-navigation{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;

  margin-top:16px;
}

.navigation-btn{
  border:0;

  border-radius:13px;

  padding:
    12px
    10px;

  cursor:pointer;

  font-weight:900;

  transition:.15s;
}

.navigation-btn:hover{
  transform:
    translateY(-2px);
}

.apple-map-btn{
  background:#111;

  color:#fff;
}

.google-map-btn{
  background:#4285f4;

  color:#fff;
}


/* =========================================================
   OBTAIN
========================================================= */

.obtain-row{
  margin-top:18px;

  border-top:
    1px solid
    #edf1f1;

  padding-top:16px;
}

.obtain-label{
  display:flex;

  align-items:center;

  gap:12px;

  cursor:pointer;

  font-size:18px;

  font-weight:900;

  color:#397b83;
}

.obtain-label input{
  appearance:none;

  width:28px;
  height:28px;

  border:
    3px solid
    #b8cdcf;

  border-radius:8px;

  position:relative;

  cursor:pointer;

  background:#fff;
}

.obtain-label input:checked{
  background:#27c978;

  border-color:#27c978;
}

.obtain-label input:checked:after{
  content:"✓";

  position:absolute;

  color:#fff;

  font-size:20px;

  font-weight:900;

  left:3px;

  top:-1px;
}

.save-status{
  margin-top:8px;

  color:#27bd7a;

  font-size:13px;

  min-height:18px;
}


/* =========================================================
   HISTORY
========================================================= */

.history-box{
  background:#fff;

  border-radius:20px;

  padding:18px;

  box-shadow:
    0
    4px
    16px
    rgba(
      70,
      130,
      140,
      .12
    );

  margin-top:22px;
}

.history-box h2{
  margin-top:0;

  color:#397b83;
}

.history-filter{
  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-bottom:12px;
}

.history-filter button{
  border:0;

  border-radius:999px;

  padding:
    7px
    12px;

  background:#edf5f5;

  color:#397b83;

  font-size:12px;

  font-weight:800;

  cursor:pointer;
}

.history-filter button.active{
  background:#397b83;

  color:#fff;
}

.history-card{
  border-bottom:
    1px solid
    #eee;

  padding:
    12px
    0;

  font-size:14px;
}

.history-card:last-child{
  border-bottom:0;
}

.history-type{
  display:inline-block;

  border-radius:999px;

  padding:
    3px
    8px;

  margin-left:5px;

  font-size:10px;

  font-weight:900;
}

.history-type.lid{
  background:#ffe8e8;

  color:#df4a52;
}

.history-type.center{
  background:#fff3ce;

  color:#b68100;
}


/* =========================================================
   DOWNLOAD
========================================================= */

.download-box{
  margin-top:22px;

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:8px;
}

.download-btn{
  border:0;

  border-radius:999px;

  padding:
    10px
    18px;

  background:#397b83;

  color:#fff;

  cursor:pointer;

  font-weight:800;
}


/* =========================================================
   LOADING / ERROR
========================================================= */

.loading{
  text-align:center;

  padding:40px;

  color:#6f9095;
}

.error-box{
  padding:16px;

  border-radius:12px;

  background:#fff4f4;

  color:#bd4c4c;

  font-size:14px;

  line-height:1.7;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .collection-grid{
    grid-template-columns:
      repeat(
        4,
        minmax(0,1fr)
      );
  }

}


@media(max-width:700px){

  .container{
    padding:10px;
  }

  .header{
    border-radius:18px;

    padding:

function resolvePrefecture(
  item
){

  /*
   * 1. 直接使用 pref
   */

  const rawPref =
    item?.pref;


  if(
    rawPref !== undefined &&
    rawPref !== null &&
    String(rawPref).trim() !== ""
  ){

    const text =
      String(
        rawPref
      ).trim();


    /*
     * 數字
     */

    const number =
      Number(
        text
      );


    if(
      Number.isInteger(number) &&
      number >= 1 &&
      number <= 47
    ){

      return number;

    }


    /*
     * 中文名稱
     */

    if(
      PREF_ALIAS[text]
    ){

      return PREF_ALIAS[text];

    }


    /*
     * 包含縣市名稱
     */

    for(
      const [
        name,
        code
      ]
      of Object.entries(
        PREF_ALIAS
      )
    ){

      if(
        text.includes(name)
      ){

        return code;

      }

    }

  }


  /*
   * 2. region
   */

  const regionText =
    String(
      item?.region ||
      ""
    );


  /*
   * 3. name
   */

  const nameText =
    String(
      item?.name ||
      item?.title ||
      item?.city ||
      ""
    );


  /*
   * 4. address
   */

  const addressText =
    String(
      item?.address ||
      item?.location ||
      ""
    );


  /*
   * 全部文字一起判斷
   */

  const combined =

    (
      regionText +
      " " +
      nameText +
      " " +
      addressText
    )
    .toLowerCase();


  /*
   * 中文優先
   */

  for(
    const [
      name,
      code
    ]
    of Object.entries(
      PREF_ALIAS
    )
  ){

    if(
      combined.includes(
        name.toLowerCase()
      )
    ){

      return code;

    }

  }


  /*
   * 英文
   */

  const english = {

    hokkaido:1,
    aomori:2,
    iwate:3,
    miyagi:4,
    akita:5,
    yamagata:6,
    fukushima:7,

    ibaraki:8,
    tochigi:9,
    gunma:10,
    saitama:11,
    chiba:12,
    tokyo:13,

    fukuoka:40,
    saga:41,
    nagasaki:42,
    kumamoto:43,
    oita:44,
    miyazaki:45,
    kagoshima:46,
    okinawa:47

  };


  for(
    const [
      keyword,
      code
    ]
    of Object.entries(
      english
    )
  ){

    if(
      combined.includes(
        keyword
      )
    ){

      return code;

    }

  }


  return null;

}

    new Date(item.startDate)
    :
    null;

  const end =
    item.endDate
    ?
    new Date(item.endDate + "T23:59:59")
    :
    null;

  if(
    start &&
    now < start
  ){

    return "即將開始";

  }

  if(
    end &&
    now > end
  ){

    return "已結束";

  }

  return "進行中";

}


function getStampEventName(

){

  return (
    item.eventZh ||
    item.eventNameZh ||
    item.activityZh ||
    item.event ||

  );

}

){

function getStampDates(
  item
){

  const start =
    item.startDate ||
    "";

  const end =
    item.endDate ||
    "";

  if(
    start &&
    end
  ){

  }

  if(
    start
  ){

    return `${start} ～`;

  }

  return "";

}


/* =========================================================
   JSON LOAD
========================================================= */

async function fetchJSON(
  url
){

  const separator =
    url.includes("?")
    ?
    "&"
    :
    "?";


  const response =
    await fetch(

      url +
      separator +
      "ts=" +
      Date.now(),

      {
        cache:
          "no-store"
      }

    );


  if(
    !response.ok
  ){

    throw new Error(
      `HTTP ${response.status}`
    );

  }


  const json =
    await response.json();


  if(
    !json ||
    !Array.isArray(
      json.list
    )
  ){

    throw new Error(
      "JSON list 格式錯誤"
    );

  }


  return json;

}


async function loadDataSet(
  type
){

  let errorMessage =
    "";


  for(
    const url
    of [
      DATA_URLS[type],
      RAW_DATA_URLS[type]
    ]
  ){

    try{

      const json =
        await fetchJSON(
          url
        );


      dataSets[type] =
        json.list;


      console.log(
        `[${type}] ${dataSets[type].length} items`,
        url
      );


      buildGroups(
        type
      );


      return;

    }catch(error){

      errorMessage =
        error.message;

      console.warn(
        `[${type}]`,
        url,
        error
      );

    }

  }


  dataSets[type] =
    [];


  buildGroups(
    type
  );


  if(
    type === collectionType
  ){

    document.getElementById(
      "regions"
    ).innerHTML = `

      <div
        class="error-box"
        style="grid-column:1/-1"
      >

        ⚠️ 資料載入失敗

        <br><br>

        ${escapeHtml(
          errorMessage
        )}

      </div>

    `;

  }

}


/* =========================================================
   BUILD GROUPS
========================================================= */

function buildGroups(
  type
){

  groups[type] =
    {};


  const unresolved = [];


  for(
    const item
    of dataSets[type]
  ){

    const prefCode =
      resolvePrefecture(
        item
      );


    /*
     * 保存解析結果
     */

    item.__prefCode =
      prefCode;


    const prefName =
      prefCode
      ?
      PREF[prefCode]
      :
      null;


    if(!prefName){

      unresolved.push(
        item
      );

      continue;

    }


    if(
      !groups[type][prefName]
    ){

      groups[type][prefName] =
        [];

    }


    groups[type][prefName].push(
      item
    );

  }


  /*
   * 除錯
   */

  console.log(
    `[${type}] groups:`,
    groups[type]
  );


  if(
    unresolved.length
  ){

    console.warn(
      `[${type}] 無法判斷縣市：`,
      unresolved
    );

  }

}

/* =========================================================
   REGION
========================================================= */

function renderRegions(){

  const el =
    document.getElementById(
      "regions"
    );


  const list =
    dataSets[
      collectionType
    ] || [];


  if(
    !list.length
  ){

    el.innerHTML = `

      <div
        class="error-box"
        style="grid-column:1/-1"
      >

        ${
          collectionType === "stamp"

          ?

          "⚠️ 限時 Stamp Rally 沒有資料"

          :

          collectionType === "center"

          ?

          "⚠️ Pokémon Center 沒有資料"

          :

          "⚠️ Poké Lid 沒有資料"

        }

      </div>

    `;

    return;

  }


  el.innerHTML =
    "";


  for(
    const [
      regionName,
      region
    ]
    of Object.entries(
      REGIONS
    )
  ){

    const items =
      list.filter(

        item =>
          region.prefs.includes(
            Number(
              item.__prefCode
            )
          )

      );


    const obtained =
      items.filter(

        item =>
          obtainedIds[
            collectionType
          ].has(
            getItemId(item)
          )

      ).length;


    const total =
      items.length;


    const percent =
      total
      ?
      Math.round(
        obtained /
        total *
        1000
      ) / 10
      :
      0;


    const sample =
      items.slice(
        0,
        3
      );


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "region-card";


    card.onclick =
      () =>
        openRegion(
          regionName
        );


    const images =
      sample.map(

        item => `

          <img
            class="region-image"
            src="${escapeHtml(
              getItemImageUrl(
                collectionType,
                item
              )
            )}"
            alt=""
            loading="lazy"
          >

        `

      ).join("");


    card.innerHTML = `

      <div class="region-images">

        ${
          images ||

          `
            <div class="region-empty">
              尚無資料
            </div>
          `
        }

      </div>


      <div class="region-info">

        <div class="region-name">

          ${escapeHtml(
            regionName
          )}

        </div>


        <div class="region-count">

          ${obtained}
          /
          ${total}

        </div>


        <div class="region-percent">

          完成率
          ${percent}%

        </div>

      </div>

    `;


    el.appendChild(
      card
    );

  }

}

/* =========================================================
   MAP LINKS
========================================================= */

function openAppleMaps(
  event
){

  if(event){

    event.stopPropagation();

  }


  if(
    !currentItem
  ){

    return;

  }


  const lat =
    Number(
      currentItem.coords?.[0]
    );


  const lng =
    Number(
      currentItem.coords?.[1]
    );


  const title =
    getItemTitle(
      currentItemType,
      currentItem
    );


  let url;


  if(
    Number.isFinite(lat) &&
    Number.isFinite(lng)
  ){

    url =
      "https://maps.apple.com/" +
      "?daddr=" +
      encodeURIComponent(
        `${lat},${lng}`
      ) +
      "&dirflg=d" +
      "&q=" +
      encodeURIComponent(
        title
      );

  }else{

    const destination =
      currentItem.address ||
      currentItem.location ||
      title;


    url =
      "https://maps.apple.com/" +
      "?daddr=" +
      encodeURIComponent(
        destination
      ) +
      "&dirflg=d";

  }


  window.open(
    url,
    "_blank",
    "noopener"
  );

}


function openGoogleMaps(
  event
){

  if(event){

    event.stopPropagation();

  }


  if(
    !currentItem
  ){

    return;

  }


  const lat =
    Number(
      currentItem.coords?.[0]
    );


  const lng =
    Number(
      currentItem.coords?.[1]
    );


  const destination =

    Number.isFinite(lat) &&
    Number.isFinite(lng)

    ?

    `${lat},${lng}`

    :

    (
      currentItem.address ||
      currentItem.location ||
      getItemTitle(
        currentItemType,
        currentItem
      )
    );


  const url =
    "https://www.google.com/maps/dir/" +
    "?api=1" +
    "&destination=" +
    encodeURIComponent(
      destination
    );


  window.open(
    url,
    "_blank",
    "noopener"
  );

}

      .getElementById(
        "modalCoordinate"
      )
      .textContent
      .trim();


  if(
    !text ||
    text ===
      "無座標資料"
  ){

    return;

  }


  try{

    await navigator.clipboard.writeText(
      text
    );

  }catch{

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    textarea.style.position =
      "fixed";


    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.focus();

    textarea.select();


    try{

      document.execCommand(
        "copy"
      );

    }catch(error){

      console.error(
        error
      );

    }


    textarea.remove();

  }


  const hint =
    document.getElementById(
      "copyHint"
    );


  hint.classList.add(
    "show"
  );


  setTimeout(

    () =>
      hint.classList.remove(
        "show"
      ),

    1500

  );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(
  event
){

  if(event){

    event.stopPropagation();

  }


  document
    .getElementById(
      "modalOverlay"
    )
    .classList
    .remove(
      "show"
    );


  document.body.classList.remove(
    "no-scroll"
  );

}


function overlayClick(
  event
){

  if(
    event.target ===
    document.getElementById(
      "modalOverlay"
    )
  ){

    closeModal();

  }

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(
  blob,
  filename
){

  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    filename;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(

    () =>
      URL.revokeObjectURL(
        url
      ),

    1000

  );

}


function downloadAll(){

  const lines = [];


  for(
    const [
      pref,
      items
    ]
    of Object.entries(
      groups[
        collectionType
      ]
    ).sort()
  ){

    lines.push(
      `# ===== ${pref} (${items.length}) =====`
    );


    for(
      const item
      of items
    ){

      const {
        lat,
        lng
      } =
        getItemLatLng(item);

      lines.push(

        `${Number.isFinite(lat) ? lat : ""},` +
        `${Number.isFinite(lng) ? lng : ""},` +
        `${getItemTitle(
          collectionType,
          item
        )}` +
        (
          collectionType === "stamp"
          ?
          `,${getStampEventName(item)}`
          :
          ""
        )

      );

    }


    lines.push("");

  }


  const filenames = {

    lid:
      "poke_lid_2026.txt",

    center:
      "pokemon_center_2026.txt",

    stamp:
      "stamp_rally_2026.txt"

  };


  downloadBlob(

    new Blob(

      [
        "\ufeff",
        lines.join("\n")
      ],

      {
        type:
          "text/plain;charset=utf-8"
      }

    ),

    filenames[
      collectionType
    ]

  );

}

            item.startDate || ""
            :
            undefined,

          endDate:
            collectionType === "stamp"
            ?
            item.endDate || ""
            :
            undefined,

          lat:
            item.coords?.[0] ??
            item.lat ??
            "",

          lng:
            item.coords?.[1] ??
            item.lng ??
            "",

          address:
            item.address ||
            item.location ||
            "",

function downloadCSV(){

    [
      "id",

      "name",
      "event",
      "startDate",
      "endDate",
      "lat",
      "lng",
      "address",

      ]

      ||

        collectionType,
        item
      ),

      collectionType === "stamp"
      ?
      getStampEventName(item)
      :
      "",

      collectionType === "stamp"
      ?
      item.startDate || ""
      :
      "",

      collectionType === "stamp"
      ?
      item.endDate || ""
      :
      "",

      item.coords?.[0] ??
      item.lat ??
      "",

      item.coords?.[1] ??
      item.lng ??
      "",

      item.address ||
      item.location ||
      "",

      item.image ||
      item.stampImage ||
      item.icon ||
      "",

      item.reward ||
      item.rewardPokemon ||
      item.background ||
      ""

    ]);

  const csv =

                    '""'

    new Blob(

      [
        "\ufeff",

    :
    "stamp_rally_2026.csv"

  );

/* =========================================================
   HISTORY
========================================================= */

async function loadHistoryFile(
  type
){

  try{

    const json =
      await fetchJSON(
        HISTORY_URLS[type]
      );


    return (

      json.history ||
      []

    ).map(

      entry => ({

        ...entry,

        type

      })

    );

  }catch{

    return [];

  }

}


async function loadHistory(){

  const [
    lidHistory,
    centerHistory,
    stampHistory
  ] =
    await Promise.all([

      loadHistoryFile(
        "lid"
      ),

      loadHistoryFile(
        "center"
      ),

      loadHistoryFile(
        "stamp"
      )

    ]);


  historyEntries = [

    ...lidHistory,
    ...centerHistory,
    ...stampHistory

  ];


  historyEntries.sort(

    (a,b) =>

      new Date(
        b.time ||
        0
      ) -

      new Date(
        a.time ||
        0
      )

  );


  renderHistory();

}


function setHistoryFilter(
  filter
){

  currentHistoryFilter =
    filter;


  [
    "All",
    "Lid",
    "Center",
    "Stamp"
  ];


  document.getElementById(
    "historyAll"
  )
  .classList
  .toggle(
    "active",
    filter === "all"
  );


  document.getElementById(
    "historyLid"
  )
  .classList
  .toggle(
    "active",
    filter === "lid"
  );



  document.getElementById(
    "historyStamp"
  )
  .classList
  .toggle(
    "active",
    filter === "stamp"
  );


  renderHistory();

}


function renderHistory(){

  const el =
    document.getElementById(
      "history"
    );


  let logs =
    historyEntries;


  if(
    currentHistoryFilter !==
    "all"
  ){

    logs =
      logs.filter(

        item =>
          item.type ===
          currentHistoryFilter

      );

  }


  if(
    !logs.length
  ){

    el.innerHTML = `

      <span class="muted">

        尚無更新紀錄。

      </span>

    `;

    return;

  }


  const typeLabels = {

    lid:
      "Poké Lid",

    center:
      "Pokémon Center",

    stamp:
      "Stamp Rally"

  };


  el.innerHTML =

    logs
      .slice(
        0,
        50
      )
      .map(

        item => `

          <div class="history-card">

            <b>
              ${escapeHtml(
                item.time ||
                ""
              )}
            </b>


            <span
              class="history-type ${
                item.type
              }"
            >

              ${
                typeLabels[
                  item.type
                ] ||
                item.type
              }

            </span>


            <br>


            <span class="muted">

              ${
                item.event
                ?
                escapeHtml(
                  item.event
                ) + "　"
                :
                ""
              }

              版本：
              ${escapeHtml(
                item.total ??
                ""
              )}
              筆

            </span>


            <br>


            🟢 新增
            ${(item.added || []).length}

            　

            🔴 移除
            ${(item.removed || []).length}

            　

            🟡 修改
            ${(item.changed || []).length}

          </div>

        `

      )
      .join("");

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,

    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[char])

  );

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key !==
      "Escape"
    ){

      return;

    }


    const modal =
      document.getElementById(
        "modalOverlay"
      );


    const collection =
      document.getElementById(
        "collectionPanel"
      );


    const prefecture =
      document.getElementById(
        "prefecturePanel"
      );


    if(
      modal.classList.contains(
        "show"
      )
    ){

      closeModal();

      return;

    }


    if(
      collection.classList.contains(
        "show"
      )
    ){

      backToPrefectureList();

      return;

    }


    if(
      prefecture.classList.contains(
        "show"
      )
    ){

      closePrefecturePanel();

    }

  }
);
