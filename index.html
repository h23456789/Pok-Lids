========================================================= */

}

/* =========================================================
   HEADER
========================================================= */

  font-size:14px;
}

========================================================= */

}

  color:#397b83;

}

  font-size:12px;
}

   PROGRESS
========================================================= */

        0,

.region-name{

  font-weight:900;

.region-count{

  font-size:27px;

  font-weight:900;
}

  color:#83a3a7;

  font-size:13px;

/* =========================================================

.inline-obtain{

function stampIdentityKey(
  item
){

  const event =
    String(
      item?.eventId
      ||
      item?.event
      ||
      item?.eventName
      ||
      ""
    )
    .trim()
    .toLowerCase();

  const venue =
    String(
      item?.venue
      ||
      item?.name
      ||
      item?.venueZh
      ||
      item?.nameZh
      ||
      ""
    )
    .trim()
    .toLowerCase();

  return (
    event
    +
    "|"
    +
    venue
  )
  .replace(
    /\s+/g,
    ""
  );

}


function migrateStampObtainedData(){

  try{

    const currentMap = {};

    for(
      const item
      of (
        dataSets.stamp
        || []
      )
    ){

      const identity =
        stampIdentityKey(
          item
        );

      if(
        identity
        &&
        item?.id
      ){

        currentMap[
          identity
        ] =
          String(
            item.id
          );

      }

    }


    let oldMap = {};

    try{

      oldMap =
        JSON.parse(
          localStorage.getItem(
            STAMP_IDENTITY_MAP_KEY
          )
          ||
          "{}"
        );

    }catch{

      oldMap = {};

    }


    let changed =
      false;


    for(
      const [
        identity,
        newId
      ]
      of Object.entries(
        currentMap
      )
    ){

      const oldId =
        oldMap[
          identity
        ];

      if(
        oldId
        &&
        obtainedIds.stamp.has(
          String(oldId)
        )
        &&
        !obtainedIds.stamp.has(
          newId
        )
      ){

        obtainedIds.stamp.add(
          newId
        );

        changed = true;

      }

    }


    if(changed){

      saveLocalCollection(
        "stamp"
      );

    }


    localStorage.setItem(

      STAMP_IDENTITY_MAP_KEY,

      JSON.stringify(
        currentMap
      )

    );

  }catch(error){

    console.warn(
      "Stamp identity migration failed:",
      error
    );

  }

}

  if(raw){

    const n =
      Number(raw);

    if(
      Number.isInteger(n)
      &&
      n >= 1
      &&
      n <= 47
    ){

      return n;

    }

    if(
      PREF_ALIAS[raw]
    ){

      return PREF_ALIAS[
        raw
      ];

    }

    for(
      const [
        name,
        code
      ]
      of Object.entries(
        PREF_ALIAS
      )
    ){

      if(
        raw.includes(
          name
        )
      ){

        return code;

      }

    }

  }


  const combined = [

    item?.region,
    item?.name,
    item?.title,
    item?.city,
    item?.address,
    item?.location,
    item?.venue

  ]
  .filter(Boolean)
  .join(" ")
  .toLowerCase();


  for(
    const [
      name,
      code
    ]
    of Object.entries(
      PREF_ALIAS
    )
  ){

    if(
      combined.includes(
        name.toLowerCase()
      )
    ){

      return code;

    }

  }


  return null;

}

function findCenterRecord(
  item
){

  const list =
    dataSets.center
    ||
    [];

  const candidates = [

    item?.venue,
    item?.name,
    item?.venueZh,
    item?.nameZh,
    item?.centerName,
    item?.centerNameZh

  ]
  .filter(Boolean)
  .map(
    normalizeKey
  );


  for(
    const c
    of candidates
  ){

    for(
      const record
      of list
    ){

      const names = [

        record?.name,
        record?.title,
        record?.city,
        record?.venue,
        record?.nameZh,
        record?.venueZh

      ]
      .filter(Boolean)
      .map(
        normalizeKey
      );


      if(
        names.some(
          n =>
            n === c
            ||
            (
              n.length > 4
              &&
              (
                n.includes(c)
                ||
                c.includes(n)
              )
            )
        )
      ){

        return record;

      }

    }

  }

  return null;

}

      ""
    ) ===
    "pokemon_center"

    ||

    String(
      item?.venueType
      ||
      ""
    ) ===
    "pokemon_go_lab"

    ||

    rawNames.some(
      name => {

        const low =
          name.toLowerCase();

        return (

          low.includes(
            "pokemon center"
          )

          ||

          low.includes(
            "pokémon center"
          )

          ||

          low.includes(
            "ポケモンセンター"
          )

          ||

          name.includes(
            "寶可夢中心"
          )

        );

      }
    );


  if(
    isPokemonCenter
  ){

    /* ① 手動徽章 */

    if(
      item?.centerBadgeImage
    ){

      return (
        item.centerBadgeImage
      );

    }


    /* ② Pokémon Center JSON */

    const center =
      findCenterRecord(
        item
      );


    const centerImage =

      center?.pokemonCenterBadge
      ||
      center?.pokemonCenterIcon
      ||
      center?.centerBadge
      ||
      center?.centerIcon
      ||
      center?.badge
      ||
      center?.logo
      ||
      "";


    if(
      centerImage
    ){

      return centerImage;

    }


    /* ③ 官方固定徽章 */

    for(
      const name
      of rawNames
    ){

      const variants =
        centerNameVariants(
          name
        );


      for(
        const v
        of variants
      ){

        if(
          OFFICIAL_CENTER_BADGES[
            v
          ]
        ){

          return (
            OFFICIAL_CENTER_BADGES[
              v
            ]
          );

        }

      }

    }


    /* ④ Mega Tokyo */

    if(
      joinedNames.includes(
        "megatokyo"
      )
      ||
      joinedNames.includes(
        "mega東京"
      )
      ||
      joinedNames.includes(
        "メガトウキョー"
      )
      ||
      joinedNames.includes(
        "mega tokyo"
      )
    ){

      return (
        "https://shop.pokemon.co.jp/images/logos/logo-pokemoncenter-megatokyo.webp"
      );

    }

  }


  return (

    item?.stampImage
    ||
    item?.pointImage
    ||
    ""

  );

}

function normalizePointKey(
  value
){

  return String(
    value ?? ""
  )
  .toLowerCase()
  .replace(
    /[\s・･,，.。:：()（）「」『』【】]/g,
    ""
  );

}


function knownCoordinateForItem(
  item
){

  const values = [

    item?.nameZh,
    item?.name,
    item?.venueZh,
    item?.venue

  ]
  .filter(Boolean);


  for(
    const value
    of values
  ){

    const key =
      normalizePointKey(
        value
      );


    for(
      const [
        name,
        coords
      ]
      of Object.entries(
        KNOWN_STAMP_COORDINATES
      )
    ){

      if(
        normalizePointKey(
          name
        )
        ===
        key
      ){

        return coords;

      }

    }

  }

  return null;

}


function getItemLatLng(
  item
){

  let lat =
    Number(
      item?.coords?.[0]
      ??
      item?.lat
    );


  let lng =
    Number(
      item?.coords?.[1]
      ??
      item?.lng
    );


  if(
    (
      !Number.isFinite(
        lat
      )
      ||
      !Number.isFinite(
        lng
      )
    )
    &&
    (
      String(
        item?.venueType
        ||
        ""
      ) ===
      "pokemon_center"
    )
  ){

    const center =
      findCenterRecord(
        item
      );


    if(center){

      lat =
        Number(
          center?.coords?.[0]
          ??
          center?.lat
        );

      lng =
        Number(
          center?.coords?.[1]
          ??
          center?.lng
        );

    }

  }


  if(
    !Number.isFinite(lat)
    ||
    !Number.isFinite(lng)
  ){

    const known =
      knownCoordinateForItem(
        item
      );


    if(known){

      lat =
        Number(
          known[0]
        );

      lng =
        Number(
          known[1]
        );

    }

  }


  return {
    lat,
    lng
  };

}

function canonicalStampSourceUrl(
  url
){

  const raw =
    String(
      url ?? ""
    )
    .trim()
    .toLowerCase();

  if(
    !raw
  ){

    return "";

  }


  try{

    const parsed =
      new URL(
        raw,
        window.location.href
      );

    let path =
      parsed.pathname
      .replace(
        /\/$/,
        ""
      );

    path =
      path.replace(
        /^\/(?:en|ja|zh-hant|zh_hant)(?=\/|$)/i,
        ""
      );

    return (
      parsed.hostname.replace(
        /^www\./,
        ""
      )
      +
      path
    );

  }catch{

    return raw
      .replace(
        /^https?:\/\//i,
        ""
      )
      .replace(
        /^www\./i,
        ""
      )
      .replace(
        /^\/(?:en|ja|zh-hant|zh_hant)(?=\/|$)/i,
        ""
      )
      .replace(
        /\/$/,
        ""
      );

  }

}


function stampEventKey(
  meta
){

  const source =
    canonicalStampSourceUrl(
      meta?.sourceUrl
      ||
      meta?.url
      ||
      ""
    );


  if(source){

    return (
      "source:"
      +
      source
    );

  }


  return (

    "title:"
    +
    String(
      meta?.eventId
      ||
      meta?.event
      ||
      meta?.eventName
      ||
      meta?.eventZh
      ||
      meta?.eventNameZh
      ||
      "GO-STAMP-UNKNOWN"
    )
    .toLowerCase()
    .replace(
      /[\s\u3000\-‐-–—_・･.,，。:：/\\()（）「」『』【】]/g,
      ""
    )

  );

}


function getStampEventStatus(
  event
){

  const now =
    new Date();


  const start =
    event?.startDate
    ?
    new Date(
      `${event.startDate}T00:00:00`
    )
    :
    null;


  const end =
    event?.endDate
    ?
    new Date(
      `${event.endDate}T23:59:59`
    )
    :
    null;


  /*
   * 新規規則：
   * 開始日期未公布，一律視為「活動尚未開始」。
   */

  if(
    !start
  ){

    return "活動尚未開始";

  }


  if(
    now < start
  ){

    return "活動尚未開始";

  }


  if(
    end
    &&
    now > end
  ){

    return "活動已結束";

  }


  return "進行中";

}


function getStampEventDateText(

}

/* =========================================================
   FETCH
========================================================= */

async function fetchJSON(
  url
){

  const sep =
    url.includes("?")
    ? "&"
    : "?";


  const controller =
    new AbortController();


  const timeout =
    setTimeout(
      () =>
        controller.abort(),
      12000
    );


  try{

    const response =
      await fetch(
        url
        +
        sep
        +
        "ts="
        +
        Date.now(),
        {
          cache:
            "no-store",
          signal:
            controller.signal
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    return await response.json();

  }finally{

    clearTimeout(
      timeout
    );

  }

}

   DATA NORMALIZE
========================================================= */

function normalizeDataList(
  json,
  type
){

  if(
    type === "stamp"
    &&
    Array.isArray(
      json?.list
    )
  ){

    return json.list;

  }


  if(
    Array.isArray(
      json?.list
    )
  ){

    return json.list;

  }


  if(
    Array.isArray(
      json
    )
  ){

    return json;

  }


  if(
    type === "stamp"
    &&
    Array.isArray(
      json?.events
    )
  ){

    const flat = [];


    for(
      const event
      of json.events
    ){

      const points =
        Array.isArray(
          event?.stamps
        )
        ?
        event.stamps
        :
        [];


      for(
        const point
        of points
      ){

        flat.push({

          ...event,

          ...point,

          eventId:
            point?.eventId
            ||
            event?.eventId
            ||
            event?.id

        });

      }

    }


    return flat;

  }


  for(
    const key
    of [
      "data",
      "items",
      "stamps",
      "records",
      "locations",
      "results"
    ]
  ){

    if(
      Array.isArray(
        json?.[key]
      )
    ){

      return json[key];

    }

  }


  return [];

}

async function loadDataSet(
  type
){

  let lastError =
    "";


  for(
    const url
    of [
      DATA_URLS[type],
      RAW_DATA_URLS[type]
    ]
  ){

    try{

      const json =
        await fetchJSON(
          url
        );


      if(
        type === "stamp"
      ){

        stampEventsMeta =
          Array.isArray(
            json?.events
          )
          ?
          json.events
          :
          [];

      }


      const list =
        normalizeDataList(
          json,
          type
        );


      if(
        !Array.isArray(
          list
        )
      ){

        throw new Error(
          "資料格式錯誤"
        );

      }


      dataSets[type] =
        list;


      buildGroups(
        type
      );


      return true;

    }catch(error){

      lastError =
        error?.message
        ||
        String(error);


      console.warn(
        `[${type}]`,
        url,
        error
      );

    }

  }


  dataSets[type] =
    [];


  if(
    type === "stamp"
  ){

    stampEventsMeta =
      [];

  }


  buildGroups(
    type
  );


  if(
    type === collectionType
  ){

    document.getElementById(
      "regions"
    ).innerHTML = `

      <div
        class="error-box"
        style="grid-column:1/-1"
      >

        ⚠️ 資料載入失敗

        <br><br>

        ${escapeHtml(
          lastError
        )}

      </div>

    `;

  }


  return false;

}

function normalizeOverrideKey(
  value
){

  return String(
    value ?? ""
  )
  .toLowerCase()
  .replace(
    /\s+/g,
    ""
  )
  .replace(
    /[‐-–—_ー・･.,，。:：/\\()（）「」『』【】]/g,
    ""
  );

}


function findManualOverrideForItem(
  item
){

  const list =
    Array.isArray(
      manualOverrides
    )
    ?
    manualOverrides
    :
    [];


  const itemId =
    String(
      item?.id
      ??
      ""
    );


  if(
    itemId
  ){

    const exact =
      list.find(
        row =>
          String(
            row?.id
            ??
            ""
          )
          ===
          itemId
      );


    if(exact){

      return exact;

    }

  }


  const eventId =
    String(
      item?.eventId
      ??
      ""
    );


  const names = [

    item?.venue,
    item?.name,
    item?.venueZh,
    item?.nameZh

  ]
  .filter(Boolean)
  .map(
    normalizeOverrideKey
  );


  for(
    const row
    of list
  ){

    const rowEventId =
      String(
        row?.eventId
        ??
        ""
      );


    if(
      eventId
      &&
      rowEventId
      &&
      eventId
      !==
      rowEventId
    ){

      continue;

    }


    const overrideNames = [

      row?.venue,
      row?.name,
      row?.venueZh,
      row?.nameZh,

      ...(
        Array.isArray(
          row?.venueAliases
        )
        ?
        row.venueAliases
        :
        []
      ),

      ...(
        Array.isArray(
          row?.aliases
        )
        ?
        row.aliases
        :
        []
      )

    ]
    .filter(Boolean)
    .map(
      normalizeOverrideKey
    );


    if(
      names.some(
        name =>
          overrideNames.includes(
            name
          )
      )
    ){

      return row;

    }

  }


  return null;

}


function applyRuntimeManualOverrides(){

  for(
    const item
    of dataSets.stamp
    ||
    []
  ){

    const override =
      findManualOverrideForItem(
        item
      );


    if(
      !override
    ){

      continue;

    }


    if(
      Array.isArray(
        override.manualCoordinates
      )
      &&
      override.manualCoordinates.length >= 2
    ){

      const lat =
        Number(
          override.manualCoordinates[0]
        );


      const lng =
        Number(
          override.manualCoordinates[1]
        );


      if(
        Number.isFinite(
          lat
        )
        &&
        Number.isFinite(
          lng
        )
      ){

        item.coords = [
          lat,
          lng
        ];

        item.lat =
          lat;

        item.lng =
          lng;

        item.coordinatesManual =
          true;

      }

    }


    if(
      override.manualStampImage
    ){

      item.stampImage =
        override.manualStampImage;

      item.stampImageManual =
        true;

    }


    if(
      override.manualCenterBadge
    ){

      item.centerBadgeImage =
        override.manualCenterBadge;

      item.centerBadgeManual =
        true;

    }

  }

}

function buildGroups(
  type
){

  groups[type] =
    {};


  if(
    type === "stamp"
  ){

    return;

  }


  for(
    const item
    of dataSets[type]
    ||
    []
  ){

    item.__prefCode =
      resolvePrefecture(
        item
      );


    const pref =
      item.__prefCode
      ?
      PREF[
        item.__prefCode
      ]
      :
      null;


    if(pref){

      (
        groups[type][pref]
        ||=
        []
      )
      .push(
        item
      );

    }

  }

}


/* =========================================================
   STAMP EVENTS — CANONICAL LANGUAGE DEDUPE
========================================================= */

function getStampEvents(){

  const map =
    new Map();


  function localeRank(
    url
  ){

    const path =
      String(
        url ?? ""
      ).toLowerCase();


    if(
      path.includes(
        "/zh-hant/"
      )
      ||
      path.includes(
        "/zh_hant/"
      )
    ){

      return 0;

    }


    if(
      path.includes(
        "/ja/"
      )
    ){

      return 1;

    }


    if(
      path.includes(
        "/en/"
      )
    ){

      return 2;

    }


    return 3;

  }


  function mergeEvent(
    event,
    meta
  ){

    const incomingRank =
      localeRank(
        meta?.sourceUrl
      );


    const currentRank =
      localeRank(
        event.sourceUrl
      );


    if(
      !event.sourceUrl
      ||
      incomingRank <
      currentRank
    ){

      for(
        const field
        of [
          "event",
          "eventName",
          "eventZh",
          "eventNameZh",
          "activity",
          "activityZh",
          "descriptionZh",
          "sourceUrl",
          "activityImage",
          "eventImage",
          "reward",
          "rewardZh"
        ]
      ){

        if(
          meta?.[field]
        ){

          event[field] =
            meta[field];

        }

      }

    }else{

      for(
        const field
        of [
          "eventZh",
          "eventNameZh",
          "activityZh",
          "descriptionZh",
          "activityImage",
          "eventImage",
          "rewardZh"
        ]
      ){

        if(
          !event[field]
          &&
          meta?.[field]
        ){

          event[field] =
            meta[field];

        }

      }

    }


    if(
      meta?.startDate
      &&
      (
        !event.startDate
        ||
        meta.startDate
        <
        event.startDate
      )
    ){

      event.startDate =
        meta.startDate;

    }


    if(
      meta?.endDate
      &&
      (
        !event.endDate
        ||
        meta.endDate
        >
        event.endDate
      )
    ){

      event.endDate =
        meta.endDate;

    }


    if(
      event.expectedStamps
      ==
      null
      &&
      Number.isFinite(
        Number(
          meta?.expectedStamps
        )
      )
    ){

      event.expectedStamps =
        Number(
          meta.expectedStamps
        );

    }

  }


  function ensure(
    meta
  ){

    const key =
      stampEventKey(
        meta
      );


    if(
      !map.has(
        key
      )
    ){

      map.set(
        key,
        {
          id:
            String(
              meta?.eventId
              ||
              meta?.id
              ||
              key
            ),

          event:
            meta?.event
            ||
            meta?.eventName
            ||
            "GO 集章趣",

          eventZh:
            meta?.eventZh
            ||
            meta?.eventNameZh
            ||
            meta?.event
            ||
            "GO 集章趣",

          startDate:
            meta?.startDate
            ||
            "",

          endDate:
            meta?.endDate
            ||
            "",

          sourceUrl:
            meta?.sourceUrl
            ||
            "",

          activityImage:
            meta?.activityImage
            ||
            meta?.eventImage
            ||
            meta?.image
            ||
            "",

          eventImage:
            meta?.eventImage
            ||
            meta?.activityImage
            ||
            meta?.image
            ||
            "",

          expectedStamps:
            Number.isFinite(
              Number(
                meta?.expectedStamps
              )
            )
            ?
            Number(
              meta.expectedStamps
            )
            :
            null,

          descriptionZh:
            meta?.descriptionZh
            ||
            "",

          items:[]
        }
      );

    }


    const event =
      map.get(
        key
      );


    mergeEvent(
      event,
      meta
    );


    return event;

  }


  /* events metadata */

  for(
    const meta
    of stampEventsMeta
  ){

    ensure(
      meta
    );

  }


  /* actual points */

  for(
    const item
    of dataSets.stamp
  ){

    const event =
      ensure(
        item
      );


    const placeholderTitle =
      item?.name
      ||
      item?.venue
      ||
      item?.event
      ||
      "";


    const looksLikePlaceholder =

      !item?.stampImage
      &&
      !item?.lat
      &&
      !item?.lng
      &&
      String(
        placeholderTitle
      )
      ===
      String(
        event.event
      );


    if(
      looksLikePlaceholder
    ){

      continue;

    }


    if(
      !event.items.some(
        existing =>
          getItemId(
            existing
          )
          ===
          getItemId(
            item
          )
      )
    ){

      event.items.push(
        item
      );

    }


    if(
      item.startDate
      &&
      (
        !event.startDate
        ||
        item.startDate
        <
        event.startDate
      )
    ){

      event.startDate =
        item.startDate;

    }


    if(
      item.endDate
      &&
      (
        !event.endDate
        ||
        item.endDate
        >
        event.endDate
      )
    ){

      event.endDate =
        item.endDate;

    }

  }


  return [
    ...map.values()
  ]
  .filter(
    event =>
      event.items.length
      ||
      event.startDate
      ||
      event.endDate
  )
  .sort(

    (a,b)=>

      (
        a.startDate
        ||
        "9999"
      )
      .localeCompare(
        b.startDate
        ||
        "9999"
      )

      ||

      (
        a.eventZh
        ||
        a.event
        ||
        ""
      )
      .localeCompare(
        b.eventZh
        ||
        b.event
        ||
        ""
      )

  );

}

function switchCollectionType(
  type
){

  if(
    ![
      "lid",
      "stamp"
    ].includes(
      type
    )
  ){

    return;

  }


  collectionType =
    type;


  document
    .getElementById(
      "tabLid"
    )
    .classList
    .toggle(
      "active",
      type === "lid"
    );


  document
    .getElementById(
      "tabStamp"
    )
    .classList
    .toggle(
      "active",
      type === "stamp"
    );


  document.getElementById(
    "sectionTitle"
  ).textContent =

    type === "lid"

    ?

    "🔴 Poké Lid 蒐集進度"

    :

    "🎟️ GO 集章趣 蒐集進度";


  document.getElementById(
    "progressLabel"
  ).textContent =

    type === "lid"

    ?

    "Poké Lid 已收集："

    :

    "GO 集章趣 已收集：";


  closeAllPanels();


  currentRegion =
    null;

  currentPrefecture =
    null;

  currentStampEventId =
    null;

  currentCollectionItems =
    [];

    null;


  document.getElementById(
    "stampAllDownloadBox"
  ).style.display =

    type === "stamp"
    ?
    "flex"
    :
    "none";


  renderRegions();

  updateOverall();

}

   CLOSE
========================================================= */

function closeAllPanels(){

  for(
    const id
    of [
      "prefecturePanel",
      "collectionPanel",
      "modalOverlay"
    ]
  ){

    document
      .getElementById(
        id
      )
      .classList
      .remove(
        "show"
      );

  }


  document.body.classList.remove(
    "no-scroll"
  );

}


/* =========================================================
   OVERALL
========================================================= */

function updateOverall(){

  if(
    collectionType === "stamp"
  ){

    const events =
      getStampEvents();


    let total =
      0;

    let obtained =
      0;


    for(
      const event
      of events
    ){

      const items =
        event.items
        ||
        [];


      const eventTotal =
        Number(
          event.expectedStamps
          ||
          0
        )
        ||
        items.length;


      total +=
        eventTotal;


      obtained +=
        items.filter(
          x =>
            obtainedIds.stamp.has(
              getItemId(x)
            )
        ).length;

    }


    document.getElementById(
      "totalObtained"
    ).textContent =
      obtained;


    document.getElementById(
      "totalCount"
    ).textContent =
      total;


    return;

  }


  const list =
    dataSets.lid
    ||
    [];


  const obtained =
    list.filter(
      item =>
        obtainedIds.lid.has(
          getItemId(item)
        )
    ).length;


  document.getElementById(
    "totalObtained"
  ).textContent =
    obtained;


  document.getElementById(
    "totalCount"
  ).textContent =
    list.length;

}

   REGION
========================================================= */

function renderRegions(){

  const el =
    document.getElementById(
      "regions"
    );


  if(
    collectionType === "stamp"
  ){

    return renderStampEvents(
      el
    );

  }


  const list =
    dataSets.lid
    ||
    [];


  if(
    !list.length
  ){

    el.innerHTML = `

      <div
        class="error-box"
        style="grid-column:1/-1"
      >

        ⚠️ Poké Lid 沒有資料

      </div>

    `;

    return;

  }


  el.innerHTML =
    "";


  for(
    const [
      regionName,
      region
    ]
    of Object.entries(
      REGIONS
    )
  ){

    const items =
      list.filter(
        item =>
          region.prefs.includes(
            Number(
              item.__prefCode
            )
          )
      );


    const obtained =
      items.filter(
        item =>
          obtainedIds.lid.has(
            getItemId(item)
          )
      ).length;


    const total =
      items.length;


    const percent =
      total
      ?
      Math.round(
        obtained
        /
        total
        *
        1000
      )
      /
      10

      :

      0;


    const sample =
      items.slice(
        0,
        3
      );


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "region-card";


    card.onclick =
      () =>
        openRegion(
          regionName
        );


    const images =
      sample
      .map(
        item => {

          const image =
            getItemImageUrl(
              "lid",
              item
            );


          if(
            !image
          ){

            return "";

          }


          return `

            <img
              class="region-image"
              src="${escapeHtml(image)}"
              alt=""
              loading="lazy"
            >

          `;

        }
      )
      .join("");


    const completeStamp =

      total > 0
      &&
      obtained >= total

      ?

      `
        <div
          class="collection-complete-stamp"
          aria-label="已完成"
        >

          完成

          <small>
            COMPLETE
          </small>

        </div>
      `

      :

      "";


    card.innerHTML = `

      <div class="region-images">

        ${
          images

          ||

          `
            <div class="region-empty">
              尚無資料
            </div>
          `
        }

        ${completeStamp}

      </div>


      <div class="region-info">

        <div class="region-name">

          ${escapeHtml(
            regionName
          )}

        </div>


        <div class="region-count">

          ${obtained}
          /
          ${total}

        </div>


        <div class="region-percent">

          完成率
          ${percent}%

        </div>


        <div class="download-subbox">

          <button
            class="download-subbtn"
            onclick="
              event.stopPropagation();
              downloadLidGroup(
                '${escapeJs(regionName)}',
                'txt'
              )
            "
          >
            TXT
          </button>


          <button
            class="download-subbtn"
            onclick="
              event.stopPropagation();
              downloadLidGroup(
                '${escapeJs(regionName)}',
                'json'
              )
            "
          >
            JSON
          </button>


          <button
            class="download-subbtn"
            onclick="
              event.stopPropagation();
              downloadLidGroup(
                '${escapeJs(regionName)}',
                'csv'
              )
            "
          >
            CSV
          </button>

        </div>

      </div>

    `;


    el.appendChild(
      card
    );

  }

}


/* =========================================================
   STAMP EVENTS
========================================================= */

function renderStampEvents(
  el
){

  const events =
    getStampEvents();


  if(
    !events.length
  ){

    el.innerHTML = `

      <div
        class="error-box"
        style="grid-column:1/-1"
      >

        ⚠️ 目前沒有找到 Pokémon GO 官方「GO 集章趣」資料。

        <br><br>

        資料由 GitHub Actions
        自動同步 Pokémon GO 官方網站。

      </div>

    `;

    return;

  }


  el.innerHTML =
    "";


  for(
    const event
    of events
  ){

    const items =
      event.items
      ||
      [];


    const obtained =
      items.filter(
        x =>
          obtainedIds.stamp.has(
            getItemId(x)
          )
      ).length;


    const total =
      Number(
        event.expectedStamps
        ||
        0
      )
      ||
      items.length;


    const percent =
      total
      ?
      Math.round(
        obtained
        /
        total
        *
        1000
      )
      /
      10

      :

      0;


    const known =
      items.length;


    const status =
      getStampEventStatus(
        event
      );


    const banner =
      event.activityImage
      ||
      event.eventImage
      ||
      event.image
      ||
      "";


    const statusKey =

      status === "活動尚未開始"

      ?

      "upcoming"

      :

      status === "活動已結束"

      ?

      "ended"

      :

      "active";


    const statusOverlay =

      statusKey !== "active"

      ?

      `
        <div
          class="stamp-event-status-overlay"
        >

          ${escapeHtml(
            status
          )}

        </div>
      `

      :

      "";


    const completeStamp =

      total > 0
      &&
      obtained >= total

      ?

      `
        <div
          class="collection-complete-stamp"
          aria-label="已完成"
        >

          完成

          <small>
            COMPLETE
          </small>

        </div>
      `

      :

      "";


    const countText =

      total

      ?

      `${obtained} / ${total}`

      :

      known

      ?

      `${obtained} / ${known}`

      :

      "尚待官方公布";


    const note =

      total
      &&
      known < total

      ?

      `
        <div
          class="stamp-event-data-note"
        >

          目前已取得
          ${known}
          /
          ${total}
          個官方集章點資料

        </div>
      `

      :

      "";


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "region-card";


    card.onclick =
      () =>
        openStampEvent(
          event.id
        );


    card.innerHTML = `

      <div
        class="
          region-images
          stamp-event-banner-wrap
        "
      >

        ${
          banner

          ?

          `
            <img
              class="stamp-event-banner"
              src="${escapeHtml(
                banner
              )}"
              alt="${escapeHtml(
                event.eventZh
                ||
                event.event
                ||
                "GO 集章趣"
              )}"
              loading="lazy"

              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='flex';
              "
            >

            <div
              class="stamp-event-banner-fallback"
              style="display:none;"
            >

              ${escapeHtml(
                event.eventZh
                ||
                event.event
                ||
                "GO 集章趣"
              )}

            </div>
          `

          :

          `
            <div
              class="stamp-event-banner-fallback"
            >

              ${escapeHtml(
                event.eventZh
                ||
                event.event
                ||
                "GO 集章趣"
              )}

            </div>
          `

        }


        ${statusOverlay}


        ${completeStamp}

      </div>


      <div class="region-info">

        <div class="region-name">

          ${escapeHtml(
            event.eventZh
            ||
            event.event
            ||
            "GO 集章趣"
          )}

        </div>


        <div class="region-count">

          ${countText}

        </div>


        <div
          class="
            stamp-event-live-status
            ${statusKey}
          "
        >

          ${escapeHtml(
            status
          )}

        </div>


        <div
          class="stamp-event-date"
        >

          ${escapeHtml(
            getStampEventDateText(
              event
            )
          )}

        </div>


        <div
          class="region-percent"
        >

          ${
            total
            ?

            `完成率 ${percent}%`

            :

            "資料待官方公布"

          }


          ${note}


          ${
            known

            ?

            `
              <br>

              📍 座標資料

              ${
                items.filter(
                  item => {

                    const p =
                      getItemLatLng(
                        item
                      );

                    return (
                      Number.isFinite(
                        p.lat
                      )
                      &&
                      Number.isFinite(
                        p.lng
                      )
                    );

                  }
                ).length
              }

              /

              ${known}

            `

            :

            ""

          }

        </div>


        <div class="download-subbox">

          <button
            class="download-subbtn"
            onclick="
              event.stopPropagation();
              downloadStampEvent(
                '${escapeJs(
                  event.id
                )}',
                'txt'
              )
            "
          >
            TXT
          </button>


          <button
            class="download-subbtn"
            onclick="
              event.stopPropagation();
              downloadStampEvent(
                '${escapeJs(
                  event.id
                )}',
                'json'
              )
            "
          >
            JSON
          </button>


          <button
            class="download-subbtn"
            onclick="
              event.stopPropagation();
              downloadStampEvent(
                '${escapeJs(
                  event.id
                )}',
                'csv'
              )
            "
          >
            CSV
          </button>

        </div>

      </div>

    `;


    el.appendChild(
      card
    );

  }

}

  renderPrefectureGrid();

    .getElementById(
      "prefecturePanel"
    )
    .classList
    .add(
      "show"
    );


  document.body.classList.add(
    "no-scroll"
  );

}

    !currentRegion

  const region =
    REGIONS[
      currentRegion
    ];


  const items =
    (
      dataSets.lid
      ||
      []

    .filter(
      item =>
        region.prefs.includes(

  ){

    return;

  }


  currentPrefecture =
    prefName;


  currentCollectionItems =
    groups.lid[
      prefName
    ]
    ||
    [];

/* =========================================================
   COPY
========================================================= */

async function copyCoordinate(
  event
){

  if(event){

    event.stopPropagation();

  }


  const text =
    document
      .getElementById(
        "modalCoordinate"
      )
      .textContent
      .trim();


  if(
    !text
    ||
    text ===
    "無座標資料"
  ){

    return;

  }


  try{

    await navigator.clipboard.writeText(
      text
    );

  }catch{

    const ta =
      document.createElement(
        "textarea"
      );


    ta.value =
      text;


    ta.style.position =
      "fixed";


    ta.style.opacity =
      "0";


    document.body.appendChild(
      ta
    );


    ta.focus();

    ta.select();


    try{

      document.execCommand(
        "copy"
      );

    }catch{}


    ta.remove();

  }


  const hint =
    document.getElementById(
      "copyHint"
    );


  hint.classList.add(
    "show"
  );


  setTimeout(

    () =>
      hint.classList.remove(
        "show"
      ),

    1500

  );

}

/* =========================================================
   DOWNLOAD
========================================================= */

function escapeJs(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\r?\n/g,
    " "
  );

}


function sanitizeFilename(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /[\\/:*?"<>|]/g,
    "_"
  )
  .trim()
  ||
  "download";

}


function buildGroupedJson(
  groupsObject
){

  return JSON.stringify(
    groupsObject,
    null,
    2
  );

}


function buildGroupedCsv(
  groupsObject
){

  const rows = [
    [
      "group",
      "title",
      "lat",
      "lng"
    ]
  ];


  for(
    const [
      group,
      items
    ]
    of Object.entries(
      groupsObject
    )
  ){

    for(
      const item
      of items
    ){

      rows.push([
        group,
        item.title,
        item.lat,
        item.lng
      ]);

    }

  }


  return rows
    .map(
      row =>
        row
          .map(
            v =>
              `"${String(
                v ?? ""
              )
              .replaceAll(
                '"',
                '""'
              )}"`
          )
          .join(",")
    )
    .join("\n");

}


function buildGroupedTxt(
  groupsObject
){

  const lines = [];


  for(
    const [
      group,
      items
    ]
    of Object.entries(
      groupsObject
    )
  ){

    lines.push(
      `# ===== ${group} (${items.length}) =====`
    );


    for(
      const item
      of items
    ){

      lines.push(
        `${item.title}`
      );

      lines.push(
        `${item.lat},${item.lng}`
      );

      lines.push(
        ""
      );

    }


    lines.push(
      ""
    );

  }


  return lines.join(
    "\n"
  );

}


function downloadGroupedData(
  groupsObject,
  groupId,
  format,
  filenameBase
){

  let content =
    "";

  let mime =
    "text/plain;charset=utf-8";

  let ext =
    "txt";


  if(
    format === "json"
  ){

    content =
      buildGroupedJson(
        groupsObject
      );

    mime =
      "application/json;charset=utf-8";

    ext =
      "json";

  }

  else if(
    format === "csv"
  ){

    content =
      "\ufeff"
      +
      buildGroupedCsv(
        groupsObject
      );

    mime =
      "text/csv;charset=utf-8";

    ext =
      "csv";

  }

  else{

    content =
      "\ufeff"
      +
      buildGroupedTxt(
        groupsObject
      );

  }


  downloadBlob(

    new Blob(
      [
        content
      ],
      {
        type:
          mime
      }
    ),

    `${sanitizeFilename(
      filenameBase
    )}.${ext}`

  );

}

function getStampDownloadGroups(){

  const output =
    {};


  for(
    const event
    of getStampEvents()
  ){

    if(
      getStampEventStatus(
        event
      )
      ===
      "活動尚未開始"
    ){

      continue;

    }


    const title =
      String(
        event.eventZh
        ||
        event.event
        ||
        "GO 集章趣"
      )
      .trim();


    if(
      !output[title]
    ){

      output[title] =
        [];

    }


    for(
      const item
      of (
        event.items
        ||
        []
      )
    ){

      const {
        lat,
        lng
      } =
        getItemLatLng(
          item
        );


      output[title].push({

        title:
          getItemTitle(
            "stamp",
            item
          ),

        lat:
          Number.isFinite(lat)
          ?
          String(lat)
          :
          "",

        lng:
          Number.isFinite(lng)
          ?
          String(lng)
          :
          ""

      });

    }

  }


  return output;

}

    );

function adminDecodeContent(
json
){

  const encoded =
    String(
      json?.content
      ||
      ""
    )
    .replace(
      /\n/g,
      ""
    );


  if(
    !encoded
  ){

    return "";

  }


  const binary =
    atob(
      encoded
    );


  const bytes =
    Uint8Array.from(
      binary,
      char =>
        char.charCodeAt(0)
    );


  const decoder =
    new TextDecoder(
      "utf-8"
    );


  return decoder.decode(
    bytes
  );

}


function adminEncodeText(
text
){

  const bytes =
    new TextEncoder().encode(
      text
    );


  let binary =
    "";


  const chunkSize =
    0x8000;


  for(
    let i=0;
    i<bytes.length;
    i+=chunkSize
  ){

    binary +=
      String.fromCharCode(
        ...bytes.subarray(
          i,
          i+chunkSize
        )
      );

  }


  return btoa(
    binary
  );

}

                ||
                "",

              activityImage:
                item.activityImage

function upsertOverride(
  rows,
  incoming
){

  const targetIndex =
    rows.findIndex(
      row => {

        if(
          incoming.id
          &&
          row.id
        ){

          return (
            String(row.id)
            ===
            String(
              incoming.id
            )
          );

        }


        return (

          String(
            row.eventId
            ||
            ""
          )
          ===
          String(
            incoming.eventId
            ||
            ""
          )

          &&

          normalizeOverrideKey(
            row.venue
            ||
            row.name
            ||
            ""
          )
          ===
          normalizeOverrideKey(
            incoming.venue
            ||
            incoming.name
            ||
            ""
          )

        );

      }
    );


  if(
    targetIndex >= 0
  ){

    rows[
      targetIndex
    ] = {

      ...rows[
        targetIndex
      ],

      ...incoming

    };

  }else{

    rows.push(
      incoming
    );

  }

}


async function adminSaveOverride(
  patch,
  message
){

  const {
    data,
    sha
  } =
    await adminReadOverrideFile();


  const rows =
    Array.isArray(
      data.items
    )
    ?
    data.items
    :
    [];


  upsertOverride(
    rows,
    patch
  );


  data.version =
    "1.0";


  data.updated =
    new Date()
      .toISOString();


  data.items =
    rows;


  const content =
    adminEncodeText(
      JSON.stringify(
        data,
        null,
        2
      )
      +
      "\n"
    );


  const result =
    await adminGithubPut(
      "svgstamp_manual_overrides.json",
      content,
      message,
      sha
    );


  return result;

}

/* =========================================================
   SCREENSHOT / CROP
========================================================= */

function adminGetCanvasContext(){

  const canvas =
    document.getElementById(
      "adminCropCanvas"
    );


  return {

    canvas,

    ctx:
      canvas.getContext(
        "2d"
      )

  };

}


function adminLoadScreenshot(
  event
){

  const file =
    event.target.files?.[0];


  if(
    !file
  ){

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    () => {

      const img =
        new Image();


      img.onload =
        () => {

          adminState.screenshot =
            img;

          adminState.screenshotZoom =
            1;

          adminState.screenshotBaseScale =
            1;

          adminState.selection =
            null;

          adminState.currentImageCanvas =
            null;


          adminDrawScreenshot();

        };


      img.src =
        reader.result;

    };


  reader.readAsDataURL(
    file
  );

}


function adminZoom(
  amount
){

  if(
    !adminState.screenshot
  ){

    return;

  }


  adminState.screenshotZoom =
    Math.max(
      0.25,
      Math.min(
        4,
        adminState.screenshotZoom
        +
        amount
      )
    );


  adminDrawScreenshot();

}


function adminResetZoom(){

  if(
    !adminState.screenshot
  ){

    return;

  }


  adminState.screenshotZoom =
    1;


  adminDrawScreenshot();

}


function adminGetDisplayScale(){

  const img =
    adminState.screenshot;


  if(
    !img
  ){

    return 1;

  }


  const maxWidth =
    1100;


  const maxHeight =
    700;


  const baseScale =
    Math.min(
      maxWidth / img.width,
      maxHeight / img.height,
      1
    );


  return (
    baseScale
    *
    adminState.screenshotZoom
  );

}


function adminDrawScreenshot(){

  const img =
    adminState.screenshot;


  if(
    !img
  ){

    return;

  }


  const {
    canvas,
    ctx
  } =
    adminGetCanvasContext();


  const scale =
    adminGetDisplayScale();


  const width =
    Math.max(
      1,
      Math.round(
        img.width
        *
        scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        img.height
        *
        scale
      )
    );


  canvas.width =
    width;


  canvas.height =
    height;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );


  if(
    adminState.selection
  ){

    const s =
      adminState.selection;


    ctx.save();


    ctx.strokeStyle =
      "#ef4b55";

    ctx.lineWidth =
      3;


    ctx.setLineDash([
      8,
      5
    ]);


    ctx.strokeRect(
      s.x,
      s.y,
      s.w,
      s.h
    );


    ctx.fillStyle =
      "rgba(239,75,85,.12)";


    ctx.fillRect(
      s.x,
      s.y,
      s.w,
      s.h
    );


    ctx.restore();

  }

}


function adminCanvasPoint(
event
){

  const canvas =
    document.getElementById(
      "adminCropCanvas"
    );


  const rect =
    canvas.getBoundingClientRect();


  const scaleX =
    canvas.width
    /
    rect.width;


  const scaleY =
    canvas.height
    /
    rect.height;


  let clientX =
    event.clientX;


  let clientY =
    event.clientY;


  if(
    event.touches
    &&
    event.touches[0]
  ){

    clientX =
      event.touches[0].clientX;

    clientY =
      event.touches[0].clientY;

  }


  return {

    x:
      (clientX - rect.left)
      *
      scaleX,

    y:
      (clientY - rect.top)
      *
      scaleY

  };

}


function adminStartSelection(
event
){

  if(
    !adminState.screenshot
  ){

    return;

  }


  event.preventDefault();


  const p =
    adminCanvasPoint(
      event
    );


  adminState.dragging =
    true;


  adminState.dragStart =
    p;


  adminState.selection = {

    x:p.x,

    y:p.y,

    w:0,

    h:0

  };


  adminDrawScreenshot();

}


function adminMoveSelection(
event
){

  if(
    !adminState.dragging
  ){

    return;

  }


  event.preventDefault();


  const p =
    adminCanvasPoint(
      event
    );


  const s =
    adminState.dragStart;


  const x =
    Math.min(
      s.x,
      p.x
    );


  const y =
    Math.min(
      s.y,
      p.y
    );


  const w =
    Math.abs(
      p.x
      -
      s.x
    );


  const h =
    Math.abs(
      p.y
      -
      s.y
    );


  adminState.selection = {

    x,
    y,
    w,
    h

  };


  adminDrawScreenshot();

}


function adminEndSelection(
event
){

  if(
    !adminState.dragging
  ){

    return;

  }


  event.preventDefault();


  adminState.dragging =
    false;


  adminState.dragStart =
    null;


  const s =
    adminState.selection;


  if(
    !s
    ||
    s.w < 4
    ||
    s.h < 4
  ){

    adminState.selection =
      null;

  }


  adminDrawScreenshot();

}


function adminClearCrop(){

  adminState.selection =
    null;


  adminState.currentImageCanvas =
    null;


  document.getElementById(
    "adminCropPreview"
  ).src =
    "";


  document.getElementById(
    "adminProcessedPreview"
  ).src =
    "";


  adminDrawScreenshot();

}


function adminCropSelection(){

  const img =
    adminState.screenshot;

  const s =
    adminState.selection;


  if(
    !img
    ||
    !s
    ||
    s.w < 4
    ||
    s.h < 4
  ){

    alert(
      "請先上傳截圖並框選圖章。"
    );

    return;

  }


  const displayScale =
    adminGetDisplayScale();


  const sx =
    s.x /
    displayScale;


  const sy =
    s.y /
    displayScale;


  const sw =
    s.w /
    displayScale;


  const sh =
    s.h /
    displayScale;


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        sw
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        sh
      )
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    img,

    Math.max(
      0,
      Math.round(
        sx
      )
    ),

    Math.max(
      0,
      Math.round(
        sy
      )
    ),

    Math.min(
      img.width,
      Math.round(
        sw
      )
    ),

    Math.min(
      img.height,
      Math.round(
        sh
      )
    ),

    0,
    0,
    canvas.width,
    canvas.height
  );


  adminState.currentImageCanvas =
    canvas;


  const rawUrl =
    canvas.toDataURL(
      "image/png"
    );


  document.getElementById(
    "adminCropPreview"
  ).src =
    rawUrl;


  const processed =
    adminProcessStampCanvas(
      canvas
    );


  document.getElementById(
    "adminProcessedPreview"
  ).src =
    processed.toDataURL(
      "image/png"
    );


  adminState.processedCanvas =
    processed;


  document.getElementById(
    "adminCropStatus"
  ).textContent =
    "裁切完成，可以上傳最終圖章。";

}


function adminProcessStampCanvas(
  source
){

  const output =
    document.createElement(
      "canvas"
    );


  const size =
    Math.max(
      1,
      Math.min(
        source.width,
        source.height
      )
    );


  output.width =
    size;


  output.height =
    size;


  const ctx =
    output.getContext(
      "2d"
    );


  ctx.clearRect(
    0,
    0,
    size,
    size
  );


  const offsetX =
    Math.floor(
      (
        source.width
        -
        size
      )
      /
      2
    );


  const offsetY =
    Math.floor(
      (
        source.height
        -
        size
      )
      /
      2
    );


  const imageData =
    source
      .getContext(
        "2d"
      )
      .getImageData(
        offsetX,
        offsetY,
        size,
        size
      );


  if(
    document.getElementById(
      "adminCircleOutput"
    ).checked
  ){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      size / 2,
      size / 2,
      size / 2,
      0,
      Math.PI * 2
    );

    ctx.clip();

  }


  ctx.putImageData(
    imageData,
    0,
    0
  );


  if(
    document.getElementById(
      "adminRemoveBackground"
    ).checked
  ){

    adminMakeBackgroundTransparent(
      output
    );

  }


  if(
    document.getElementById(
      "adminCircleOutput"
    ).checked
  ){

    ctx.restore();

    /*
     * 重新裁切外圍透明區。
     */

    const finalCanvas =
      document.createElement(
        "canvas"
      );


    finalCanvas.width =
      size;

    finalCanvas.height =
      size;


    const finalCtx =
      finalCanvas.getContext(
        "2d"
      );


    finalCtx.save();

    finalCtx.beginPath();

    finalCtx.arc(
      size / 2,
      size / 2,
      size / 2,
      0,
      Math.PI * 2
    );

    finalCtx.clip();

    finalCtx.drawImage(
      output,
      0,
      0
    );

    finalCtx.restore();


    return finalCanvas;

  }


  return output;

}


function adminMakeBackgroundTransparent(
  canvas
){

  const ctx =
    canvas.getContext(
      "2d"
    );


  const width =
    canvas.width;


  const height =
    canvas.height;


  const imageData =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const data =
    imageData.data;


  const samplePoints = [

    [1,1],

    [width-2,1],

    [1,height-2],

    [width-2,height-2]

  ];


  const bg = {

    r:0,
    g:0,
    b:0

  };


  let count =
    0;


  for(
    const [
      x,
      y
    ]
    of samplePoints
  ){

    if(
      x >= 0
      &&
      y >= 0
      &&
      x < width
      &&
      y < height
    ){

      const index =
        (
          y
          *
          width
          +
          x
        )
        *
        4;


      bg.r +=
        data[
          index
          +
          0
        ];


      bg.g +=
        data[
          index
          +
          1
        ];


      bg.b +=
        data[
          index
          +
          2
        ];


      count++;

    }

  }


  if(
    !count
  ){

    return;

  }


  bg.r =
    Math.round(
      bg.r / count
    );


  bg.g =
    Math.round(
      bg.g / count
    );


  bg.b =
    Math.round(
      bg.b / count
    );


  const tolerance =
    Number(
      document.getElementById(
        "adminBgTolerance"
      ).value
    )
    ||
    35;


  function colorDistance(
    r,
    g,
    b
  ){

    return Math.sqrt(

      (
        r-bg.r
      )
      *
      (
        r-bg.r
      )

      +

      (
        g-bg.g
      )
      *
      (
        g-bg.g
      )

      +

      (
        b-bg.b
      )
      *
      (
        b-bg.b
      )

    );

  }


  /*
   * 只移除和邊界背景連通的相近顏色，
   * 避免把圖章本身同色區域整張挖掉。
   */

  const visited =
    new Uint8Array(
      width * height
    );


  const queue = [];


  function enqueue(
    x,
    y
  ){

    if(
      x < 0
      ||
      y < 0
      ||
      x >= width
      ||
      y >= height
    ){

      return;

    }


    const pos =
      y
      *
      width
      +
      x;


    if(
      visited[pos]
    ){

      return;

    }


    visited[pos] =
      1;


    queue.push(
      [
        x,
        y
      ]
    );

  }


  for(
    let x=0;
    x<width;
    x++
  ){

    enqueue(
      x,
      0
    );

    enqueue(
      x,
      height-1
    );

  }


  for(
    let y=0;
    y<height;
    y++
  ){

    enqueue(
      0,
      y
    );

    enqueue(
      width-1,
      y
    );

  }


  let index =
    0;


  while(
    index <
    queue.length
  ){

    const [
      x,
      y
    ] =
      queue[
        index++
      ];


    const p =
      (
        y
        *
        width
        +
        x
      )
      *
      4;


    const r =
      data[
        p
      ];


    const g =
      data[
        p+1
      ];


    const b =
      data[
        p+2
      ];


    if(
      colorDistance(
        r,
        g,
        b
      )
      <=
      tolerance
    ){

      data[
        p+3
      ] =
        0;


      enqueue(
        x+1,
        y
      );

      enqueue(
        x-1,
        y
      );

      enqueue(
        x,
        y+1
      );

      enqueue(
        x,
        y-1
      );

    }

  }


  ctx.putImageData(
    imageData,
    0,
    0
  );

}


async function adminUploadProcessedImage(){

  if(
    !adminRequirePoint()
  ){

    return;

  }


  const canvas =
    adminState.processedCanvas;


  if(
    !canvas
  ){

    alert(
      "請先裁切圖章。"
    );

    return;

  }


  try{

    adminSetSaveStatus(
      "正在上傳圖章……"
    );


    const blob =
      await new Promise(
        resolve =>
          canvas.toBlob(
            resolve,
            "image/png"
          )
      );


    if(
      !blob
    ){

      throw new Error(
        "PNG 產生失敗"
      );

    }


    const buffer =
      await blob.arrayBuffer();


    const bytes =
      new Uint8Array(
        buffer
      );


    let binary =
      "";


    const chunkSize =
      0x8000;


    for(
      let i=0;
      i<bytes.length;
      i+=chunkSize
    ){

      binary +=
        String.fromCharCode(
          ...bytes.subarray(
            i,
            i+chunkSize
          )
        );

    }


    const base64 =
      btoa(
        binary
      );


    const pointId =
      getItemId(
        adminState.selectedPoint
      )
      ||
      "STAMP-POINT";


    const path =
      `assets/stamps/${sanitizeFilename(pointId)}.png`;


    let sha =
      "";


    try{

      const existing =
        await adminGithubGet(
          path
        );


      sha =
        existing.sha
        ||
        "";

    }catch{

      sha =
        "";

    }


    await adminGithubPut(

      path,

      base64,

      `admin: update stamp image ${pointId}`,

      sha

    );


    const imageUrl =
      `assets/stamps/${sanitizeFilename(pointId)}.png`;


    await adminSaveOverride(

      {

        id:
          adminState.selectedPoint.id,

        eventId:
          adminState.selectedPoint.eventId
          ||
          adminState.selectedEvent?.eventId
          ||
          "",

        venue:
          adminState.selectedPoint.venue
          ||
          adminState.selectedPoint.name
          ||
          "",

        manualStampImage:
          imageUrl,

        stampImageSource:
          "Manual screenshot crop",

        stampImageOfficial:
          false

      },

      `admin: set manual stamp image ${pointId}`

    );


    adminState.selectedPoint.stampImage =
      imageUrl;


    adminState.selectedPoint.stampImageManual =
      true;


    adminSetSaveStatus(
      `✓ 圖章已上傳：${imageUrl}`,
      true
    );


  }catch(error){

    console.error(
      error
    );


    adminSetSaveStatus(
      `上傳失敗：${error.message}`
    );

  }

}

  document.getElementById(
    "adminToken"
  ).value =

}

      document.getElementById(

      );

      );

      );

      );

        }
      );

        {
          passive:false
        }
      );

        }
      );

    }

  }
);

========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key !==
      "Escape"
    ){

      return;

    }


    const modal =
      document.getElementById(
        "modalOverlay"
      );


    const collection =
      document.getElementById(
        "collectionPanel"
      );


    const prefecture =
      document.getElementById(
        "prefecturePanel"
      );


    const admin =
      document.getElementById(
        "adminOverlay"
      );


    if(
      admin.classList.contains(
        "show"
      )
    ){

      closeAdminPanel();

      return;

    }


    if(
      modal.classList.contains(
        "show"
      )
    ){

      closeModal();

      return;

    }


    if(
      collection.classList.contains(
        "show"
      )
    ){

      backToPrefectureList();

      return;

    }


    if(
      prefecture.classList.contains(
        "show"
      )
    ){

      closePrefecturePanel();

    }

  }
);


/* =========================================================
   START
========================================================= */

async function start(){

  loadLocalCollection(
    "lid"
  );


  loadLocalCollection(
    "stamp"
  );


  /*
   * History 不阻塞 Lid 首頁。
   */

  loadHistory();


  /*
   * 第一階段：
   * 只讀 Lid。
   * Lid 準備好就立即畫面。
   */

  const lidReady =
    await loadDataSet(
      "lid"
    );


  if(
    lidReady
  ){

    switchCollectionType(
      "lid"
    );

  }else{

    renderRegions();

    updateOverall();

  }


  /*
   * 第二階段：
   * Center / Stamp / Manual
   * 背景載入。
   */

  await Promise.all([

    loadDataSet(
      "center"
    ),

    loadDataSet(
      "stamp"
    ),

    loadManualOverrides()

  ]);


  applyRuntimeManualOverrides();


  migrateStampObtainedData();


  renderRegions();

  updateOverall();


  if(
    currentStampEventId
  ){

    updateStampEventSummary();

    renderCollectionGrid();

  }else if(
    currentPrefecture
  ){

    updateCollectionSummary();

    renderCollectionGrid();

  }

}


start();
