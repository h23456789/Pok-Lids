<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Poké Lids 2026 分組座標下載器</title>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:Arial,"Noto Sans TC",sans-serif;
  max-width:1200px;
  margin:24px auto;
  padding:0 16px;
  background:#f5f6f8;
  color:#222;
}

.box{
  background:#fff;
  padding:18px;
  border-radius:12px;
  margin:12px 0;
  box-shadow:0 1px 5px #ddd;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  margin:4px;
  cursor:pointer;
  background:#222;
  color:#fff;
}

button:disabled{
  opacity:.5;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(230px,1fr));
  gap:10px;
}

.card{
  background:#fff;
  padding:12px;
  border-radius:10px;
  box-shadow:0 1px 4px #ddd;
}

.muted{
  color:#666;
  font-size:13px;
}

code,pre{
  background:#111;
  color:#eee;
  border-radius:8px;
}

pre{
  padding:12px;
  overflow:auto;
}

#map{
  width:100%;
  height:650px;
  border-radius:12px;
  overflow:hidden;
  background:#eef1f4;
}

.map-panel{
  display:grid;
  grid-template-columns:minmax(0,1fr) 320px;
  gap:12px;
}

#cityInfo{
  min-height:180px;
}

.prefecture{
  cursor:pointer;
  stroke:#fff;
  stroke-width:1;
  transition:.15s;
}

.prefecture:hover{
  stroke:#222;
  stroke-width:2;
  filter:brightness(.95);
}

.pref-label{
  pointer-events:none;
  font-size:11px;
  font-weight:bold;
  fill:#333;
  text-anchor:middle;
}

.point{
  cursor:pointer;
}

.city-row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  padding:7px 0;
  border-bottom:1px solid #eee;
}

.badge{
  display:inline-block;
  background:#222;
  color:#fff;
  border-radius:999px;
  padding:2px 8px;
  font-size:12px;
}

.new-badge{
  background:#198754;
}

.legend{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
  font-size:12px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:4px;
}

.legend-box{
  width:18px;
  height:12px;
  border-radius:3px;
}

.popup{
  position:absolute;
  background:#fff;
  border:1px solid #ccc;
  border-radius:8px;
  padding:10px;
  box-shadow:0 2px 10px #aaa;
  z-index:20;
  min-width:180px;
  pointer-events:none;
}

@media(max-width:800px){
  .map-panel{
    grid-template-columns:1fr;
  }

  #map{
    height:520px;
  }
}
</style>
</head>

<body>

<h1>Poké Lids 2026 座標分組</h1>

<div class="box">

<p>
<b>資料來源：</b>
yukidaruma/pokefuta-tracker 的 data.json
</p>

<p>
<b>分組方式：</b>
以日本 47 都道府縣為單位統整。
</p>

<p>
<b>TXT 格式：</b>
<code>緯度,經度,地名</code>
</p>

<p id="status">
正在讀取資料……
</p>

<p id="syncInfo" class="muted"></p>

<button id="all" disabled onclick="downloadAll()">
下載全部分組 TXT
</button>

<button id="json" disabled onclick="downloadJSON()">
下載分組 JSON
</button>

<button id="csv" disabled onclick="downloadCSV()">
下載完整 CSV
</button>

</div>


<div class="box">

<h3>🗾 日本都道府縣 Poké Lid 分布</h3>

<p class="muted">
點擊行政區，可查看該都道府縣的 Poké Lid。
</p>

<div class="map-panel">

<div id="map"></div>

<div id="cityInfo"
     class="box"
     style="margin:0">

請點擊地圖上的都道府縣。

</div>

</div>

</div>


<div class="box">

<h3>📜 更新 History</h3>

<p class="muted">
History 由 GitHub Actions 寫入 history.json。
</p>

<div id="history">
載入中……
</div>

</div>


<div id="groups" class="grid"></div>


<div class="box">

<h3>TXT 範例</h3>

<pre id="preview">
載入中……
</pre>

</div>


<script>

/* =========================================================
   基本設定
========================================================= */

const DATA_URL =
  "./data/data.json";

const GEOJSON_URL =
  "./data/prefectures.geojson";


/* =========================================================
   日本 47 都道府縣
========================================================= */

const PREF = {

1:"北海道",
2:"青森県",
3:"岩手県",
4:"宮城県",
5:"秋田県",
6:"山形県",
7:"福島県",
8:"茨城県",
9:"栃木県",
10:"群馬県",
11:"埼玉県",
12:"千葉県",
13:"東京都",
14:"神奈川県",
15:"新潟県",
16:"富山県",
17:"石川県",
18:"福井県",
19:"山梨県",
20:"長野県",
21:"岐阜県",
22:"静岡県",
23:"愛知県",
24:"三重県",
25:"滋賀県",
26:"京都府",
27:"大阪府",
28:"兵庫県",
29:"奈良県",
30:"和歌山県",
31:"鳥取県",
32:"島根県",
33:"岡山県",
34:"広島県",
35:"山口県",
36:"徳島県",
37:"香川県",
38:"愛媛県",
39:"高知県",
40:"福岡県",
41:"佐賀県",
42:"長崎県",
43:"熊本県",
44:"大分県",
45:"宮崎県",
46:"鹿児島県",
47:"沖縄県"

};


/* =========================================================
   全域
========================================================= */

let data = [];

let groups = {};

let geojson = null;

let selectedPrefecture = null;


/* =========================================================
   工具
========================================================= */

function safe(s){

  return String(s ?? "")
    .replace(/[\\/:*?"<>|]/g,"_");

}


function blob(
  s,
  type="text/plain;charset=utf-8"
){

  return new Blob(
    ["\ufeff",s],
    {type}
  );

}


function save(b,n){

  const a =
    document.createElement("a");

  const url =
    URL.createObjectURL(b);

  a.href = url;

  a.download = n;

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );

}


function escapeHtml(s){

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
    );

}


/* =========================================================
   TXT
========================================================= */

function txt(items,groupName){

  return items
    .map(x =>
      `${x.coords[0]},${x.coords[1]},${x.city || groupName}`
    )
    .join("\n");

}


/* =========================================================
   History
========================================================= */

async function loadHistory(){

  try{

    const r =
      await fetch(
        "history.json?ts="+Date.now(),
        {cache:"no-store"}
      );

    if(!r.ok)
      throw Error();

    const h =
      await r.json();

    const el =
      document.getElementById("history");

    const logs =
      h.history || [];

    if(!logs.length){

      el.innerHTML =
        '<span class="muted">尚無更新紀錄。</span>';

      return;

    }

    el.innerHTML =
      logs
      .slice()
      .reverse()
      .slice(0,50)
      .map(item=>{

        const added =
          item.added || [];

        const removed =
          item.removed || [];

        const changed =
          item.changed || [];

        return `

        <div class="card"
             style="margin:8px 0">

          <b>
            ${escapeHtml(item.time || "")}
          </b>

          <br>

          <span class="muted">
            版本：
            ${item.total ?? ""}
            筆
          </span>

          <br>

          🟢 新增 ${added.length}

         　

          🔴 移除 ${removed.length}

         　

          🟡 修改 ${changed.length}

          ${
            (
              added.length ||
              removed.length ||
              changed.length
            )
            ?
            `

            <details>

            <summary>
              查看變更
            </summary>

            ${
              added.length
              ?
              `<b>新增</b><br>
              ${
                added
                .map(x =>
                  `＋ ${escapeHtml(x.prefecture||"")}
                  ｜${escapeHtml(x.title||"")}
                  ｜${x.lat},${x.lng}`
                )
                .join("<br>")
              }<br>`
              :
              ""
            }

            ${
              removed.length
              ?
              `<b>移除</b><br>
              ${
                removed
                .map(x =>
                  `－ ${escapeHtml(x.prefecture||"")}
                  ｜${escapeHtml(x.title||"")}
                  ｜${x.lat},${x.lng}`
                )
                .join("<br>")
              }<br>`
              :
              ""
            }

            ${
              changed.length
              ?
              `<b>修改</b><br>
              ${
                changed
                .map(x =>
                  `↔ ${escapeHtml(x.prefecture||"")}
                  ｜${escapeHtml(x.title||"")}`
                )
                .join("<br>")
              }`
              :
              ""
            }

            </details>
            `
            :
            ""
          }

        </div>

        `;

      })
      .join("");

    document.getElementById(
      "syncInfo"
    ).textContent =
      `GitHub 最新同步：${
        h.last_sync || "未知"
      }｜每 5 分鐘自動檢查一次`;

  }

  catch(e){

    document.getElementById(
      "history"
    ).textContent =
      "尚無 History 資料。";

  }

}


/* =========================================================
   建立分組
========================================================= */

function buildGroups(){

  groups = {};

  for(const x of data){

    const p =
      PREF[x.pref] ||
      x.prefecture ||
      String(x.pref);

    if(!groups[p])
      groups[p] = [];

    groups[p].push(x);

  }

}


/* =========================================================
   顯示群組
========================================================= */

function render(){

  const el =
    document.getElementById("groups");

  el.innerHTML = "";

  for(
    const p
    of Object.keys(groups).sort()
  ){

    const items =
      groups[p];

    const d =
      document.createElement("div");

    d.className = "card";

    d.innerHTML = `

      <b>${escapeHtml(p)}</b>

      <br>

      <span class="muted">
        ${items.length} 個 Poké Lid
      </span>

      <br>

      <button
        onclick='one(${JSON.stringify(p)})'>

        下載此縣／市 TXT

      </button>

    `;

    el.appendChild(d);

  }


  const first =
    Object.entries(groups)[0];

  if(first){

    document.getElementById(
      "preview"
    ).textContent =
      txt(
        first[1],
        first[0]
      );

  }

}


/* =========================================================
   TXT / JSON / CSV
========================================================= */

function one(p){

  save(
    blob(txt(groups[p],p)),
    `${safe(p)}.txt`
  );

}


function downloadAll(){

  let out = [];

  for(
    const p
    of Object.keys(groups).sort()
  ){

    out.push(
      `# ===== ${p} (${groups[p].length}) =====`
    );

    out.push(
      txt(groups[p],p),
      ""
    );

  }

  save(
    blob(out.join("\n")),
    "poke_lid_2026_by_prefecture.txt"
  );

}


function downloadJSON(){

  const out = {};

  for(
    const p
    of Object.keys(groups).sort()
  ){

    out[p] =
      groups[p].map(x=>({

        lat:String(x.coords[0]),

        lng:String(x.coords[1]),

        title:String(
          x.city || p
        )

      }));

  }

  save(
    new Blob(
      [
        JSON.stringify(
          out,
          null,
          0
        )
      ],
      {
        type:
          "application/json;charset=utf-8"
      }
    ),
    "poke_lid_2026_favorite_lists.json"
  );

}


function downloadCSV(){

  const rows = [

    [
      "id",
      "prefecture",
      "city",
      "lat",
      "lng",
      "name",
      "address",
      "pokemons"
    ]

  ];

  for(const x of data){

    rows.push([

      x.id,

      PREF[x.pref] ||
      x.prefecture ||
      x.pref,

      x.city || "",

      x.coords[0],

      x.coords[1],

      x.city || "",

      x.address || "",

      (x.pokemons || [])
        .join("|")

    ]);

  }

  const csv =
    rows
    .map(r =>
      r.map(v =>
        `"${String(v)
          .replaceAll('"','""')}"`
      ).join(",")
    )
    .join("\n");

  save(
    blob(
      csv,
      "text/csv;charset=utf-8"
    ),
    "poke_lid_2026.csv"
  );

}


/* =========================================================
   日本行政區地圖
========================================================= */

function renderMap(){

  const map =
    document.getElementById("map");

  map.innerHTML = "";

  if(!geojson){

    map.innerHTML =
      `<div style="
        padding:30px;
        text-align:center;
        color:#777
      ">
      prefectures.geojson 尚未載入
      </div>`;

    return;

  }


  const svgNS =
    "http://www.w3.org/2000/svg";

  const svg =
    document.createElementNS(
      svgNS,
      "svg"
    );

  svg.setAttribute(
    "width",
    "100%"
  );

  svg.setAttribute(
    "height",
    "100%"
  );

  svg.setAttribute(
    "viewBox",
    "0 0 1000 650"
  );

  svg.style.background =
    "#eef1f4";

  map.appendChild(svg);


  /*
   * 計算所有座標範圍
   */

  let minX = Infinity;
  let maxX = -Infinity;

  let minY = Infinity;
  let maxY = -Infinity;


  function scanCoords(coords){

    if(
      typeof coords[0] === "number"
    ){

      const lng =
        coords[0];

      const lat =
        coords[1];

      minX =
        Math.min(
          minX,
          lng
        );

      maxX =
        Math.max(
          maxX,
          lng
        );

      minY =
        Math.min(
          minY,
          lat
        );

      maxY =
        Math.max(
          maxY,
          lat
        );

      return;

    }

    for(
      const c
      of coords
    ){

      scanCoords(c);

    }

  }


  for(
    const feature
    of geojson.features
  ){

    scanCoords(
      feature.geometry.coordinates
    );

  }


  /*
   * 加一點邊界
   */

  const pad = 3;

  minX -= pad;
  maxX += pad;
  minY -= pad;
  maxY += pad;


  /*
   * 經緯度 → SVG
   */

  function project(
    lng,
    lat
  ){

    const x =
      (
        (lng-minX) /
        (maxX-minX)
      ) * 1000;

    const y =
      650 -
      (
        (lat-minY) /
        (maxY-minY)
      ) * 650;

    return [
      x,
      y
    ];

  }


  /*
   * Polygon path
   */

  function polygonPath(
    coords
  ){

    return coords
      .map(ring=>{

        return ring
          .map(
            (pt,i)=>{

              const [
                x,
                y
              ] =
                project(
                  pt[0],
                  pt[1]
                );

              return (
                i === 0
                ? "M"
                : "L"
              )
              +
              `${x},${y}`;

            }
          )
          .join(" ")
          +
          " Z";

      })
      .join(" ");

  }


  /*
   * 顏色
   */

  function getColor(count){

    if(count === 0)
      return "#e9ecef";

    if(count <= 2)
      return "#dbeafe";

    if(count <= 5)
      return "#93c5fd";

    if(count <= 10)
      return "#60a5fa";

    if(count <= 20)
      return "#3b82f6";

    return "#1d4ed8";

  }


  /*
   * 繪製行政區
   */

  for(
    const feature
    of geojson.features
  ){

    const props =
      feature.properties || {};

    let pref =
      props.name ||
      props.NAME ||
      props.nam_ja ||
      props.N03_001 ||
      props.prefecture;


    /*
     * 嘗試透過編號找名稱
     */

    if(
      props.id &&
      PREF[props.id]
    ){

      pref =
        PREF[props.id];

    }


    /*
     * 有些 GeoJSON 使用中文/英文名稱
     */

    const aliases = {

      "Hokkaido":"北海道",

      "Aomori":"青森県",

      "Iwate":"岩手県",

      "Miyagi":"宮城県",

      "Akita":"秋田県",

      "Yamagata":"山形県",

      "Fukushima":"福島県",

      "Ibaraki":"茨城県",

      "Tochigi":"栃木県",

      "Gunma":"群馬県",

      "Saitama":"埼玉県",

      "Chiba":"千葉県",

      "Tokyo":"東京都",

      "Kanagawa":"神奈川県",

      "Niigata":"新潟県",

      "Toyama":"富山県",

      "Ishikawa":"石川県",

      "Fukui":"福井県",

      "Yamanashi":"山梨県",

      "Nagano":"長野県",

      "Gifu":"岐阜県",

      "Shizuoka":"静岡県",

      "Aichi":"愛知県",

      "Mie":"三重県",

      "Shiga":"滋賀県",

      "Kyoto":"京都府",

      "Osaka":"大阪府",

      "Hyogo":"兵庫県",

      "Nara":"奈良県",

      "Wakayama":"和歌山県",

      "Tottori":"鳥取県",

      "Shimane":"島根県",

      "Okayama":"岡山県",

      "Hiroshima":"広島県",

      "Yamaguchi":"山口県",

      "Tokushima":"徳島県",

      "Kagawa":"香川県",

      "Ehime":"愛媛県",

      "Kochi":"高知県",

      "Fukuoka":"福岡県",

      "Saga":"佐賀県",

      "Nagasaki":"長崎県",

      "Kumamoto":"熊本県",

      "Oita":"大分県",

      "Miyazaki":"宮崎県",

      "Kagoshima":"鹿児島県",

      "Okinawa":"沖縄県"

    };


    pref =
      aliases[pref] ||
      pref;


    const items =
      groups[pref] || [];

    const count =
      items.length;


    const path =
      document.createElementNS(
        svgNS,
        "path"
      );


    let d = "";


    if(
      feature.geometry.type ===
      "Polygon"
    ){

      d =
        polygonPath(
          feature.geometry.coordinates
        );

    }


    if(
      feature.geometry.type ===
      "MultiPolygon"
    ){

      d =
        feature.geometry.coordinates
          .map(
            polygonPath
          )
          .join(" ");

    }


    path.setAttribute(
      "d",
      d
    );

    path.setAttribute(
      "class",
      "prefecture"
    );

    path.setAttribute(
      "fill",
      getColor(count)
    );


    path.addEventListener(
      "click",
      ()=>{
        showPrefecture(pref);
      }
    );


    path.addEventListener(
      "mouseenter",
      e=>{

        showTooltip(
          e,
          pref,
          count
        );

      }
    );


    path.addEventListener(
      "mouseleave",
      hideTooltip
    );


    svg.appendChild(path);


    /*
     * 行政區名稱
     */

    const label =
      document.createElementNS(
        svgNS,
        "text"
      );

    /*
     * 使用行政區幾何中心的簡單估算
     */

    let cx = 0;
    let cy = 0;
    let n = 0;


    function scanCenter(
      coords
    ){

      if(
        typeof coords[0] ===
        "number"
      ){

        const [
          x,
          y
        ] =
          project(
            coords[0],
            coords[1]
          );

        cx += x;
        cy += y;
        n++;

        return;

      }

      for(
        const c
        of coords
      ){

        scanCenter(c);

      }

    }


    scanCenter(
      feature.geometry.coordinates
    );


    if(n){

      cx /= n;
      cy /= n;

    }


    label.setAttribute(
      "x",
      cx
    );

    label.setAttribute(
      "y",
      cy
    );

    label.setAttribute(
      "class",
      "pref-label"
    );

    label.textContent =
      pref;

    svg.appendChild(label);

  }


  /*
   * 圖例
   */

  const legend =
    document.createElement("div");

  legend.className =
    "legend";

  legend.innerHTML = `

    <div class="legend-item">
      <span
        class="legend-box"
        style="background:#e9ecef">
      </span>
      0
    </div>

    <div class="legend-item">
      <span
        class="legend-box"
        style="background:#dbeafe">
      </span>
      1–2
    </div>

    <div class="legend-item">
      <span
        class="legend-box"
        style="background:#93c5fd">
      </span>
      3–5
    </div>

/* =========================================================
   Tooltip
========================================================= */

let tooltip = null;


function showTooltip(
  event,
  pref,
  count
){

  hideTooltip();

  tooltip =
    document.createElement("div");

  tooltip.className =
    "popup";

  tooltip.innerHTML = `

    <b>
      ${escapeHtml(pref)}
    </b>

    <br>

    ${count}
    個 Poké Lid

  `;

  document.body.appendChild(
    tooltip
  );

  tooltip.style.left =
    (event.clientX + 12)
    + "px";

  tooltip.style.top =
    (event.clientY + 12)
    + "px";

}


function hideTooltip(){

  if(tooltip){

    tooltip.remove();

    tooltip = null;

  }

}


/* =========================================================
   點擊行政區
========================================================= */

function showPrefecture(p){

  selectedPrefecture =
    p;

  const items =
    groups[p] || [];


  document.getElementById(
    "cityInfo"
  ).innerHTML = `

    <h3 style="margin-top:0">

      ${escapeHtml(p)}

    </h3>

    <p>

      <b>
        ${items.length}
      </b>
      個 Poké Lid

    </p>

    <button
      onclick='one(${JSON.stringify(p)})'>

      下載 ${escapeHtml(p)} TXT

    </button>

    <button
      onclick='downloadPrefJSON(${JSON.stringify(p)})'>

      下載 ${escapeHtml(p)} JSON

    </button>

    <hr>

    ${
      items.length
      ?
      items
      .map((x,i)=>`

        <div class="city-row">

          <span>

            ${i+1}.
            ${escapeHtml(
              x.city || p
            )}

          </span>

          <span class="badge">

            ${x.coords[0]},
            ${x.coords[1]}

          </span>

        </div>

      `)
      .join("")
      :
      `<span class="muted">
        此都道府縣目前沒有資料。
      </span>`
    }

  `;

}


function downloadPrefJSON(p){

  const out = {};

  out[p] =
    (groups[p] || [])
    .map(x=>({

      lat:String(
        x.coords[0]
      ),

      lng:String(
        x.coords[1]
      ),

      title:String(
        x.city || p
      )

    }));


  save(

    new Blob(
      [
        JSON.stringify(
          out,
          null,
          0
        )
      ],
      {
        type:
          "application/json;charset=utf-8"
      }
    ),

    `${safe(p)}.json`

  );

}


/* =========================================================
   啟動
========================================================= */

async function loadData(){

  try{

    const [
      dataResponse,
      geoResponse
    ] =
      await Promise.all([

        fetch(
          DATA_URL+
          "?ts="+Date.now(),
          {
            cache:"no-store"
          }
        ),

        fetch(
          GEOJSON_URL+
          "?ts="+Date.now(),
          {
            cache:"no-store"
          }
        )

      ]);


    if(!dataResponse.ok){

      throw Error(
        "data/data.json 無法取得"
      );

    }


    if(!geoResponse.ok){

      throw Error(
        "data/prefectures.geojson 無法取得"
      );

    }


    const json =
      await dataResponse.json();

    geojson =
      await geoResponse.json();


    data =
      json.list || [];


    buildGroups();


    document.getElementById(
      "status"
    ).textContent =
      `已載入 ${data.length} 筆，共 ${
        Object.keys(groups).length
      } 個都道府縣群組。`;


    [
      "all",
      "json",
      "csv"
    ]
    .forEach(
      id =>
        document.getElementById(
          id
        ).disabled = false
    );


    render();

    renderMap();

    loadHistory();

  }

  catch(e){

    console.error(e);

    document.getElementById(
      "status"
    ).textContent =
      "載入失敗："+e.message;

  }

}


/* =========================================================
   開始
========================================================= */

loadData();

</script>
