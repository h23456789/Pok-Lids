<!doctype html>
<html lang="zh-Hant">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Pokémon Japan Collection｜日本寶可夢收集圖鑑</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;
  padding:0;

  background:#e9f7fb;

  color:#315f66;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;

}

body{
  min-height:100vh;
}

body.no-scroll{
  overflow:hidden;
}

button{
  font:inherit;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}


/* =========================================================
   HEADER
========================================================= */

.header{

  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  border-radius:24px;

  padding:
    28px
    24px
    22px;

  text-align:center;

  margin-bottom:18px;

  position:relative;

  overflow:hidden;

}

.header:before,
.header:after{

  content:"";

  position:absolute;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .45
    );

}

.header:before{

  width:140px;
  height:140px;

  top:-70px;
  left:-40px;

}

.header:after{

  width:180px;
  height:180px;

  right:-70px;
  bottom:-90px;

}

.logo-title{

  position:relative;

  z-index:1;

}

.logo-title h1{

  margin:0;

  color:#397b83;

  font-size:30px;

  font-weight:900;

  letter-spacing:2px;

}

.logo-title p{

  margin:
    8px
    0
    0;

  color:#58919a;

  font-size:14px;

}


/* =========================================================
   MAIN TABS
========================================================= */

.main-tabs{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:14px;

  margin-bottom:20px;

}

.main-tab{

  border:0;

  border-radius:20px;

  padding:
    16px
    18px;

  background:#fff;

  color:#397b83;

  cursor:pointer;

  box-shadow:
    0
    4px
    16px
    rgba(70,130,140,.12);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;

}

.main-tab:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0
    8px
    22px
    rgba(70,130,140,.17);

}

.main-tab.active{

  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  box-shadow:
    0
    8px
    24px
    rgba(70,130,140,.20);

}

.main-tab-icon{

  font-size:28px;

}

.main-tab-title{

  margin-top:4px;

  font-size:21px;

  font-weight:900;

}

.main-tab-sub{

  margin-top:3px;

  color:#7a989d;

  font-size:12px;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-bar{

  background:#8fd58d;

  color:#fff;

  border-radius:999px;

  padding:
    11px
    20px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:18px;

  font-size:23px;

  font-weight:900;

  box-shadow:
    0
    4px
    12px
    rgba(76,150,90,.15);

  margin-bottom:20px;

}

.progress-bar .ball{

  font-size:24px;

}


/* =========================================================
   SECTION
========================================================= */

.section-title{

  text-align:center;

  color:#397b83;

  font-size:22px;

  font-weight:900;

  margin:
    22px
    0
    14px;

}


/* =========================================================
   REGION CARDS
========================================================= */

.region-grid{

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:18px;

}

.region-card{

  background:#fff;

  border-radius:20px;

  overflow:hidden;

  box-shadow:
    0
    4px
    16px
    rgba(70,130,140,.12);

  cursor:pointer;

  transition:
    transform .18s ease,
    box-shadow .18s ease;

}

.region-card:hover{

  transform:
    translateY(-3px);

  box-shadow:
    0
    8px
    24px
    rgba(70,130,140,.18);

}

.region-images{

  height:185px;

  background:#9de0cc;

  position:relative;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:8px;

  padding:
    18px
    12px;

  overflow:hidden;

}

.region-images:before{

  content:"";

  position:absolute;

  inset:0;

  opacity:.16;

  background-image:

    radial-gradient(
      circle at 20px 20px,
      #fff 0 10px,
      transparent 11px
    ),

    radial-gradient(
      circle at 65px 65px,
      #fff 0 10px,
      transparent 11px
    );

  background-size:
    90px
    90px;

}

.region-image{

  width:31%;

  max-width:135px;

  aspect-ratio:1;

  object-fit:contain;

  position:relative;

  z-index:1;

  filter:
    drop-shadow(
      0
      3px
      4px
      rgba(0,0,0,.20)
    );

}

.region-empty{

  color:#fff;

  font-weight:700;

  position:relative;

  z-index:1;

}

.region-info{

  background:#fff;

  padding:
    17px
    12px
    18px;

  text-align:center;

}

.region-name{

  font-size:22px;

  font-weight:900;

  color:#4c7f86;

  margin-bottom:6px;

}

.region-count{

  color:#27bea9;

  font-size:27px;

  font-weight:900;

}

.region-percent{

  margin-top:3px;

  color:#83a3a7;

  font-size:13px;

}


/* =========================================================
   MAP
========================================================= */

.map-box{

  background:#fff;

  border-radius:20px;

  padding:12px;

  box-shadow:
    0
    4px
    16px
    rgba(70,130,140,.12);

  margin-top:22px;

}

.map-title{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:
    5px
    8px
    12px;

}

.map-title h2{

  margin:0;

  font-size:21px;

  color:#397b83;

}

.map-title span{

  font-size:12px;

  color:#829a9e;

}

#map{

  height:680px;

  width:100%;

  border-radius:15px;

  overflow:hidden;

}


/* =========================================================
   MAP MARKER
========================================================= */

.poke-marker{

  width:18px;

  height:18px;

  border-radius:50%;

  border:3px solid #fff;

  box-shadow:
    0
    2px
    7px
    rgba(0,0,0,.4),

    0
    0
    0
    1px
    rgba(0,0,0,.15);

}

.poke-marker.not-obtained{

  background:#ef4b55;

}

.poke-marker.obtained{

  background:#27c978;

}


/* =========================================================
   POINT STATUS
========================================================= */

.point-status{

  margin-top:10px;

  padding:
    12px
    15px;

  background:#f2fbfa;

  border-radius:12px;

  color:#397b83;

  font-size:14px;

  display:none;

}

.point-status.show{

  display:block;

}

.muted{

  color:#81999d;

}


/* =========================================================
   FIRST LAYER
   REGION → PREFECTURE
========================================================= */

.prefecture-panel{

  position:fixed;

  inset:0;

  z-index:10000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:14px;

  background:
    rgba(
      20,
      55,
      60,
      .52
    );

}

.prefecture-panel.show{

  display:flex;

}

.prefecture-window{

  width:
    min(
      850px,
      100%
    );

  max-height:
    calc(
      100vh - 28px
    );

  background:#f7fcfc;

  border-radius:26px;

  overflow:hidden;

  box-shadow:
    0
    20px
    80px
    rgba(0,0,0,.35);

  display:flex;

  flex-direction:column;

}

.prefecture-header{

  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  padding:
    20px
    22px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

}

.prefecture-header-title{

  min-width:0;

}

.prefecture-title{

  color:#397b83;

  font-size:25px;

  font-weight:900;

}

.prefecture-summary{

  margin-top:5px;

  color:#58919a;

  font-size:14px;

}

.panel-close{

  width:42px;

  height:42px;

  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  font-size:27px;

  cursor:pointer;

  flex-shrink:0;

}

.prefecture-grid{

  padding:20px;

  overflow:auto;

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:14px;

}

.prefecture-card{

  background:#fff;

  border-radius:18px;

  padding:15px;

  cursor:pointer;

  box-shadow:
    0
    3px
    12px
    rgba(70,130,140,.10);

  transition:
    transform .15s ease,
    box-shadow .15s ease;

}

.prefecture-card:hover{

  transform:
    translateY(-3px);

  box-shadow:
    0
    7px
    20px
    rgba(70,130,140,.17);

}

.prefecture-card-top{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin-bottom:10px;

}

.prefecture-name{

  font-size:20px;

  font-weight:900;

  color:#397b83;

}

.prefecture-count{

  font-size:14px;

  font-weight:900;

  color:#27bea9;

}

.prefecture-progress{

  height:10px;

  background:#edf3f3;

  border-radius:999px;

  overflow:hidden;

}

.prefecture-progress-bar{

  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #76d8bd,
      #27c978
    );

}

.prefecture-percent{

  margin-top:7px;

  font-size:12px;

  color:#829a9e;

}


/* =========================================================
   SECOND LAYER
========================================================= */

.collection-panel{

  position:fixed;

  inset:0;

  z-index:10500;

  display:none;

  align-items:center;

  justify-content:center;

  padding:14px;

  background:
    rgba(
      20,
      55,
      60,
      .52
    );

}

.collection-panel.show{

  display:flex;

}

.collection-window{

  width:
    min(
      1100px,
      100%
    );

  max-height:
    calc(
      100vh - 28px
    );

  background:#f7fcfc;

  border-radius:26px;

  overflow:hidden;

  box-shadow:
    0
    20px
    80px
    rgba(0,0,0,.35);

  display:flex;

  flex-direction:column;

}

.collection-header{

  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  padding:
    20px
    22px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

}

.collection-header-left{

  min-width:0;

}

.collection-title{

  color:#397b83;

  font-size:25px;

  font-weight:900;

}

.collection-summary{

  margin-top:5px;

  color:#58919a;

  font-size:14px;

}

.collection-header-actions{

  display:flex;

  align-items:center;

  gap:8px;

}

.back-btn{

  border:0;

  border-radius:999px;

  padding:
    9px
    14px;

  background:#fff;

  color:#397b83;

  font-weight:900;

  cursor:pointer;

}

.collection-close{

  width:42px;

  height:42px;

  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  font-size:27px;

  cursor:pointer;

}

.collection-toolbar{

  background:#fff;

  padding:
    12px
    20px;

  border-bottom:
    1px solid
    #e7eeee;

}

.collection-legend{

  display:flex;

  gap:16px;

  font-size:13px;

  color:#637f83;

}

.legend-item{

  display:flex;

  align-items:center;

  gap:6px;

}

.legend-dot{

  width:12px;

  height:12px;

  border-radius:50%;

}

.legend-dot.green{

  background:#27c978;

  box-shadow:
    0
    0
    9px
    rgba(39,201,120,.9);

}

.legend-dot.red{

  background:#ef4b55;

  box-shadow:
    0
    0
    9px
    rgba(239,75,85,.9);

}

.collection-grid{

  padding:20px;

  overflow:auto;

  display:grid;

  grid-template-columns:
    repeat(
      5,
      minmax(0,1fr)
    );

  gap:20px;

}


/* =========================================================
   COLLECTION ITEM
========================================================= */

.collection-item{

  background:#fff;

  border-radius:18px;

  padding:10px;

  cursor:pointer;

  text-align:center;

  transition:
    transform .18s ease,
    box-shadow .18s ease;

}

.collection-item:hover{

  transform:
    translateY(-4px);

}


/* Green glow */

.collection-item.obtained{

  box-shadow:

    0
    0
    0
    2px
    rgba(
      39,
      201,
      120,
      .50
    ),

    0
    0
    24px
    rgba(
      39,
      201,
      120,
      .85
    ),

    0
    8px
    20px
    rgba(
      39,
      201,
      120,
      .15
    );

}


/* Red glow */

.collection-item.not-obtained{

  box-shadow:

    0
    0
    0
    2px
    rgba(
      239,
      75,
      85,
      .45
    ),

    0
    0
    24px
    rgba(
      239,
      75,
      85,
      .75
    ),

    0
    8px
    20px
    rgba(
      239,
      75,
      85,
      .12
    );

}


.collection-image-wrap{

  width:100%;

  aspect-ratio:1;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:14px;

  background:#9de0cc;

  overflow:hidden;

}

.collection-image{

  width:100%;

  height:100%;

  object-fit:contain;

  transition:
    transform .18s ease;

  filter:
    drop-shadow(
      0
      3px
      5px
      rgba(0,0,0,.22)
    );

}

.collection-item:hover
.collection-image{

  transform:
    scale(1.05);

}

.collection-city{

  margin-top:9px;

  color:#397b83;

  font-size:14px;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}

.collection-status{

  margin-top:3px;

  font-size:11px;

  font-weight:800;

}

.collection-item.obtained
.collection-status{

  color:#27bd7a;

}

.collection-item.not-obtained
.collection-status{

  color:#ef4b55;

}


/* =========================================================
   THIRD LAYER
========================================================= */

.modal-overlay{

  position:fixed;

  inset:0;

  z-index:11000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:18px;

  background:
    rgba(
      20,
      55,
      60,
      .55
    );

}

.modal-overlay.show{

  display:flex;

}

.poke-modal{

  width:
    min(
      430px,
      calc(100vw - 28px)
    );

  max-height:
    calc(
      100vh - 35px
    );

  overflow:auto;

  background:#fff;

  border-radius:24px;

  box-shadow:
    0
    20px
    70px
    rgba(0,0,0,.35);

  position:relative;

  animation:
    modalIn
    .18s ease;

}

@keyframes modalIn{

  from{

    opacity:0;

    transform:
      translateY(12px)
      scale(.97);

  }

  to{

    opacity:1;

    transform:none;

  }

}

.modal-close{

  position:absolute;

  top:12px;

  right:12px;

  z-index:5;

  width:38px;

  height:38px;

  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  font-size:25px;

  line-height:38px;

  cursor:pointer;

  box-shadow:
    0
    2px
    10px
    rgba(0,0,0,.15);

}

.modal-image-wrap{

  background:#9de0cc;

  padding:18px;

  text-align:center;

}

.modal-image{

  width:
    min(
      300px,
      80vw
    );

  aspect-ratio:1;

  object-fit:contain;

  display:block;

  margin:auto;

  filter:
    drop-shadow(
      0
      5px
      8px
      rgba(0,0,0,.2)
    );

}

.modal-content{

  padding:20px;

}

.modal-type{

  font-size:12px;

  color:#6d959b;

  margin-bottom:2px;

}

.modal-pref{

  font-size:13px;

  color:#7b999d;

}

.modal-city{

  font-size:25px;

  font-weight:900;

  color:#397b83;

  margin:
    3px
    0
    10px;

}

.modal-address{

  color:#637f83;

  font-size:14px;

  line-height:1.6;

  margin-bottom:12px;

}

.coordinate{

  display:inline-block;

  padding:
    9px
    12px;

  background:#f0f8f7;

  color:#277e77;

  border-radius:10px;

  font-family:monospace;

  font-size:14px;

  cursor:pointer;

  user-select:none;

}

.copy-hint{

  display:inline-block;

  margin-left:8px;

  color:#27bd7a;

  font-size:13px;

  font-weight:800;

  opacity:0;

  transition:.2s;

}

.copy-hint.show{

  opacity:1;

}


/* =========================================================
   NAVIGATION
========================================================= */

.map-navigation{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;

  margin-top:16px;

}

.navigation-btn{

  border:0;

  border-radius:13px;

  padding:
    12px
    10px;

  cursor:pointer;

  font-weight:900;

  transition:
    transform .15s ease;

}

.navigation-btn:hover{

  transform:
    translateY(-2px);

}

.apple-map-btn{

  background:#111;

  color:#fff;

}

.google-map-btn{

  background:#4285f4;

  color:#fff;

}


/* =========================================================
   OBTAIN
========================================================= */

.obtain-row{

  margin-top:18px;

  border-top:
    1px solid
    #edf1f1;

  padding-top:16px;

}

.obtain-label{

  display:flex;

  align-items:center;

  gap:12px;

  cursor:pointer;

  font-size:18px;

  font-weight:900;

  color:#397b83;

}

.obtain-label input{

  appearance:none;

  width:28px;

  height:28px;

  border:
    3px solid
    #b8cdcf;

  border-radius:8px;

  position:relative;

  cursor:pointer;

  background:#fff;

}

.obtain-label input:checked{

  background:#27c978;

  border-color:#27c978;

}

.obtain-label input:checked:after{

  content:"✓";

  position:absolute;

  color:#fff;

  font-size:20px;

  font-weight:900;

  left:3px;

  top:-1px;

}

.save-status{

  margin-top:8px;

  color:#27bd7a;

  font-size:13px;

  min-height:18px;

}


/* =========================================================
   HISTORY
========================================================= */

.history-box{

  background:#fff;

  border-radius:20px;

  padding:18px;

  box-shadow:
    0
    4px
    16px
    rgba(70,130,140,.12);

  margin-top:22px;

}

.history-box h2{

  margin-top:0;

  color:#397b83;

}

.history-filter{

  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-bottom:12px;

}

.history-filter button{

  border:0;

  border-radius:999px;

  padding:
    7px
    12px;

  background:#edf5f5;

  color:#397b83;

  font-size:12px;

  font-weight:800;

  cursor:pointer;

}

.history-filter button.active{

  background:#397b83;

  color:#fff;

}

.history-card{

  border-bottom:
    1px solid
    #eee;

  padding:
    12px
    0;

  font-size:14px;

}

.history-card:last-child{

  border-bottom:0;

}

.history-type{

  display:inline-block;

  border-radius:999px;

  padding:
    3px
    8px;

  margin-left:5px;

  font-size:10px;

  font-weight:900;

}

.history-type.lid{

  background:#ffe8e8;

  color:#df4a52;

}

.history-type.center{

  background:#fff3ce;

  color:#b68100;

}


/* =========================================================
   DOWNLOAD
========================================================= */

.download-box{

  margin-top:22px;

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:8px;

}

.download-btn{

<script>

/* =========================================================
   DATA FILES
========================================================= */

const DATA_URLS = {

  lid:
    "data/data.json",

  center:
    "data/pokemon_center.json"

};

const GEOJSON_URL =
  "prefectures.geojson";

const HISTORY_URLS = {

  lid:
    "history.json",

  center:
    "center_history.json"

};


/* =========================================================
   PREFECTURE
========================================================= */

const PREF = {

  1:"北海道",
  2:"青森県",
  3:"岩手県",
  4:"宮城県",
  5:"秋田県",
  6:"山形県",
  7:"福島県",

  8:"茨城県",
  9:"栃木県",
  10:"群馬県",
  11:"埼玉県",
  12:"千葉県",
  13:"東京都",
  14:"神奈川県",

  15:"新潟県",
  16:"富山県",
  17:"石川県",
  18:"福井県",
  19:"山梨県",
  20:"長野県",
  21:"岐阜県",
  22:"静岡県",
  23:"愛知県",

  24:"三重県",
  25:"滋賀県",
  26:"京都府",
  27:"大阪府",
  28:"兵庫県",
  29:"奈良県",
  30:"和歌山県",

  31:"鳥取県",
  32:"島根県",
  33:"岡山県",
  34:"広島県",
  35:"山口県",

  36:"徳島県",
  37:"香川県",
  38:"愛媛県",
  39:"高知県",

  40:"福岡県",
  41:"佐賀県",
  42:"長崎県",
  43:"熊本県",
  44:"大分県",
  45:"宮崎県",
  46:"鹿児島県",
  47:"沖縄県"

};


/* =========================================================
   REGIONS
========================================================= */

const REGIONS = {

  "北海道・東北":{
    prefs:[
      1,2,3,4,5,6,7
    ]
  },

  "關東":{
    prefs:[
      8,9,10,11,12,13,14
    ]
  },

  "中部":{
    prefs:[
      15,16,17,18,19,
      20,21,22,23
    ]
  },

  "近畿":{
    prefs:[
      24,25,26,27,28,29,30
    ]
  },

  "中國・四國":{
    prefs:[
      31,32,33,34,35,
      36,37,38,39
    ]
  },

  "九州・沖繩":{
    prefs:[
      40,41,42,43,44,45,46,47
    ]
  }

};


/* =========================================================
   STATE
========================================================= */

let collectionType =
  "lid";

let dataSets = {

  lid:[],

  center:[]

};

let groups = {

  lid:{},

  center:{}

};

let obtainedIds = {

  lid:new Set(),

  center:new Set()

};

let currentRegion =
  null;

let currentPrefecture =
  null;

let currentCollectionItems =
  [];

let currentItem =
  null;

let currentItemType =
  "lid";

let currentHistoryFilter =
  "all";

let historyEntries =
  [];


/* =========================================================
   LOCAL STORAGE
========================================================= */

const STORAGE_KEYS = {

  lid:
    "pokemonJapanCollection_lid",

  center:
    "pokemonJapanCollection_center"

};


function getItemId(
  item
){

  return String(
    item.id
  );

}


function loadLocalCollection(
  type
){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEYS[type]
      );


    if(!raw){

      obtainedIds[type] =
        new Set();

      return;

    }


    const values =
      JSON.parse(
        raw
      );


    if(
      !Array.isArray(values)
    ){

      obtainedIds[type] =
        new Set();

      return;

    }


    obtainedIds[type] =
      new Set(

        values
          .map(String)
          .filter(Boolean)

      );

  }catch(error){

    console.error(
      "LocalStorage 讀取失敗:",
      error
    );

    obtainedIds[type] =
      new Set();

  }

}


function saveLocalCollection(
  type
){

  try{

    localStorage.setItem(

      STORAGE_KEYS[type],

      JSON.stringify(
        [...obtainedIds[type]]
      )

    );

  }catch(error){

    console.error(
      "LocalStorage 儲存失敗:",
      error
    );

  }

}


/* =========================================================
   IMAGE
========================================================= */

function getItemImageUrl(
  type,
  item
){

  if(
    type === "lid"
  ){

    return (

      "https://pokefuta.yuki.games/images/pokefuta/" +

      encodeURIComponent(
        item.id
      ) +

      ".png"

    );

  }


  if(item.image){

    return item.image;

  }


  return "";

}


function getItemTitle(
  type,
  item
){

  if(
    type === "center"
  ){

    return (

      item.name ||

      item.title ||

      "Pokémon Center"

    );

  }


  return (

    item.city ||

    item.title ||

    "Poké Lid"

  );

}


/* =========================================================
   LOAD JSON
========================================================= */

async function loadJSON(
  url
){

  const response =
    await fetch(

      url +
      "?ts=" +
      Date.now(),

      {
        cache:"no-store"
      }

    );


  if(!response.ok){

    throw new Error(
      `${url} 無法取得。HTTP ${response.status}`
    );

  }


  return await response.json();

}


/* =========================================================
   LOAD DATA SET
========================================================= */

async function loadDataSet(
  type
){

  try{

    const json =
      await loadJSON(
        DATA_URLS[type]
      );


    if(
      !json ||
      !Array.isArray(
        json.list
      )
    ){

      throw new Error(
        `${DATA_URLS[type]} 格式錯誤`
      );

    }


    dataSets[type] =
      json.list;


  }catch(error){

    console.error(
      `${type} 資料載入失敗:`,
      error
    );


    dataSets[type] =
      [];

  }


  buildGroups(
    type
  );

}


/* =========================================================
   BUILD GROUPS
========================================================= */

function buildGroups(
  type
){

  groups[type] =
    {};


  for(
    const item
    of dataSets[type]
  ){

    const pref =
      PREF[item.pref] ||
      String(item.pref);


    if(!groups[type][pref]){

      groups[type][pref] =
        [];

    }


    groups[type][pref].push(
      item
    );

  }

}


/* =========================================================
   SWITCH COLLECTION
========================================================= */

function switchCollectionType(
  type
){

  if(
    type !== "lid" &&
    type !== "center"
  ){

    return;

  }


  collectionType =
    type;


  document
    .getElementById(
      "tabLid"
    )
    .classList
    .toggle(
      "active",
      type === "lid"
    );


  document
    .getElementById(
      "tabCenter"
    )
    .classList
    .toggle(
      "active",
      type === "center"
    );


  if(type === "lid"){

    document.getElementById(
      "sectionTitle"
    ).textContent =
      "🔴 Poké Lid 蒐集進度";


    document.getElementById(
      "progressLabel"
    ).textContent =
      "Poké Lid 已收集：";


    document.getElementById(
      "mapTitle"
    ).textContent =
      "🗾 Poké Lid 地圖";

  }else{

    document.getElementById(
      "sectionTitle"
    ).textContent =
      "🟡 Pokémon Center 蒐集進度";


    document.getElementById(
      "progressLabel"
    ).textContent =
      "Pokémon Center 已收集：";


    document.getElementById(
      "mapTitle"
    ).textContent =
      "🏬 Pokémon Center 地圖";

  }


  currentRegion =
    null;

  currentPrefecture =
    null;

  currentCollectionItems =
    [];

  currentItem =
    null;


  closeAllPanels();


  renderRegions();

  updateOverall();


  clearPointLayer();

  resetSelectedLayer();

  refreshMapPrefectureStyles();

}


/* =========================================================
   CLOSE PANELS
========================================================= */

function closeAllPanels(){

  document
    .getElementById(
      "prefecturePanel"
    )
    .classList
    .remove(
      "show"
    );


  document
    .getElementById(
      "collectionPanel"
    )
    .classList
    .remove(
      "show"
    );


  document
    .getElementById(
      "modalOverlay"
    )
    .classList
    .remove(
      "show"
    );


  document.body.classList.remove(
    "no-scroll"
  );

}


/* =========================================================
   PROGRESS
========================================================= */

function updateOverall(){

  const list =
    dataSets[
      collectionType
    ] ||
    [];


  const total =
    list.length;


  const obtained =
    list.filter(

      item =>
        obtainedIds[
          collectionType
        ].has(
          getItemId(item)
        )

    ).length;


  document.getElementById(
    "totalObtained"
  ).textContent =
    obtained;


  document.getElementById(
    "totalCount"
  ).textContent =
    total;

}


/* =========================================================
   REGION CARDS
========================================================= */

function renderRegions(){

  const el =
    document.getElementById(
      "regions"
    );


  if(!el){

    return;

  }


  const list =
    dataSets[
      collectionType
    ] ||
    [];


  if(!list.length){

    el.innerHTML = `

      <div
        class="loading"
        style="grid-column:1/-1"
      >

        ${
          collectionType === "lid"

          ?

          "目前沒有 Poké Lid 資料。"

          :

          "目前沒有 Pokémon Center 資料。"
        }

      </div>

    `;

    return;

  }


  el.innerHTML =
    "";


  for(
    const [
      regionName,
      region
    ]
    of Object.entries(
      REGIONS
    )
  ){

    const items =
      list.filter(

        item =>
          region.prefs.includes(
            Number(item.pref)
          )

      );


    const obtained =
      items.filter(

        item =>
          obtainedIds[
            collectionType
          ].has(
            getItemId(item)
          )

      ).length;


    const total =
      items.length;


    const percent =
      total

      ?

      Math.round(
        obtained /
        total *
        1000
      ) / 10

      :

      0;


    const sample =
      items.slice(
        0,
        3
      );


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "region-card";


    card.onclick =
      () =>
        openRegion(
          regionName
        );


    const imageHtml =
      sample.length

      ?

      sample
        .map(

          item => `

            <img
              class="region-image"
              src="${escapeHtml(
                getItemImageUrl(
                  collectionType,
                  item
                )
              )}"
              alt="${escapeHtml(
                getItemTitle(
                  collectionType,
                  item
                )
              )}"
              loading="lazy"
              onerror="
                this.style.visibility='hidden'
              "
            >

          `

        )
        .join("")

      :

/* =========================================================
   COPY
========================================================= */

async function copyCoordinate(
  event
){

  if(event){

    event.stopPropagation();

  }


  const text =
    document.getElementById(
      "modalCoordinate"
    )
    .textContent
    .trim();


  if(
    !text ||
    text ===
      "無座標資料"
  ){

    return;

  }


  try{

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard.writeText(
        text
      );

    }else{

      throw new Error();

    }

  }catch{

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    textarea.style.position =
      "fixed";


    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.focus();


    textarea.select();


    try{

      document.execCommand(
        "copy"
      );

    }catch(error){

      console.error(
        error
      );

    }


    textarea.remove();

  }


  const hint =
    document.getElementById(
      "copyHint"
    );


  hint.classList.add(
    "show"
  );


  setTimeout(

    () =>
      hint.classList.remove(
        "show"
      ),

    1500

  );

}

/* =========================================================
   MAP
========================================================= */

let map =
  null;

let prefectureLayer =
  null;

let pointLayer =
  null;

let selectedLayer =
  null;


const JAPAN_CENTER =
  [36.2,138.3];


const JAPAN_ZOOM =
  6;


/* =========================================================
   INIT MAP
========================================================= */

async function setupMap(){

  if(map){

    return;

  }


  map =
    L.map(
      "map",
      {

        zoomControl:true,

        minZoom:4,

        maxZoom:18,

        tap:true

      }

    )
    .setView(
      JAPAN_CENTER,
      JAPAN_ZOOM
    );


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      maxZoom:19,

      attribution:
        "&copy; OpenStreetMap contributors"

    }

  ).addTo(
    map
  );


  pointLayer =
    L.layerGroup()
      .addTo(
        map
      );


  try{

    const geojson =
      await loadJSON(
        GEOJSON_URL
      );


    prefectureLayer =
      L.geoJSON(

        geojson,

        {

          style:
            prefectureStyle,

          onEachFeature:
            onEachPrefecture

        }

      )
      .addTo(
        map
      );


    map.on(
      "click",
      () => {

        if(currentPrefecture){

          clearPointLayer();

          currentPrefecture =
            null;


          resetSelectedLayer();


          map.setView(
            JAPAN_CENTER,
            JAPAN_ZOOM
          );

        }

      }
    );


  }catch(error){

    console.error(
      "GeoJSON 載入失敗:",
      error
    );


    document.getElementById(
      "map"
    ).innerHTML = `

      <div
        class="error-box"
        style="margin:20px"
      >

        <b>
          ⚠️ 行政區地圖載入失敗
        </b>

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================================
   PREFECTURE NAME
========================================================= */

function getFeaturePrefecture(
  feature
){

  const p =
    feature?.properties ||
    {};


  const candidates = [

    p.pref,
    p.PREF,
    p.code,
    p.CODE,
    p.pref_code,
    p.prefCode,
    p.name_ja,
    p.name_local,
    p.nam_ja,
    p.N03_001,
    p.N03_003,
    p.name

  ];


  for(
    const value
    of candidates
  ){

    if(
      value == null
    ){

      continue;

    }


    const text =
      String(value);


    const digits =
      text.replace(
        /\D/g,
        ""
      );


    const number =
      parseInt(
        digits,
        10
      );


    if(
      number >= 1 &&
      number <= 47
    ){

      return PREF[number];

    }


    const found =
      Object.values(
        PREF
      ).find(

        name =>
          text.includes(name)

      );


    if(found){

      return found;

    }

  }


  return null;

}


/* =========================================================
   MAP COLORS
========================================================= */

function getColorByCount(
  count
){

  if(count >= 70)
    return "#38a169";

  if(count >= 50)
    return "#58b87b";

  if(count >= 30)
    return "#79c58c";

  if(count >= 20)
    return "#9bd49d";

  if(count >= 10)
    return "#b9dfae";

  if(count >= 5)
    return "#d5e9c4";

  return "#e6f1d9";

}


function prefectureStyle(
  feature
){

  const pref =
    getFeaturePrefecture(
      feature
    );


  const items =
    groups[
      collectionType
    ][pref] ||
    [];


  return {

    fillColor:
      getColorByCount(
        items.length
      ),

    weight:1.5,

    opacity:1,

    color:"#fff",

    fillOpacity:.85

  };

}


function refreshMapPrefectureStyles(){

  if(!prefectureLayer){

    return;

  }


  prefectureLayer.eachLayer(
    layer => {

      prefectureLayer.resetStyle(
        layer
      );

    }
  );

}


/* =========================================================
   MAP EVENTS
========================================================= */

function onEachPrefecture(
  feature,
  layer
){

  const pref =
    getFeaturePrefecture(
      feature
    );


  const items =
    groups[
      collectionType
    ][pref] ||
    [];


  layer.bindTooltip(

    `

      <b>
        ${escapeHtml(
          pref ||
          "行政區"
        )}
      </b>

      <br>

      ${
        collectionType === "lid"
        ?
        "Poké Lid"
        :
        "Pokémon Center"
      }

      ：

      <strong>
        ${items.length}
      </strong>

      個

    `,

    {

      sticky:true,

      className:
        "pref-tooltip",

      direction:
        "top"

    }

  );


  layer.on({

    mouseover:function(){

      this.setStyle({

        weight:3,

        color:"#397b83",

        fillOpacity:.95

      });

    },


    mouseout:function(){

      if(
        this !==
        selectedLayer
      ){

        prefectureLayer.resetStyle(
          this
        );

      }

    },


    click:function(e){

      L.DomEvent.stopPropagation(
        e
      );


      showPrefectureOnMap(
        pref,
        layer
      );

    }

  });

}


function showPrefectureOnMap(
  pref,
  layer
){

  if(!pref){

    return;

  }


  currentPrefecture =
    pref;


  clearPointLayer();


  resetSelectedLayer();


  selectedLayer =
    layer;


  layer.setStyle({

    weight:4,

    color:"#397b83",

    fillOpacity:1

  });


  try{

    const bounds =
      layer.getBounds();


    if(
      bounds &&
      bounds.isValid()
    ){

      map.fitBounds(

        bounds,

        {

          padding:[
            30,
            30
          ],

          maxZoom:9

        }

      );

    }

  }catch(error){

    console.error(
      error
    );

  }


  const items =
    groups[
      collectionType
    ][pref] ||
    [];


  for(
    const item
    of items
  ){

    addPointMarker(
      item,
      pref
    );

  }


  updatePointStatus();

}


function addPointMarker(
  item,
  pref
){

  const lat =
    Number(
      item.coords?.[0]
    );


  const lng =
    Number(
      item.coords?.[1]
    );


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){

    return;

  }


  const obtained =
    obtainedIds[
      collectionType
    ].has(
      getItemId(item)
    );


  const icon =
    L.divIcon({

      className:"",

      html:`

        <div
          class="poke-marker ${
            obtained
            ?
            "obtained"
            :
            "not-obtained"
          }"
        ></div>

      `,

      iconSize:[
        18,
        18
      ],

      iconAnchor:[
        9,
        9
      ]

    });


  const marker =
    L.marker(

      [
        lat,
        lng
      ],

      {

        icon,

        riseOnHover:true

      }

    );


  marker.on(
    "click",
    function(e){

      L.DomEvent.stopPropagation(
        e
      );


      openModal(
        item,
        pref,
        lat,
        lng
      );

    }
  );


  marker.addTo(
    pointLayer
  );

}


function clearPointLayer(){

  if(pointLayer){

    pointLayer.clearLayers();

  }


  document.getElementById(
    "pointStatus"
  )
  .classList
  .remove(
    "show"
  );

}


function resetSelectedLayer(){

  if(
    selectedLayer &&
    prefectureLayer
  ){

    prefectureLayer.resetStyle(
      selectedLayer
    );

  }


  selectedLayer =
    null;

}


function updatePointStatus(){

  if(!currentPrefecture){

    return;

  }


  const status =
    document.getElementById(
      "pointStatus"
    );


  const items =
    groups[
      collectionType
    ][
      currentPrefecture
    ] ||
    [];


  const obtained =
    items.filter(

      item =>
        obtainedIds[
          collectionType
        ].has(
          getItemId(item)
        )

    ).length;


  status.innerHTML = `

    <b>
      ${escapeHtml(
        currentPrefecture
      )}
    </b>

    ／

    ${obtained}
    /
    ${items.length}

    已獲得

    <span class="muted">

      　點擊地圖紅／綠點查看詳細資料

    </span>

  `;


  status.classList.add(
    "show"
  );

}


function refreshMapMarkers(){

  if(
    !pointLayer ||
    !currentPrefecture
  ){

    return;

  }


  clearPointLayer();


  const items =
    groups[
      collectionType
    ][
      currentPrefecture
    ] ||
    [];


  for(
    const item
    of items
  ){

    addPointMarker(
      item,
      currentPrefecture
    );

  }


  updatePointStatus();

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(
  blob,
  filename
){

  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;

  a.download =
    filename;


  document.body.appendChild(
    a
  );


  a.click();

  a.remove();


  setTimeout(
    () =>
      URL.revokeObjectURL(
        url
      ),
    1000
  );

}


function downloadAll(){

  const lines =
    [];


  for(
    const [
      pref,
      items
    ]
    of Object.entries(
      groups[
        collectionType
      ]
    )
    .sort()
  ){

    lines.push(
      `# ===== ${pref} (${items.length}) =====`
    );


    for(
      const item
      of items
    ){

      lines.push(

        `${item.coords?.[0] ?? ""},` +

        `${item.coords?.[1] ?? ""},` +

        `${getItemTitle(
          collectionType,
          item
        )}`

      );

    }


    lines.push("");

  }


  const filename =
    collectionType === "lid"

    ?

    "poke_lid_2026.txt"

    :

    "pokemon_center_2026.txt";


  downloadBlob(

    new Blob(

      [
        "\ufeff",
        lines.join("\n")
      ],

      {
        type:
          "text/plain;charset=utf-8"
      }

    ),

    filename

  );

}


function downloadJSON(){

  const out =
    {};


  for(
    const [
      pref,
      items
    ]
    of Object.entries(
      groups[
        collectionType
      ]
    )
  ){

    out[pref] =
      items.map(

        item => ({

          id:
            item.id,

          name:
            getItemTitle(
              collectionType,
              item
            ),

          lat:
            item.coords?.[0] ?? "",

          lng:
            item.coords?.[1] ?? "",

          address:
            item.address ||
            ""

        })

      );

  }


  const filename =
    collectionType === "lid"

    ?

    "poke_lid_2026.json"

    :

    "pokemon_center_2026.json";


  downloadBlob(

    new Blob(

      [
        JSON.stringify(
          out,
          null,
          2
        )
      ],

      {
        type:
          "application/json;charset=utf-8"
      }

    ),

    filename

  );

}


function downloadCSV(){

  const rows = [

    [
      "id",
      "prefecture",
      "name",
      "lat",
      "lng",
      "address"
    ]

  ];


  for(
    const item
    of dataSets[
      collectionType
    ]
  ){

    rows.push([

      item.id,

      PREF[item.pref] ||
      item.pref,

      getItemTitle(
        collectionType,
        item
      ),

      item.coords?.[0] ??
        "",

      item.coords?.[1] ??
        "",

      item.address ||
        ""

    ]);

  }


  const csv =
    rows
      .map(

        row =>

          row
            .map(

              value =>

                `"${String(value)
                  .replaceAll(
                    '"',
                    '""'
                  )}"`

            )
            .join(",")

      )
      .join("\n");


  const filename =
    collectionType === "lid"

    ?

    "poke_lid_2026.csv"

    :

    "pokemon_center_2026.csv";


  downloadBlob(

    new Blob(

      [
        "\ufeff",
        csv
      ],

      {
        type:
          "text/csv;charset=utf-8"
      }

    ),

    filename

  );

}


/* =========================================================
   HISTORY
========================================================= */

async function loadHistoryFile(
  type
){

  try{

    const json =
      await loadJSON(
        HISTORY_URLS[type]
      );


    return (

      json.history ||
      []

    )
      .map(

        entry => ({

          ...entry,

          type

        })

      );

  }catch(error){

    console.error(
      `${type} History 載入失敗:`,
      error
    );

    return [];

  }

}


async function loadHistory(){

  const [
    lidHistory,
    centerHistory
  ] =
    await Promise.all([

      loadHistoryFile(
        "lid"
      ),

      loadHistoryFile(
        "center"
      )

    ]);


  historyEntries = [

    ...lidHistory,

    ...centerHistory

  ];


  historyEntries.sort(

    (a,b) =>

      new Date(
        b.time || 0
      ) -

      new Date(
        a.time || 0
      )

  );


  renderHistory();

}


function setHistoryFilter(
  filter
){

  currentHistoryFilter =
    filter;


  document.getElementById(
    "historyAll"
  ).classList.toggle(
    "active",
    filter === "all"
  );


  document.getElementById(
    "historyLid"
  ).classList.toggle(
    "active",
    filter === "lid"
  );


  document.getElementById(
    "historyCenter"
  ).classList.toggle(
    "active",
    filter === "center"
  );


  renderHistory();

}


function renderHistory(){

  const el =
    document.getElementById(
      "history"
    );


  if(!el){

    return;

  }


  let logs =
    historyEntries;


  if(
    currentHistoryFilter !==
    "all"
  ){

    logs =
      logs.filter(

        item =>
          item.type ===
          currentHistoryFilter

      );

  }


  if(!logs.length){

    el.innerHTML = `

      <span class="muted">

        尚無更新紀錄。

      </span>

    `;

    return;

  }


  el.innerHTML =

    logs

      .slice(
        0,
        50
      )

      .map(

        item => {

          const added =
            item.added ||
            [];


          const removed =
            item.removed ||
            [];


          const changed =
            item.changed ||
            [];


          const typeText =
            item.type === "lid"

            ?

            "Poké Lid"

            :

            "Pokémon Center";


          return `

            <div class="history-card">

              <b>
                ${escapeHtml(
                  item.time ||
                  ""
                )}
              </b>


              <span
                class="history-type ${
                  item.type
                }"
              >
                ${typeText}
              </span>


              <br>


              <span class="muted">

                版本：
                ${escapeHtml(
                  item.total ??
                  ""
                )}
                筆

              </span>


              <br>


              🟢 新增
              ${added.length}

              　

              🔴 移除
              ${removed.length}

              　

              🟡 修改
              ${changed.length}


              ${
                added.length

                ?

                `

                <div
                  class="muted"
                  style="margin-top:6px"
                >

                  新增：
                  ${added
                    .slice(0,5)
                    .map(
                      x =>
                        escapeHtml(
                          x.title ||
                          x.name ||
                          x.city ||
                          ""
                        )
                    )
                    .join("、")
                  }

                  ${
                    added.length > 5
                    ?
                    "…"
                    :
                    ""
                  }

                </div>

                `

                :

                ""
              }

            </div>

          `;

        }

      )

      .join("");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    m => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[m])
  );

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key !==
      "Escape"
    ){

      return;

    }


    const modal =
      document.getElementById(
        "modalOverlay"
      );


    const collection =
      document.getElementById(
        "collectionPanel"
      );


    const prefecture =
      document.getElementById(
        "prefecturePanel"
      );


    if(
      modal.classList.contains(
        "show"
      )
    ){

      closeModal();

      return;

    }


    if(
      collection.classList.contains(
        "show"
      )
    ){

      backToPrefectureList();

      return;

    }


    if(
      prefecture.classList.contains(
        "show"
      )
    ){

      closePrefecturePanel();

    }

  }
);

   START
========================================================= */

async function start(){

  loadLocalCollection(
    "lid"
  );

  loadLocalCollection(
    "center"
  );


  await Promise.all([

    loadDataSet(
      "lid"
    ),

    loadDataSet(
      "center"
    )

  ]);


  switchCollectionType(
    "lid"
  );


  await setupMap();


  await loadHistory();

}


start();
