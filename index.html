<!doctype html> 
<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>
  Pokémon Japan Collection｜日本寶可夢收集圖鑑
</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#e9f7fb;
  color:#315f66;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
}

body.no-scroll{
  overflow:hidden;
}

button{
  font:inherit;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  border-radius:24px;

  padding:
    28px
    24px
    22px;

  text-align:center;

  margin-bottom:18px;

  position:relative;

  overflow:hidden;
}

.header:before,
.header:after{
  content:"";

  position:absolute;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .45
    );
}

.header:before{
  width:140px;
  height:140px;

  top:-70px;
  left:-40px;
}

.header:after{
  width:180px;
  height:180px;

  right:-70px;
  bottom:-90px;
}

.logo-title{
  position:relative;
  z-index:1;
}

.logo-title h1{
  margin:0;

  color:#397b83;

  font-size:30px;
  font-weight:900;

  letter-spacing:2px;
}

.logo-title p{
  margin:
    8px
    0
    0;

  color:#58919a;

  font-size:14px;
}


/* =========================================================
   TABS
========================================================= */

.main-tabs{
  display:grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap:14px;

  margin-bottom:20px;
}

.main-tab{
  border:0;

  border-radius:20px;

  padding:
    16px
    18px;

  background:#fff;

  color:#397b83;

  cursor:pointer;

  box-shadow:
    0
    4px
    16px
    rgba(
      70,
      130,
      140,
      .12
    );

  transition:.18s;
}

.main-tab:hover{
  transform:
    translateY(-2px);
}

.main-tab.active{
  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );
}

.main-tab-icon{
  font-size:28px;
}

.main-tab-title{
  margin-top:4px;

  font-size:21px;
  font-weight:900;
}

.main-tab-sub{
  margin-top:3px;

  color:#7a989d;

  font-size:12px;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-bar{
  background:#8fd58d;

  color:#fff;

  border-radius:999px;

  padding:
    11px
    20px;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:18px;

  font-size:23px;

  font-weight:900;

  box-shadow:
    0
    4px
    12px
    rgba(
      76,
      150,
      90,
      .15
    );

  margin-bottom:20px;
}

.progress-bar .ball{
  font-size:24px;
}


/* =========================================================
   TITLE
========================================================= */

.section-title{
  text-align:center;

  color:#397b83;

  font-size:22px;

  font-weight:900;

  margin:
    22px
    0
    14px;
}


/* =========================================================
   REGION
========================================================= */

.region-grid{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:18px;
}

.region-card{
  background:#fff;

  border-radius:20px;

  overflow:hidden;

  box-shadow:
    0
    4px
    16px
    rgba(
      70,
      130,
      140,
      .12
    );

  cursor:pointer;

  transition:.18s;
}

.region-card:hover{
  transform:
    translateY(-3px);

  box-shadow:
    0
    8px
    24px
    rgba(
      70,
      130,
      140,
      .18
    );
}

.region-images{
  height:185px;

  background:#9de0cc;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:8px;

  padding:
    18px
    12px;

  position:relative;

  overflow:hidden;
}

.region-images:before{
  content:"";

  position:absolute;

  inset:0;

  opacity:.16;

  background-image:
    radial-gradient(
      circle at 20px 20px,
      #fff 0 10px,
      transparent 11px
    ),
    radial-gradient(
      circle at 65px 65px,
      #fff 0 10px,
      transparent 11px
    );

  background-size:
    90px
    90px;
}

.region-image{
  width:31%;

  max-width:135px;

  aspect-ratio:1;

  object-fit:contain;

  position:relative;

  z-index:1;

  filter:
    drop-shadow(
      0
      3px
      4px
      rgba(
        0,
        0,
        0,
        .20
      )
    );
}

.region-empty{
  color:#fff;

  font-weight:700;

  position:relative;

  z-index:1;
}

.region-info{
  background:#fff;

  padding:
    17px
    12px
    18px;

  text-align:center;
}

.region-name{
  font-size:22px;

  font-weight:900;

  color:#4c7f86;

  margin-bottom:6px;
}

.region-count{
  color:#27bea9;

  font-size:27px;

  font-weight:900;
}

.region-percent{
  margin-top:3px;

  color:#83a3a7;

  font-size:13px;
}


/* =========================================================
   FIRST LAYER
========================================================= */

.prefecture-panel{
  position:fixed;

  inset:0;

  z-index:10000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:14px;

  background:
    rgba(
      20,
      55,
      60,
      .52
    );
}

.prefecture-panel.show{
  display:flex;
}

.prefecture-window{
  width:
    min(
      850px,
      100%
    );

  max-height:
    calc(
      100vh - 28px
    );

  background:#f7fcfc;

  border-radius:26px;

  overflow:hidden;

  box-shadow:
    0
    20px
    80px
    rgba(
      0,
      0,
      0,
      .35
    );

  display:flex;

  flex-direction:column;
}

.prefecture-header{
  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  padding:
    20px
    22px;

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:15px;
}

.prefecture-header-title{
  min-width:0;
}

.prefecture-title{
  color:#397b83;

  font-size:25px;

  font-weight:900;
}

.prefecture-summary{
  margin-top:5px;

  color:#58919a;

  font-size:14px;
}

.panel-close{
  width:42px;
  height:42px;

  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  font-size:27px;

  cursor:pointer;

  flex-shrink:0;
}

.prefecture-grid{
  padding:20px;

  overflow:auto;

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:14px;
}

.prefecture-card{
  background:#fff;

  border-radius:18px;

  padding:15px;

  cursor:pointer;

  box-shadow:
    0
    3px
    12px
    rgba(
      70,
      130,
      140,
      .10
    );

  transition:.15s;
}

.prefecture-card:hover{
  transform:
    translateY(-3px);
}

.prefecture-card-top{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;

  margin-bottom:10px;
}

.prefecture-name{
  font-size:20px;

  font-weight:900;

  color:#397b83;
}

.prefecture-count{
  font-size:14px;

  font-weight:900;

  color:#27bea9;
}

.prefecture-progress{
  height:10px;

  background:#edf3f3;

  border-radius:999px;

  overflow:hidden;
}

.prefecture-progress-bar{
  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #76d8bd,
      #27c978
    );
}

.prefecture-percent{
  margin-top:7px;

  font-size:12px;

  color:#829a9e;
}


/* =========================================================
   SECOND LAYER
========================================================= */

.collection-panel{
  position:fixed;

  inset:0;

  z-index:10500;

  display:none;

  align-items:center;
  justify-content:center;

  padding:14px;

  background:
    rgba(
      20,
      55,
      60,
      .52
    );
}

.collection-panel.show{
  display:flex;
}

.collection-window{
  width:
    min(
      1100px,
      100%
    );

  max-height:
    calc(
      100vh - 28px
    );

  background:#f7fcfc;

  border-radius:26px;

  overflow:hidden;

  box-shadow:
    0
    20px
    80px
    rgba(
      0,
      0,
      0,
      .35
    );

  display:flex;

  flex-direction:column;
}

.collection-header{
  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  padding:
    20px
    22px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;
}

.collection-header-left{
  min-width:0;
}

.collection-title{
  color:#397b83;

  font-size:25px;

  font-weight:900;
}

.collection-summary{
  margin-top:5px;

  color:#58919a;

  font-size:14px;
}

.collection-header-actions{
  display:flex;

  align-items:center;

  gap:8px;
}

.back-btn{
  border:0;

  border-radius:999px;

  padding:
    9px
    14px;

  background:#fff;

  color:#397b83;

  font-weight:900;

  cursor:pointer;
}

.collection-close{
  width:42px;
  height:42px;

  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  font-size:27px;

  cursor:pointer;
}

.collection-toolbar{
  background:#fff;

  padding:
    12px
    20px;

  border-bottom:
    1px solid
    #e7eeee;
}

.collection-legend{
  display:flex;

  gap:16px;

  font-size:13px;

  color:#637f83;
}

.legend-item{
  display:flex;

  align-items:center;

  gap:6px;
}

.legend-dot{
  width:12px;
  height:12px;

  border-radius:50%;
}

.legend-dot.green{
  background:#27c978;

  box-shadow:
    0
    0
    9px
    rgba(
      39,
      201,
      120,
      .9
    );
}

.legend-dot.red{
  background:#ef4b55;

  box-shadow:
    0
    0
    9px
    rgba(
      239,
      75,
      85,
      .9
    );
}

.collection-grid{
  padding:20px;

  overflow:auto;

  display:grid;

  grid-template-columns:
    repeat(
      5,
      minmax(0,1fr)
    );

  gap:20px;
}


/* =========================================================
   COLLECTION CARD
========================================================= */

.collection-item{
  background:#fff;

  border-radius:18px;

  padding:10px;

  cursor:pointer;

  text-align:center;

  transition:.18s;
}

.collection-item:hover{
  transform:
    translateY(-4px);
}

.collection-item.obtained{
  box-shadow:
    0
    0
    0
    2px
    rgba(
      39,
      201,
      120,
      .50
    ),
    0
    0
    24px
    rgba(
      39,
      201,
      120,
      .85
    ),
    0
    8px
    20px
    rgba(
      39,
      201,
      120,
      .15
    );
}

.collection-item.not-obtained{
  box-shadow:
    0
    0
    0
    2px
    rgba(
      239,
      75,
      85,
      .45
    ),
    0
    0
    24px
    rgba(
      239,
      75,
      85,
      .75
    ),
    0
    8px
    20px
    rgba(
      239,
      75,
      85,
      .12
    );
}

.collection-image-wrap{
  width:100%;

  aspect-ratio:1;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:14px;

  background:#9de0cc;

  overflow:hidden;
}

.collection-image{
  width:100%;

  height:100%;

  object-fit:contain;

  filter:
    drop-shadow(
      0
      3px
      5px
      rgba(
        0,
        0,
        0,
        .22
      )
    );
}

.collection-city{
  margin-top:9px;

  color:#397b83;

  font-size:14px;

  font-weight:900;

  line-height:1.35;

  min-height:19px;
}

.collection-status{
  margin-top:3px;

  font-size:11px;

  font-weight:800;
}

.collection-item.obtained
.collection-status{
  color:#27bd7a;
}

.collection-item.not-obtained
.collection-status{
  color:#ef4b55;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
  position:fixed;

  inset:0;

  z-index:11000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:18px;

  background:
    rgba(
      20,
      55,
      60,
      .55
    );
}

.modal-overlay.show{
  display:flex;
}

.poke-modal{
  width:
    min(
      430px,
      calc(100vw - 28px)
    );

  max-height:
    calc(
      100vh - 35px
    );

  overflow:auto;

  background:#fff;

  border-radius:24px;

  box-shadow:
    0
    20px
    70px
    rgba(
      0,
      0,
      0,
      .35
    );

  position:relative;

  z-index:11001;
}

.modal-close{
  position:absolute;

  top:12px;
  right:12px;

  z-index:5;

  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  font-size:25px;

  cursor:pointer;

  box-shadow:
    0
    2px
    10px
    rgba(
      0,
      0,
      0,
      .15
    );
}

.modal-image-wrap{
  background:#9de0cc;

  padding:18px;

  text-align:center;
}

.modal-image{
  width:
    min(
      300px,
      80vw
    );

  aspect-ratio:1;

  object-fit:contain;

  display:block;

  margin:auto;

  filter:
    drop-shadow(
      0
      5px
      8px
      rgba(
        0,
        0,
        0,
        .2
      )
    );
}

.modal-content{
  padding:20px;
}

.modal-type{
  font-size:12px;

  color:#6d959b;

  margin-bottom:2px;
}

.modal-pref{
  font-size:13px;

  color:#7b999d;
}

.modal-city{
  font-size:25px;

  font-weight:900;

  color:#397b83;

  margin:
    3px
    0
    10px;

  line-height:1.35;
}

.modal-address{
  color:#637f83;

  font-size:14px;

  line-height:1.6;

  margin-bottom:12px;
}

.coordinate{
  display:inline-block;

  padding:
    9px
    12px;

  background:#f0f8f7;

  color:#277e77;

  border-radius:10px;

  font-family:monospace;

  font-size:14px;

  cursor:pointer;

  user-select:none;

  max-width:100%;

  overflow-wrap:anywhere;
}

.copy-hint{
  display:inline-block;

  margin-left:8px;

  color:#27bd7a;

  font-size:13px;

  font-weight:800;

  opacity:0;

  transition:.2s;
}

.copy-hint.show{
  opacity:1;
}


/* =========================================================
   STAMP RALLY
========================================================= */

.stamp-event{
  margin-top:6px;
  color:#397b83;
  font-size:14px;
  font-weight:900;
  line-height:1.45;
}

.stamp-dates{
  margin-top:4px;
  color:#7b999d;
  font-size:12px;
}

.stamp-reward{
  margin-top:10px;
  padding:10px 12px;
  border-radius:12px;
  background:#fff7df;
  color:#8a6a13;
  font-size:13px;
  line-height:1.5;
}

.stamp-status{
  display:inline-block;
  margin-top:8px;
  padding:4px 9px;
  border-radius:999px;
  background:#edf5f5;
  color:#397b83;
  font-size:11px;
  font-weight:900;
}

.history-type.stamp{
  background:#e9e1ff;
  color:#6f4bb8;
}

@media(max-width:700px){
  .main-tabs{
    grid-template-columns:
      repeat(3, 1fr);
  }
}

/* =========================================================
   NAVIGATION
========================================================= */

.map-navigation{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;

  margin-top:16px;
}

.navigation-btn{
  border:0;

  border-radius:13px;

  padding:
    12px
    10px;

  cursor:pointer;

  font-weight:900;

  transition:.15s;
}

.navigation-btn:hover{
  transform:
    translateY(-2px);
}

.apple-map-btn{
  background:#111;

  color:#fff;
}

.google-map-btn{
  background:#4285f4;

  color:#fff;
}


/* =========================================================
   OBTAIN
========================================================= */

.obtain-row{
  margin-top:18px;

  border-top:
    1px solid
    #edf1f1;

  padding-top:16px;
}

.obtain-label{
  display:flex;

  align-items:center;

  gap:12px;

  cursor:pointer;

  font-size:18px;

  font-weight:900;

  color:#397b83;
}

.obtain-label input{
  appearance:none;

  width:28px;
  height:28px;

  border:
    3px solid
    #b8cdcf;

  border-radius:8px;

  position:relative;

  cursor:pointer;

  background:#fff;
}

.obtain-label input:checked{
  background:#27c978;

  border-color:#27c978;
}

.obtain-label input:checked:after{
  content:"✓";

  position:absolute;

  color:#fff;

  font-size:20px;

  font-weight:900;

  left:3px;

  top:-1px;
}

.save-status{
  margin-top:8px;

  color:#27bd7a;

  font-size:13px;

  min-height:18px;
}


/* =========================================================
   HISTORY
========================================================= */

.history-box{
  background:#fff;

  border-radius:20px;

  padding:18px;

  box-shadow:
    0
    4px
    16px
    rgba(
      70,
      130,
      140,
      .12
    );

  margin-top:22px;
}

.history-box h2{
  margin-top:0;

  color:#397b83;
}

.history-filter{
  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-bottom:12px;
}

.history-filter button{
  border:0;

  border-radius:999px;

  padding:
    7px
    12px;

  background:#edf5f5;

  color:#397b83;

  font-size:12px;

  font-weight:800;

  cursor:pointer;
}

.history-filter button.active{
  background:#397b83;

  color:#fff;
}

.history-card{
  border-bottom:
    1px solid
    #eee;

  padding:
    12px
    0;

  font-size:14px;
}

.history-card:last-child{
  border-bottom:0;
}

.history-type{
  display:inline-block;

  border-radius:999px;

  padding:
    3px
    8px;

  margin-left:5px;

  font-size:10px;

  font-weight:900;
}

.history-type.lid{
  background:#ffe8e8;

  color:#df4a52;
}

.history-type.center{
  background:#fff3ce;

  color:#b68100;
}


/* =========================================================
   DOWNLOAD
========================================================= */

.download-box{
  margin-top:22px;

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:8px;
}

.download-btn{
  border:0;

  border-radius:999px;

  padding:
    10px
    18px;

  background:#397b83;

  color:#fff;

  cursor:pointer;

  font-weight:800;
}


/* =========================================================
   LOADING / ERROR
========================================================= */

.loading{
  text-align:center;

  padding:40px;

  color:#6f9095;
}

.error-box{
  padding:16px;

  border-radius:12px;

  background:#fff4f4;

  color:#bd4c4c;

  font-size:14px;

  line-height:1.7;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .collection-grid{
    grid-template-columns:
      repeat(
        4,
        minmax(0,1fr)
      );
  }

}


@media(max-width:700px){

  .container{
    padding:10px;
  }

  .header{
    border-radius:18px;

    padding:

<script>

/* =========================================================
   DATA
========================================================= */

const OFFICIAL_CENTER_BADGES = {
  "寶可夢中心橫濱": "https://shop.pokemon.co.jp/images/logos/logo-pokemoncenter-yokohama.webp",
  "pokemoncenteryokohama": "https://shop.pokemon.co.jp/images/logos/logo-pokemoncenter-yokohama.webp",
  "pokémoncenteryokohama": "https://shop.pokemon.co.jp/images/logos/logo-pokemoncenter-yokohama.webp"
};

const DATA_URLS = {
  lid: "data/data.json",
  center: "data/pokemon_center.json",
  stamp: "svgstamp_rally.json"
};

const RAW_DATA_URLS = {
  lid: "https://raw.githubusercontent.com/h23456789/Pok-Lids/main/data/data.json",
  center: "https://raw.githubusercontent.com/h23456789/Pok-Lids/main/data/pokemon_center.json",
  stamp: "https://raw.githubusercontent.com/h23456789/Pok-Lids/main/svgstamp_rally.json"
};

const HISTORY_URLS = {
  lid: "history.json",
  stamp: "svgstamp_history.json"
};

const PREF = {
  1:"北海道",2:"青森県",3:"岩手県",4:"宮城県",5:"秋田県",6:"山形県",7:"福島県",
  8:"茨城県",9:"栃木県",10:"群馬県",11:"埼玉県",12:"千葉県",13:"東京都",14:"神奈川県",
  15:"新潟県",16:"富山県",17:"石川県",18:"福井県",19:"山梨県",20:"長野県",21:"岐阜県",22:"静岡県",23:"愛知県",
  24:"三重県",25:"滋賀県",26:"京都府",27:"大阪府",28:"兵庫県",29:"奈良県",30:"和歌山県",
  31:"鳥取県",32:"島根県",33:"岡山県",34:"広島県",35:"山口県",36:"徳島県",37:"香川県",38:"愛媛県",39:"高知県",
  40:"福岡県",41:"佐賀県",42:"長崎県",43:"熊本県",44:"大分県",45:"宮崎県",46:"鹿児島県",47:"沖縄県"
};

const PREF_ALIAS = {};
for(const [code,name] of Object.entries(PREF)){
  PREF_ALIAS[name]=Number(code);
  PREF_ALIAS[name.replace(/県$|府$/,'')]=Number(code);
}

const REGIONS = {
  "北海道・東北":{prefs:[1,2,3,4,5,6,7]},
  "關東":{prefs:[8,9,10,11,12,13,14]},
  "中部":{prefs:[15,16,17,18,19,20,21,22,23]},
  "近畿":{prefs:[24,25,26,27,28,29,30]},
  "中國・四國":{prefs:[31,32,33,34,35,36,37,38,39]},
  "九州・沖繩":{prefs:[40,41,42,43,44,45,46,47]}
};

let collectionType = "lid";
let dataSets = {lid:[], center:[], stamp:[]};
let stampEventsMeta = [];
let groups = {lid:{}, center:{}};
let obtainedIds = {lid:new Set(), stamp:new Set()};
let currentRegion = null;
let currentPrefecture = null;
let currentCollectionItems = [];
let currentStampEventId = null;
let currentItem = null;
let currentItemType = "lid";
let currentHistoryFilter = "all";
let historyEntries = [];

const STORAGE_KEYS = {
  lid:"pokemonJapanCollection_lid",
  stamp:"pokemonJapanCollection_stamp"
};

function getItemId(item){ return String(item?.id ?? ""); }
function loadLocalCollection(type){
  try{
    const raw=localStorage.getItem(STORAGE_KEYS[type]);
    const parsed=raw?JSON.parse(raw):[];
    obtainedIds[type]=Array.isArray(parsed)?new Set(parsed.map(String)):new Set();
  }catch{ obtainedIds[type]=new Set(); }
}
function saveLocalCollection(type){ localStorage.setItem(STORAGE_KEYS[type],JSON.stringify([...obtainedIds[type]])); }

function resolvePrefecture(item){
  const raw=String(item?.pref??"").trim();
  if(raw){
    const n=Number(raw);
    if(Number.isInteger(n)&&n>=1&&n<=47)return n;
    if(PREF_ALIAS[raw])return PREF_ALIAS[raw];
    for(const [name,code] of Object.entries(PREF_ALIAS)) if(raw.includes(name)) return code;
  }
  const combined=[item?.region,item?.name,item?.title,item?.city,item?.address,item?.location,item?.venue].filter(Boolean).join(" ").toLowerCase();
  for(const [name,code] of Object.entries(PREF_ALIAS)) if(combined.includes(name.toLowerCase())) return code;
  return null;
}

function getItemTitle(type,item){
  if(type==="stamp") return item?.nameZh || item?.venueZh || item?.name || item?.venue || item?.location || item?.cityZh || item?.city || item?.title || "GO 集章趣";
  return item?.city || item?.title || item?.name || "Poké Lid";
}

function normalizeKey(value){ return String(value??"").toLowerCase().replace(/\s+/g,"").replace(/[‐‑–—ー・.]/g,""); }

function centerNameVariants(value){ const key=normalizeKey(value); const aliases={"yokohama":"寶可夢中心橫濱","pokemoncenteryokohama":"寶可夢中心橫濱","ポケモンセンターヨコハマ":"寶可夢中心橫濱","寶可夢中心橫濱":"寶可夢中心橫濱"}; return [key,normalizeKey(aliases[key]||"")].filter(Boolean); }

function findCenterRecord(item){
  const list=dataSets.center||[];
  const candidates=[item?.venue,item?.name,item?.venueZh,item?.nameZh,item?.centerName,item?.centerNameZh].filter(Boolean).map(normalizeKey);
  for(const c of candidates){
    for(const record of list){
      const names=[record?.name,record?.title,record?.city,record?.venue,record?.nameZh,record?.venueZh].filter(Boolean).map(normalizeKey);
      if(names.some(n=>n===c || (n.length>4 && (n.includes(c)||c.includes(n))))) return record;
    }
  }
  return null;
}

function getItemImageUrl(type,item){
  if(type==="lid") return "https://pokefuta.yuki.games/images/pokefuta/"+encodeURIComponent(item.id)+".png";

  /*
   * Pokémon Center GO 集章趣：
   * 優先使用既有 pokemon_center.json 中「該中心自己的代表徽章／圖示」。
   * 活動 Banner 永遠不在這裡 fallback。
   */
  if(String(item?.venueType||"")==="pokemon_center" || String(item?.venueType||"")==="pokemon_go_lab"){
    const center=findCenterRecord(item);
    const centerImage=center?.pokemonCenterBadge || center?.pokemonCenterIcon || center?.centerBadge || center?.centerIcon || center?.badge || center?.icon || center?.image || center?.imageUrl || center?.logo || "";
    if(centerImage) return centerImage;
    const fallbackKey=normalizeKey(item?.nameZh||item?.name||item?.venueZh||item?.venue||"");
    const officialBadge=OFFICIAL_CENTER_BADGES[fallbackKey] || OFFICIAL_CENTER_BADGES[String(item?.nameZh||"")];
    if(officialBadge) return officialBadge;
  }

  return item?.stampImage || item?.pointImage || "";
}

function getItemLatLng(item){
  let lat=Number(item?.coords?.[0] ?? item?.lat);
  let lng=Number(item?.coords?.[1] ?? item?.lng);
  if((!Number.isFinite(lat)||!Number.isFinite(lng)) && String(item?.venueType||"")==="pokemon_center"){
    const center=findCenterRecord(item);
    if(center){
      lat=Number(center?.coords?.[0] ?? center?.lat);
      lng=Number(center?.coords?.[1] ?? center?.lng);
    }
  }
  return {lat,lng};
}

function getStampStatus(item){
  const now=new Date();
  const start=item?.startDate?new Date(item.startDate):null;
  const end=item?.endDate?new Date(item.endDate+"T23:59:59"):null;
  if(start&&now<start)return "即將開始";
  if(end&&now>end)return "已結束";
  return "進行中";
}
function getStampEventName(item){ return item?.eventZh || item?.eventNameZh || item?.event || item?.eventName || item?.activityZh || item?.activity || "GO 集章趣"; }
function getStampDates(item){ const s=item?.startDate||"",e=item?.endDate||""; return s&&e?`${s} ～ ${e}`:s?`${s} ～`:""; }

async function fetchJSON(url){
  const sep=url.includes("?")?"&":"?";
  const response=await fetch(url+sep+"ts="+Date.now(),{cache:"no-store"});
  if(!response.ok) throw new Error(`HTTP ${response.status}`);
  return await response.json();
}

function normalizeDataList(json,type){
  if(type==="stamp" && Array.isArray(json?.list)) return json.list;
  if(Array.isArray(json?.list)) return json.list;
  if(Array.isArray(json)) return json;
  if(type==="stamp" && Array.isArray(json?.events)){
    const flat=[];
    for(const event of json.events){
      const points=Array.isArray(event.stamps)?event.stamps:[];
      for(const p of points) flat.push({...event,...p,eventId:p.eventId||event.eventId||event.id});
    }
    return flat;
  }
  for(const key of ["data","items","stamps","records","locations","results"]){ if(Array.isArray(json?.[key])) return json[key]; }
  return [];
}

async function loadDataSet(type){
  let lastError="";
  for(const url of [DATA_URLS[type],RAW_DATA_URLS[type]]){
    try{
      const json=await fetchJSON(url);
      if(type==="stamp") stampEventsMeta=Array.isArray(json?.events)?json.events:[];
      const list=normalizeDataList(json,type);
      if(!Array.isArray(list)) throw new Error("資料格式錯誤");
      dataSets[type]=list;
      buildGroups(type);
      return true;
    }catch(error){ lastError=error.message; console.warn(`[${type}]`,url,error); }
  }
  dataSets[type]=[];
  if(type==="stamp") stampEventsMeta=[];
  buildGroups(type);
  if(type===collectionType) document.getElementById("regions").innerHTML=`<div class="error-box" style="grid-column:1/-1">⚠️ 資料載入失敗<br><br>${escapeHtml(lastError)}</div>`;
  return false;
}

function buildGroups(type){
  groups[type]={};
  if(type==="stamp") return;
  for(const item of dataSets[type]){
    item.__prefCode=resolvePrefecture(item);
    const pref=item.__prefCode?PREF[item.__prefCode]:null;
    if(pref) (groups[type][pref] ||= []).push(item);
  }
}

function getStampEvents(){
  const map=new Map();
  const ensure=(meta)=>{
    const id=String(meta?.eventId||meta?.id||meta?.event||"GO-STAMP-UNKNOWN");
    if(!map.has(id)){
      map.set(id,{
        id,
        event:meta?.event||meta?.eventName||"GO 集章趣",
        eventZh:meta?.eventZh||meta?.eventNameZh||meta?.event||"GO 集章趣",
        startDate:meta?.startDate||"",
        endDate:meta?.endDate||"",
        sourceUrl:meta?.sourceUrl||"",
        activityImage:meta?.activityImage||meta?.eventImage||meta?.image||"",
        eventImage:meta?.eventImage||meta?.activityImage||meta?.image||"",
        expectedStamps:Number.isFinite(Number(meta?.expectedStamps))?Number(meta.expectedStamps):null,
        descriptionZh:meta?.descriptionZh||"",
        items:[]
      });
    }
    return map.get(id);
  };
  for(const meta of stampEventsMeta) ensure(meta);
  for(const item of dataSets.stamp){
    const event=ensure(item);
    const titleOriginal=item?.name||item?.venue||item?.event||"";
    const looksLikePlaceholder=!item?.stampImage&&!item?.lat&&!item?.lng&&String(titleOriginal)===String(event.event);
    if(looksLikePlaceholder) continue;
    event.items.push(item);
    if(!event.startDate || (item.startDate && item.startDate<event.startDate)) event.startDate=item.startDate;
    if(!event.endDate || (item.endDate && item.endDate>event.endDate)) event.endDate=item.endDate;
    if(!event.sourceUrl && item.sourceUrl) event.sourceUrl=item.sourceUrl;
    if(!event.activityImage && item.activityImage) event.activityImage=item.activityImage;
    if(!event.eventImage && (item.eventImage||item.activityImage)) event.eventImage=item.eventImage||item.activityImage;
    if(event.expectedStamps==null && Number.isFinite(Number(item.expectedStamps))) event.expectedStamps=Number(item.expectedStamps);
  }
  return [...map.values()].sort((a,b)=>(a.startDate||"9999").localeCompare(b.startDate||"9999") || (a.eventZh||a.event).localeCompare(b.eventZh||b.event));
}

function switchCollectionType(type){
  if(!["lid","stamp"].includes(type)) return;
  collectionType=type;
  document.getElementById("tabLid").classList.toggle("active",type==="lid");
  document.getElementById("tabStamp").classList.toggle("active",type==="stamp");
  document.getElementById("sectionTitle").textContent=type==="lid"?"🔴 Poké Lid 蒐集進度":"🎟️ GO 集章趣 蒐集進度";
  document.getElementById("progressLabel").textContent=type==="lid"?"Poké Lid 已收集：":"GO 集章趣 已收集：";
  closeAllPanels(); currentRegion=null; currentPrefecture=null; currentStampEventId=null; currentCollectionItems=[]; currentItem=null;
  renderRegions(); updateOverall();
}
function closeAllPanels(){ for(const id of ["prefecturePanel","collectionPanel","modalOverlay"]) document.getElementById(id).classList.remove("show"); document.body.classList.remove("no-scroll"); }
function updateOverall(){
  if(collectionType==="stamp"){
    const events=getStampEvents(); let total=0,obtained=0;
    for(const event of events){ const items=event.items||[]; const eventTotal=Number(event.expectedStamps||0)||items.length; total+=eventTotal; obtained+=items.filter(x=>obtainedIds.stamp.has(getItemId(x))).length; }
    document.getElementById("totalObtained").textContent=obtained;
    document.getElementById("totalCount").textContent=total;
    return;
  }
  const list=dataSets.lid||[]; const obtained=list.filter(item=>obtainedIds.lid.has(getItemId(item))).length;
  document.getElementById("totalObtained").textContent=obtained;
  document.getElementById("totalCount").textContent=list.length;
}

function renderRegions(){
  const el=document.getElementById("regions");
  if(collectionType==="stamp") return renderStampEvents(el);
  const list=dataSets.lid||[];
  if(!list.length){ el.innerHTML=`<div class="error-box" style="grid-column:1/-1">⚠️ Poké Lid 沒有資料</div>`; return; }
  el.innerHTML="";
  for(const [regionName,region] of Object.entries(REGIONS)){
    const items=list.filter(item=>region.prefs.includes(Number(item.__prefCode)));
    const obtained=items.filter(item=>obtainedIds.lid.has(getItemId(item))).length;
    const total=items.length; const percent=total?Math.round(obtained/total*1000)/10:0;
    const sample=items.slice(0,3); const card=document.createElement("div"); card.className="region-card"; card.onclick=()=>openRegion(regionName);
    const images=sample.map(item=>{const image=getItemImageUrl("lid",item);return image?`<img class="region-image" src="${escapeHtml(image)}" alt="" loading="lazy">`:"";}).join("");
    card.innerHTML=`<div class="region-images">${images||`<div class="region-empty">尚無資料</div>`}</div><div class="region-info"><div class="region-name">${escapeHtml(regionName)}</div><div class="region-count">${obtained} / ${total}</div><div class="region-percent">完成率 ${percent}%</div></div>`;
    el.appendChild(card);
  }
}

function renderStampEvents(el){
  const events=getStampEvents();
  if(!events.length){
    el.innerHTML=`<div class="error-box" style="grid-column:1/-1">⚠️ 目前沒有找到 Pokémon GO 官方「GO 集章趣」資料。<br><br>資料由 GitHub Actions 自動同步 Pokémon GO 官方網站。</div>`;
    return;
  }
  el.innerHTML="";
  for(const event of events){
    const items=event.items||[];
    const obtained=items.filter(x=>obtainedIds.stamp.has(getItemId(x))).length;
    const total=Number(event.expectedStamps||0) || items.length;
    const percent=total?Math.round(obtained/total*1000)/10:0;
    const known=items.length;
    const card=document.createElement("div");
    card.className="region-card stamp-event-card";
    card.onclick=()=>openStampEvent(event.id);
    const banner=event.activityImage || event.eventImage || event.image || "";
    const date=event.startDate ? `${escapeHtml(event.startDate)}${event.endDate?" ～ "+escapeHtml(event.endDate):""}` : "官方活動";
    const countText=total?`${obtained} / ${total}`:"待官方公布集章數";
    const pointText=(known<total && total)?`已取得 ${known} 個集章點`:`集章點 ${known} 個`;
    card.innerHTML=`
      <div class="region-images stamp-event-banner-wrap">
        ${banner
          ? `<img class="stamp-event-banner" src="${escapeHtml(banner)}" alt="${escapeHtml(event.eventZh||event.event||"GO 集章趣")}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"> <div class="stamp-event-banner-fallback" style="display:none">${escapeHtml(event.eventZh||event.event||"GO 集章趣")}</div>`
          : `<div class="stamp-event-banner-fallback">${escapeHtml(event.eventZh||event.event||"GO 集章趣")}</div>`
        }
      </div>
      <div class="region-info">
        <div class="region-name">${escapeHtml(event.eventZh||event.event||"GO 集章趣")}</div>
        <div class="region-count">${countText}</div>
        <div class="region-percent">${date}<br>${total?`完成率 ${percent}%　｜　${pointText}`:pointText}</div>
      </div>`;
    el.appendChild(card);
  }
}

function openRegion(regionName){
  if(collectionType==="stamp") return;
  currentRegion=regionName; document.getElementById("prefectureTitle").textContent=regionName; renderPrefectureSummary(); renderPrefectureGrid(); document.getElementById("prefecturePanel").classList.add("show"); document.body.classList.add("no-scroll");
}
function renderPrefectureSummary(){ if(!currentRegion)return; const region=REGIONS[currentRegion]; const items=(dataSets.lid||[]).filter(item=>region.prefs.includes(Number(item.__prefCode))); const obtained=items.filter(item=>obtainedIds.lid.has(getItemId(item))).length; document.getElementById("prefectureSummary").textContent=`已收集 ${obtained} / ${items.length}`; }
function renderPrefectureGrid(){ const el=document.getElementById("prefectureGrid"); const region=REGIONS[currentRegion]; const list=dataSets.lid||[]; el.innerHTML=""; for(const prefCode of region.prefs){ const prefName=PREF[prefCode]; const items=list.filter(item=>Number(item.__prefCode)===Number(prefCode)); if(!items.length)continue; const obtained=items.filter(item=>obtainedIds.lid.has(getItemId(item))).length; const total=items.length; const percent=Math.round(obtained/total*100); const card=document.createElement("div"); card.className="prefecture-card"; card.onclick=()=>openPrefectureCollection(prefName); card.innerHTML=`<div class="prefecture-card-top"><div class="prefecture-name">${escapeHtml(prefName)}</div><div class="prefecture-count">${obtained} / ${total}</div></div><div class="prefecture-progress"><div class="prefecture-progress-bar" style="width:${percent}%"></div></div><div class="prefecture-percent">完成率 ${percent}%</div>`; el.appendChild(card); } if(!el.children.length)el.innerHTML=`<div class="loading" style="grid-column:1/-1">此區域目前沒有 Poké Lid 資料。</div>`; }
function closePrefecturePanel(){ document.getElementById("prefecturePanel").classList.remove("show"); currentRegion=null; document.body.classList.remove("no-scroll"); }
function prefectureOverlayClick(event){ if(event.target===document.getElementById("prefecturePanel"))closePrefecturePanel(); }

function openPrefectureCollection(prefName){
  if(collectionType==="stamp") return;
  currentPrefecture=prefName; currentCollectionItems=groups.lid[prefName]||[]; document.getElementById("collectionTitle").textContent=prefName; document.querySelector(".back-btn").textContent="← 返回縣列表"; updateCollectionSummary(); renderCollectionGrid(); document.getElementById("collectionPanel").classList.add("show"); document.body.classList.add("no-scroll");
}
function openStampEvent(eventId){
  const event=getStampEvents().find(x=>String(x.id)===String(eventId));
  if(!event)return;
  currentStampEventId=event.id;
  currentCollectionItems=event.items||[];
  document.getElementById("collectionTitle").textContent=event.eventZh||event.event;
  const total=Number(event.expectedStamps||0) || currentCollectionItems.length;
  const obtained=currentCollectionItems.filter(x=>obtainedIds.stamp.has(getItemId(x))).length;
  document.getElementById("collectionSummary").textContent=total?`已收集 ${obtained} / ${total}${currentCollectionItems.length<total?`　（目前已取得 ${currentCollectionItems.length} 個集章點資料）`:""}`:"官方集章點資料尚待公布";
  document.querySelector(".back-btn").textContent="← 返回活動列表";
  renderCollectionGrid();
  document.getElementById("collectionPanel").classList.add("show");
  document.body.classList.add("no-scroll");
}
function updateCollectionSummary(){ const obtained=currentCollectionItems.filter(item=>obtainedIds.lid.has(getItemId(item))).length; document.getElementById("collectionSummary").textContent=`已收集 ${obtained} / ${currentCollectionItems.length}`; }
function updateStampEventSummary(){
  if(!currentStampEventId)return;
  const event=getStampEvents().find(x=>String(x.id)===String(currentStampEventId)); if(!event)return;
  currentCollectionItems=event.items||[];
  const obtained=currentCollectionItems.filter(x=>obtainedIds.stamp.has(getItemId(x))).length;
  const total=Number(event.expectedStamps||0)||currentCollectionItems.length;
  document.getElementById("collectionSummary").textContent=total?`已收集 ${obtained} / ${total}${currentCollectionItems.length<total?`　（目前已取得 ${currentCollectionItems.length} 個集章點資料）`:""}`:"官方集章點資料尚待公布";
}

function renderCollectionGrid(){
  const el=document.getElementById("collectionGrid");
  el.innerHTML="";

  if(!currentCollectionItems.length){
    el.innerHTML=`<div class="loading" style="grid-column:1/-1">目前官方尚未公開可取得的單一圖章圖片／集章點資料。<br>活動仍保留，待官方資料更新後會自動補上。</div>`;
    return;
  }

  for(const item of currentCollectionItems){
    const obtained=obtainedIds[collectionType].has(getItemId(item));
    const title=getItemTitle(collectionType,item);
    const image=getItemImageUrl(collectionType,item);
    const card=document.createElement("div");
    card.className="collection-item "+(obtained?"obtained":"not-obtained");
    card.onclick=()=>openModalFromItem(item);

    card.innerHTML=`
      <div class="collection-image-wrap">
        ${image
          ? `<img class="collection-image" src="${escapeHtml(image)}" alt="${escapeHtml(title)}" loading="lazy">`
          : `<div class="stamp-missing-image">目前尚未取得這個 GO 集章的實際圖片<br>官方資料更新後會自動補上</div>`
        }
      </div>
      <div class="collection-city">${escapeHtml(item.nameZh||item.venueZh||title)}</div>
      ${item.countryZh||item.cityZh
        ? `<div style="margin-top:3px;color:#7b999d;font-size:10px;line-height:1.35">${escapeHtml(item.cityZh||item.countryZh||"")}</div>`
        : ""
      }
      <div class="collection-status">${obtained?"● 已收集":"● 未收集"}</div>
    `;

    el.appendChild(card);
  }
}

function backToPrefectureList(){
  closeModal();
  if(collectionType==="stamp"){
    document.getElementById("collectionPanel").classList.remove("show"); currentStampEventId=null; currentCollectionItems=[]; document.body.classList.remove("no-scroll"); renderRegions(); return;
  }
  document.getElementById("collectionPanel").classList.remove("show"); renderPrefectureSummary(); renderPrefectureGrid(); document.getElementById("prefecturePanel").classList.add("show"); document.body.classList.add("no-scroll"); currentPrefecture=null; currentCollectionItems=[];
}
function closeCollectionPanel(){ closeModal(); document.getElementById("collectionPanel").classList.remove("show"); currentPrefecture=null; currentStampEventId=null; currentCollectionItems=[]; document.body.classList.remove("no-scroll"); }
function collectionOverlayClick(event){ if(event.target===document.getElementById("collectionPanel"))closeCollectionPanel(); }

function openModalFromItem(item){ const {lat,lng}=getItemLatLng(item); const pref=collectionType==="stamp"?(item.countryZh||item.cityZh||item.city||item.pref||""):(PREF[item.__prefCode]||currentPrefecture||""); openModal(item,pref,lat,lng); }
function openModal(item,pref,lat,lng){
  currentItem=item; currentItemType=collectionType; const title=getItemTitle(currentItemType,item); const image=getItemImageUrl(currentItemType,item);
  const modalImage=document.getElementById("modalImage");
  modalImage.src=image || "";
  modalImage.alt=title;
  modalImage.style.display=image ? "block" : "none";
  document.getElementById("modalType").textContent=currentItemType==="lid"?"🔴 Poké Lid":"🎟️ Pokémon GO GO 集章趣"; document.getElementById("modalPref").textContent=pref; document.getElementById("modalCity").textContent=title; document.getElementById("modalAddress").textContent=item.addressZh||item.address||item.location||item.venueZh||item.venue||"";
  const valid=Number.isFinite(lat)&&Number.isFinite(lng); document.getElementById("modalCoordinate").textContent=valid?`${lat}, ${lng}`:"無座標資料";
  const details=document.getElementById("stampDetails");
  if(currentItemType==="stamp"){
    details.innerHTML=`<div class="stamp-event">🎟️ ${escapeHtml(getStampEventName(item))}</div>${item.venueZh&&item.venueZh!==title?`<div class="stamp-venue">📍 ${escapeHtml(item.venueZh)}</div>`:""}${getStampDates(item)?`<div class="stamp-dates">📅 ${escapeHtml(getStampDates(item))}</div>`:""}<span class="stamp-status">${escapeHtml(getStampStatus(item))}</span>${item.rewardZh||item.reward?`<div class="stamp-reward">🎁 ${escapeHtml(item.rewardZh||item.reward)}</div>`:""}${item.stampImageSource?`<div class="stamp-source">圖片來源：${escapeHtml(item.stampImageSource)}</div>`:""}${item.sourceUrl?`<div class="stamp-source"><a href="${escapeHtml(item.sourceUrl)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🔗 官方活動頁</a></div>`:""}`; details.style.display="block";
  }else{ details.innerHTML=""; details.style.display="none"; }
  updateModalObtained(); document.getElementById("modalOverlay").classList.add("show"); document.body.classList.add("no-scroll");
}
function updateModalObtained(){ if(!currentItem)return; const checked=obtainedIds[currentItemType].has(getItemId(currentItem)); document.getElementById("obtainedCheckbox").checked=checked; document.getElementById("saveStatus").textContent=checked?"✓ 已獲得":""; }
function refreshAllCollectionUI(){
  updateOverall(); renderRegions();
  if(collectionType==="lid"){
    if(currentRegion) {renderPrefectureSummary();renderPrefectureGrid();}
    if(currentPrefecture) {updateCollectionSummary();renderCollectionGrid();}
  }else if(currentStampEventId){ updateStampEventSummary(); renderCollectionGrid(); }
  updateModalObtained();
}
function toggleObtained(){ if(!currentItem)return; const type=currentItemType,id=getItemId(currentItem),value=document.getElementById("obtainedCheckbox").checked; if(value)obtainedIds[type].add(id);else obtainedIds[type].delete(id); saveLocalCollection(type); document.getElementById("saveStatus").textContent=value?"✓ 已獲得":"已取消"; refreshAllCollectionUI(); }

function openAppleMaps(event){ if(event)event.stopPropagation();if(!currentItem)return;const {lat,lng}=getItemLatLng(currentItem);const title=getItemTitle(currentItemType,currentItem);const destination=Number.isFinite(lat)&&Number.isFinite(lng)?`${lat},${lng}`:(currentItem.address||currentItem.location||currentItem.venue||title);window.open("https://maps.apple.com/?daddr="+encodeURIComponent(destination)+"&dirflg=d&q="+encodeURIComponent(title),"_blank","noopener"); }
function openGoogleMaps(event){ if(event)event.stopPropagation();if(!currentItem)return;const {lat,lng}=getItemLatLng(currentItem);const destination=Number.isFinite(lat)&&Number.isFinite(lng)?`${lat},${lng}`:(currentItem.address||currentItem.location||currentItem.venue||getItemTitle(currentItemType,currentItem));window.open("https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(destination),"_blank","noopener"); }
async function copyCoordinate(event){ if(event)event.stopPropagation();const text=document.getElementById("modalCoordinate").textContent.trim();if(!text||text==="無座標資料")return;try{await navigator.clipboard.writeText(text);}catch{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");}catch{}ta.remove();}const hint=document.getElementById("copyHint");hint.classList.add("show");setTimeout(()=>hint.classList.remove("show"),1500);}
function closeModal(event){if(event)event.stopPropagation();document.getElementById("modalOverlay").classList.remove("show");if(!document.getElementById("collectionPanel").classList.contains("show")&&!document.getElementById("prefecturePanel").classList.contains("show"))document.body.classList.remove("no-scroll");}
function overlayClick(event){if(event.target===document.getElementById("modalOverlay"))closeModal();}

function downloadBlob(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadAll(){const lines=[];if(collectionType==="stamp"){for(const event of getStampEvents()){lines.push(`# ===== ${event.eventZh||event.event} (${event.items.length}) =====`);for(const item of event.items){const {lat,lng}=getItemLatLng(item);lines.push(`${Number.isFinite(lat)?lat:""},${Number.isFinite(lng)?lng:""},${getItemTitle("stamp",item)}`);}lines.push("");}}else{for(const [pref,items] of Object.entries(groups.lid).sort()){lines.push(`# ===== ${pref} (${items.length}) =====`);for(const item of items){const {lat,lng}=getItemLatLng(item);lines.push(`${Number.isFinite(lat)?lat:""},${Number.isFinite(lng)?lng:""},${getItemTitle("lid",item)}`);}lines.push("");}}downloadBlob(new Blob(["\ufeff",lines.join("\n")],{type:"text/plain;charset=utf-8"}),collectionType==="lid"?"poke_lid_2026.txt":"go_stamp_rally.txt");}
function downloadJSON(){const output=collectionType==="stamp"?{events:getStampEvents()}:dataSets.lid;downloadBlob(new Blob([JSON.stringify(output,null,2)],{type:"application/json;charset=utf-8"}),collectionType==="lid"?"poke_lid_2026.json":"go_stamp_rally.json");}
function downloadCSV(){const rows=[["id","event","name","lat","lng","address","image","sourceUrl"]];for(const item of dataSets[collectionType]){const {lat,lng}=getItemLatLng(item);rows.push([item.id,collectionType==="stamp"?getStampEventName(item):"",getItemTitle(collectionType,item),Number.isFinite(lat)?lat:"",Number.isFinite(lng)?lng:"",item.addressZh||item.address||"",getItemImageUrl(collectionType,item),item.sourceUrl||""]);}const csv=rows.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");downloadBlob(new Blob(["﻿",csv],{type:"text/csv;charset=utf-8"}),collectionType==="lid"?"poke_lid_2026.csv":"go_stamp_rally.csv");}

async function loadHistoryFile(type){try{const json=await fetchJSON(HISTORY_URLS[type]);return(json.history||[]).map(entry=>({...entry,type}));}catch{return[];}}
async function loadHistory(){const [lidHistory,stampHistory]=await Promise.all([loadHistoryFile("lid"),loadHistoryFile("stamp")]);historyEntries=[...lidHistory,...stampHistory].sort((a,b)=>new Date(b.time||0)-new Date(a.time||0));renderHistory();}
function setHistoryFilter(filter){currentHistoryFilter=filter;document.getElementById("historyAll").classList.toggle("active",filter==="all");document.getElementById("historyLid").classList.toggle("active",filter==="lid");document.getElementById("historyStamp").classList.toggle("active",filter==="stamp");renderHistory();}
function renderHistory(){const el=document.getElementById("history");let logs=historyEntries;if(currentHistoryFilter!=="all")logs=logs.filter(x=>x.type===currentHistoryFilter);if(!logs.length){el.innerHTML=`<span class="muted">尚無更新紀錄。</span>`;return;}const labels={lid:"Poké Lid",stamp:"GO 集章趣"};el.innerHTML=logs.slice(0,50).map(item=>`<div class="history-card"><b>${escapeHtml(item.time||"")}</b><span class="history-type ${item.type}">${labels[item.type]||item.type}</span><br><span class="muted">${escapeHtml(item.eventZh||item.event||"")}　版本：${escapeHtml(item.total??"")} 筆</span><br>🟢 新增 ${(item.added||[]).length}　 🔴 移除 ${(item.removed||[]).length}　 🟡 修改 ${(item.changed||[]).length}</div>`).join("");}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));}

document.addEventListener("keydown",event=>{if(event.key!=="Escape")return;const modal=document.getElementById("modalOverlay"),collection=document.getElementById("collectionPanel"),prefecture=document.getElementById("prefecturePanel");if(modal.classList.contains("show")){closeModal();return;}if(collection.classList.contains("show")){backToPrefectureList();return;}if(prefecture.classList.contains("show"))closePrefecturePanel();});

async function start(){loadLocalCollection("lid");loadLocalCollection("stamp");await Promise.all([loadDataSet("lid"),loadDataSet("center"),loadDataSet("stamp")]);switchCollectionType("lid");await loadHistory();}
start();

</script>
