/* =========================================================
   PREFECTURE RESOLVER
========================================================= */

function resolvePrefecture(item){

  const rawPref =
    item?.pref;

  if(
    rawPref !== undefined &&
    rawPref !== null &&
    String(rawPref).trim() !== ""
  ){

    const text =
      String(rawPref).trim();

    const number =
      Number(text);

    if(
      Number.isInteger(number) &&
      number >= 1 &&
      number <= 47
    ){

      return number;

    }

    if(
      PREF_ALIAS[text]
    ){

      return PREF_ALIAS[text];

    }

    for(
      const [
        name,
        code
      ]
      of Object.entries(
        PREF_ALIAS
      )
    ){

      if(
        text.includes(name)
      ){

        return code;

      }

    }

  }


  const regionText =
    String(
      item?.region ||
      ""
    );

  const nameText =
    String(
      item?.name ||
      item?.title ||
      item?.city ||
      ""
    );

  const addressText =
    String(
      item?.address ||
      item?.location ||
      ""
    );

  const combined =
    (
      regionText +
      " " +
      nameText +
      " " +
      addressText
    )
    .toLowerCase();


  for(
    const [
      name,
      code
    ]
    of Object.entries(
      PREF_ALIAS
    )
  ){

    if(
      combined.includes(
        name.toLowerCase()
      )
    ){

      return code;

    }

  }


  const english = {

    hokkaido:1,
    aomori:2,
    iwate:3,
    miyagi:4,
    akita:5,
    yamagata:6,
    fukushima:7,

    ibaraki:8,
    tochigi:9,
    gunma:10,
    saitama:11,
    chiba:12,
    tokyo:13,
    kanagawa:14,

    niigata:15,
    toyama:16,
    ishikawa:17,
    fukui:18,
    yamanashi:19,
    nagano:20,
    gifu:21,
    shizuoka:22,
    aichi:23,

    mie:24,
    shiga:25,
    kyoto:26,
    osaka:27,
    hyogo:28,
    nara:29,
    wakayama:30,

    tottori:31,
    shimane:32,
    okayama:33,
    hiroshima:34,
    yamaguchi:35,

    tokushima:36,
    kagawa:37,
    ehime:38,
    kochi:39,

    fukuoka:40,
    saga:41,
    nagasaki:42,
    kumamoto:43,
    oita:44,
    miyazaki:45,
    kagoshima:46,
    okinawa:47

  };


  for(
    const [
      keyword,
      code
    ]
    of Object.entries(
      english
    )
  ){

    if(
      combined.includes(
        keyword
      )
    ){

      return code;

    }

  }


  return null;

}

/* =========================================================
   STAMP
========================================================= */

function getStampEventName(item){

  return (
    item.event ||
    item.eventName ||
    item.activity ||
    "期間限定 Stamp Rally"
  );

}


function getStampDates(item){

  const start =
    item.startDate ||
    "";

  const end =
    item.endDate ||
    "";

  if(
    start &&
    end
  ){

    return `${start} ～ ${end}`;

  }

  if(start){

    return `${start} ～`;

  }

  return "";

}


function getStampStatus(item){

  const now =
    new Date();

  const start =
    item.startDate
    ?
    new Date(item.startDate)
    :
    null;

  const end =
    item.endDate
    ?
    new Date(
      item.endDate +
      "T23:59:59"
    )
    :
    null;

  if(
    start &&
    now < start
  ){

    return "即將開始";

  }

  if(
    end &&
    now > end
  ){

    return "已結束";

  }

  return "進行中";

}


function getStampStatusClass(item){

  const status =
    getStampStatus(item);

  if(
    status === "進行中"
  ){

    return "status-active";

  }

  if(
    status === "即將開始"
  ){

    return "status-before";

  }

  return "status-ended";

}


/* =========================================================
   JSON
========================================================= */

async function fetchJSON(url){

  const separator =
    url.includes("?")
    ?
    "&"
    :
    "?";

  const response =
    await fetch(
      url +
      separator +
      "ts=" +
      Date.now(),
      {
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      `HTTP ${response.status}`
    );

  }

  const json =
    await response.json();

  if(
    !json ||
    !Array.isArray(json.list)
  ){

    throw new Error(
      "JSON list 格式錯誤"
    );

  }

  return json;

}


async function loadDataSet(type){

  let errorMessage =
    "";

  for(
    const url
    of [
      DATA_URLS[type],
      RAW_DATA_URLS[type]
    ]
  ){

    try{

      const json =
        await fetchJSON(url);

      dataSets[type] =
        json.list;

      buildGroups(type);

      return;

    }catch(error){

      errorMessage =
        error.message;

      console.warn(
        `[${type}]`,
        url,
        error
      );

    }

  }

  dataSets[type] =
    [];

  buildGroups(type);

  if(
    type === collectionType
  ){

    document.getElementById(
      "regions"
    ).innerHTML = `
      <div
        class="error-box"
        style="grid-column:1/-1"
      >
        ⚠️ 資料載入失敗
        <br><br>
        ${escapeHtml(errorMessage)}
      </div>
    `;

  }

}


/* =========================================================
   GROUPS
========================================================= */

function buildGroups(type){

  groups[type] =
    {};

  const unresolved = [];

  for(
    const item
    of dataSets[type]
  ){

    const prefCode =
      resolvePrefecture(item);

    item.__prefCode =
      prefCode;

    const prefName =
      prefCode
      ?
      PREF[prefCode]
      :
      null;

    if(!prefName){

      unresolved.push(item);

      continue;

    }

    if(
      !groups[type][prefName]
    ){

      groups[type][prefName] =
        [];

    }

    groups[type][prefName].push(
      item
    );

  }

  if(unresolved.length){

    console.warn(
      `[${type}] 無法判斷縣市：`,
      unresolved
    );

  }

}

/* =========================================================
   OVERALL
========================================================= */

function updateOverall(){

  const list =
    dataSets[
      collectionType
    ] || [];

  const obtained =
    list.filter(
      item =>
        obtainedIds[
          collectionType
        ].has(
          getItemId(item)
        )
    ).length;

  const total =
    list.length;

  const percent =
    total
    ?
    Math.round(
      obtained /
      total *
      1000
    ) / 10
    :
    0;


  document.getElementById(
    "totalObtained"
  ).textContent =
    obtained;

  document.getElementById(
    "totalCount"
  ).textContent =
    total;

  document.getElementById(
    "progressPercent"
  ).textContent =
    `完成率 ${percent}%`;

  document.getElementById(
    "progressFill"
  ).style.width =
    `${percent}%`;

  document.getElementById(
    "sectionTotal"
  ).textContent =
    `${total} 筆`;

}

  ){

/* =========================================================
   STAMP EVENTS
========================================================= */

function renderStampEvents(){

  const el =
    document.getElementById(
      "stampEvents"
    );

  const list =
    dataSets.stamp || [];


  el.innerHTML =
    "";


  if(!list.length){

    el.innerHTML = `
      <div class="loading">
        目前沒有 Stamp Rally 資料。
      </div>
    `;

    return;

  }


  /*
   * 依活動名稱分組
   */

  const eventGroups = {};


  for(
    const item
    of list
  ){

    const eventName =
      getStampEventName(item);

    if(
      !eventGroups[eventName]
    ){

      eventGroups[eventName] =
        [];

    }

    eventGroups[eventName].push(item);

  }


  for(
    const [
      eventName,
      items
    ]
    of Object.entries(eventGroups)
  ){

    const obtained =
      items.filter(
        item =>
          obtainedIds.stamp.has(
            getItemId(item)
          )
      ).length;


    const total =
      items.length;


    const percent =
      total
      ?
      Math.round(
        obtained /
        total *
        100
      )
      :
      0;


    const first =
      items[0];


    const status =
      getStampStatus(first);


    const card =
      document.createElement(
        "div"
      );

    card.className =
      "stamp-event-card";


    card.onclick =
      () =>
        openStampEvent(
          eventName,
          items
        );


    card.innerHTML = `

      <div class="stamp-event-top">

        <div class="stamp-event-main">

          <div class="stamp-event-name">

            🎟️
            ${escapeHtml(eventName)}

          </div>

          ${
            getStampDates(first)
            ?
            `
              <div class="stamp-event-date">

                📅
                ${escapeHtml(
                  getStampDates(first)
                )}

              </div>
            `
            :
            ""
          }

        </div>


        <div
          class="
            stamp-event-status
            ${getStampStatusClass(first)}
          "
        >

          ${escapeHtml(status)}

        </div>

      </div>


      <div class="stamp-event-progress">

        <div
          class="stamp-event-progress-fill"
          style="width:${percent}%"
        ></div>

      </div>


      <div class="stamp-event-bottom">

        <span>
          已收集
        </span>

        <span class="stamp-event-count">
          ${obtained} / ${total}
        </span>

        <span>
          ${percent}%
        </span>

      </div>

    `;


    el.appendChild(card);

  }

}

/* =========================================================
   MAP
========================================================= */

function openAppleMaps(event){

  if(event){

    event.stopPropagation();

  }


  if(
    !currentItem
  ){

    return;

  }


  const {
    lat,
    lng
  } =
    getItemLatLng(
      currentItem
    );


  const title =
    getItemTitle(
      currentItemType,
      currentItem
    );


  let url;


  if(
    Number.isFinite(lat) &&
    Number.isFinite(lng)
  ){

    url =
      "https://maps.apple.com/" +
      "?daddr=" +
      encodeURIComponent(
        `${lat},${lng}`
      ) +
      "&dirflg=d" +
      "&q=" +
      encodeURIComponent(
        title
      );

  }else{

    const destination =
      currentItem.address ||
      currentItem.location ||
      title;


    url =
      "https://maps.apple.com/" +
      "?daddr=" +
      encodeURIComponent(
        destination
      ) +
      "&dirflg=d";

  }


  window.open(
    url,
    "_blank",
    "noopener"
  );

}


function openGoogleMaps(event){

  if(event){

    event.stopPropagation();

  }


  if(
    !currentItem
  ){

    return;

  }


  const {
    lat,
    lng
  } =
    getItemLatLng(
      currentItem
    );


  const destination =
    Number.isFinite(lat) &&
    Number.isFinite(lng)

    ?

    `${lat},${lng}`

    :

    (
      currentItem.address ||
      currentItem.location ||
      getItemTitle(
        currentItemType,
        currentItem
      )
    );


  const url =
    "https://www.google.com/maps/dir/" +
    "?api=1" +
    "&destination=" +
    encodeURIComponent(
      destination
    );


  window.open(
    url,
    "_blank",
    "noopener"
  );

}


/* =========================================================
   COPY
========================================================= */

async function copyCoordinate(event){

  if(event){

    event.stopPropagation();

  }


  const text =
    document.getElementById(
      "modalCoordinate"
    ).textContent.trim();


  if(
    !text ||
    text ===
      "無座標資料"
  ){

    return;

  }


  try{

    await navigator.clipboard.writeText(
      text
    );

  }catch{

    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value =
      text;

    textarea.style.position =
      "fixed";

    textarea.style.opacity =
      "0";

    document.body.appendChild(
      textarea
    );

    textarea.focus();

    textarea.select();

    try{

      document.execCommand(
        "copy"
      );

    }catch(error){

      console.error(error);

    }

    textarea.remove();

  }


  const hint =
    document.getElementById(
      "copyHint"
    );


  hint.classList.add(
    "show"
  );


  setTimeout(
    () =>
      hint.classList.remove(
        "show"
      ),
    1500
  );

}

/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(
  blob,
  filename
){

  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;

  a.download =
    filename;


  document.body.appendChild(
    a
  );


  a.click();

  a.remove();


  setTimeout(
    () =>
      URL.revokeObjectURL(
        url
      ),
    1000
  );

}


function downloadAll(){

  const lines = [];


  for(
    const [
      pref,
      items
    ]
    of Object.entries(
      groups[
        collectionType
      ]
    ).sort()
  ){

    lines.push(
      `# ===== ${pref} (${items.length}) =====`
    );


    for(
      const item
      of items

      const {
        lat,
        lng
      } =
        getItemLatLng(item);


      lines.push(

        `${Number.isFinite(lat) ? lat : ""},` +

        `${Number.isFinite(lng) ? lng : ""},` +

        `${getItemTitle(
          collectionType,
          item
        )}` +

        (
          collectionType === "stamp"

          `,${getStampEventName(item)}`
          :
          ""
        )

  const filenames = {

      "poke_lid_2026.txt",

    center:
      "pokemon_center_2026.txt",

    stamp:
      "stamp_rally_2026.txt"

  downloadBlob(

    new Blob(
      [

        lines.join("\n")
      ],
      {
        type:
          "text/plain;charset=utf-8"
      }
    ),

    filenames[

    ]

    of Object.entries(
      groups[

      ]

  ){

    output[pref] =
      items.map(

          event:
            collectionType === "stamp"

            ?

            :

          endDate:
            collectionType === "stamp"
            ?
            item.endDate || ""
            :
            undefined,

          lat:
            item.coords?.[0] ??
            item.lat ??
            "",

          lng:
            item.coords?.[1] ??
            item.lng ??
            "",

          address:
            item.address ||
            item.location ||
            "",

          image:

            item.icon ||
            "",

          reward:

   HISTORY
========================================================= */

async function loadHistoryFile(
  type
){

  try{

    const json =
      await fetchJSON(
        HISTORY_URLS[type]
      );


    return (
      json.history ||
      []
    ).map(
      entry => ({
        ...entry,
        type
      })
    );

  }catch{

    return [];

  }

}


async function loadHistory(){

  const [
    lidHistory,
    centerHistory,
    stampHistory
  ] =
    await Promise.all([

      loadHistoryFile(
        "lid"
      ),

      loadHistoryFile(
        "center"
      ),

      loadHistoryFile(
        "stamp"
      )

    ]);


  historyEntries = [

    ...lidHistory,
    ...centerHistory,
    ...stampHistory

  ];


  historyEntries.sort(

    (a,b) =>

      new Date(
        b.time || 0
      )

      -

      new Date(
        a.time || 0
      )

  );


  renderHistory();

}


function setHistoryFilter(
  filter
){

  currentHistoryFilter =
    filter;


  document.getElementById(
    "historyAll"
  ).classList.toggle(
    "active",
    filter === "all"
  );


  document.getElementById(
    "historyLid"
  ).classList.toggle(
    "active",
    filter === "lid"
  );


  document.getElementById(
    "historyCenter"
  ).classList.toggle(
    "active",
    filter === "center"
  );


  document.getElementById(
    "historyStamp"
  ).classList.toggle(
    "active",
    filter === "stamp"
  );


  renderHistory();

}


function renderHistory(){

  const el =
    document.getElementById(
      "history"
    );


  let logs =
    historyEntries;


  if(
    currentHistoryFilter !==
    "all"
  ){

    logs =
      logs.filter(
        item =>
          item.type ===
          currentHistoryFilter
      );

  }


  if(
    !logs.length
  ){

    el.innerHTML = `

      <span class="muted">
        尚無更新紀錄。
      </span>

    `;

    return;

  }


  const typeLabels = {

    lid:
      "Poké Lid",

    center:
      "Pokémon Center",

    stamp:
      "Stamp Rally"

  };


  el.innerHTML =

    logs
      .slice(
        0,
        50
      )
      .map(

        item => `

          <div class="history-card">

            <b>
              ${escapeHtml(
                item.time ||
                ""
              )}
            </b>

            <span
              class="
                history-type
                ${item.type}
              "
            >

              ${
                typeLabels[
                  item.type
                ] ||
                item.type
              }

            </span>


            <br>


            <span class="muted">

              ${
                item.event
                ?
                escapeHtml(
                  item.event
                ) + "　"
                :
                ""
              }

              版本：

              ${escapeHtml(
                item.total ??
                ""
              )}

              筆

            </span>


            <br>


            🟢 新增
            ${(item.added || []).length}

            　

            🔴 移除
            ${(item.removed || []).length}

            　

            🟡 修改
            ${(item.changed || []).length}

          </div>

        `

      )
      .join("");

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,

    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[char])

  );

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",

  event => {

    if(
      event.key !==
      "Escape"
    ){

      return;

    }


    const modal =
      document.getElementById(
        "modalOverlay"
      );


    const collection =
      document.getElementById(
        "collectionPanel"
      );


    const prefecture =
      document.getElementById(
        "prefecturePanel"
      );


    if(
      modal.classList.contains(
        "show"
      )
    ){

      closeModal();

      return;

    }

      collection.classList.contains(

      )
    ){

      backToPrefectureList();

      return;

    }


    if(
      prefecture.classList.contains(
        "show"
      )
    ){

      closePrefecturePanel();

    }
