<!doctype html>
<html lang="zh-Hant">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Poké Lids 2026｜日本集章地圖</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

/* =========================================================
   Base
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;
  padding:0;

  background:#e9f7fb;

  color:#315f66;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;

}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

.container{

  max-width:1200px;

  margin:auto;

  padding:20px;

}


/* =========================================================
   Header
========================================================= */

.header{

  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  border-radius:24px;

  padding:
    28px
    24px
    22px;

  text-align:center;

  margin-bottom:18px;

  position:relative;

  overflow:hidden;

}

.header:before,
.header:after{

  content:"";

  position:absolute;

  border-radius:50%;

  background:
    rgba(255,255,255,.45);

}

.header:before{

  width:140px;
  height:140px;

  top:-70px;
  left:-40px;

}

.header:after{

  width:180px;
  height:180px;

  right:-70px;
  bottom:-90px;

}

.logo-title{

  position:relative;

  z-index:1;

}

.logo-title h1{

  margin:0;

  color:#397b83;

  font-size:30px;

  font-weight:900;

  letter-spacing:2px;

}

.logo-title p{

  margin:
    8px
    0
    0;

  color:#58919a;

  font-size:14px;

}


/* =========================================================
   Login
========================================================= */

.user-area{

  position:relative;

  z-index:2;

  margin-top:16px;

}

.login-btn{

  border:0;

  background:#fff;

  color:#397b83;

  border-radius:999px;

  padding:
    10px
    20px;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0
    4px
    14px
    rgba(60,120,130,.15);

}

.login-btn:hover{

  transform:translateY(-1px);

}

.user-box{

  display:inline-flex;

  align-items:center;

  gap:10px;

  background:#fff;

  padding:
    8px
    14px;

  border-radius:999px;

  box-shadow:
    0
    4px
    14px
    rgba(60,120,130,.15);

  font-size:14px;

}

.user-avatar{

  width:30px;

  height:30px;

  border-radius:50%;

  object-fit:cover;

}

.logout-btn{

  border:0;

  background:#f2f2f2;

  color:#555;

  border-radius:999px;

  padding:
    6px
    10px;

  cursor:pointer;

}


/* =========================================================
   Overall Progress
========================================================= */

.progress-bar{

  background:#8fd58d;

  color:#fff;

  border-radius:999px;

  padding:
    11px
    20px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:18px;

  font-size:23px;

  font-weight:900;

  box-shadow:
    0
    4px
    12px
    rgba(76,150,90,.15);

  margin-bottom:20px;

}

.progress-bar .ball{

  font-size:24px;

}


/* =========================================================
   Region Cards
========================================================= */

.section-title{

  text-align:center;

  color:#397b83;

  font-size:22px;

  font-weight:900;

  margin:
    22px
    0
    14px;

}

.region-grid{

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:18px;

}

.region-card{

  background:#fff;

  border-radius:20px;

  overflow:hidden;

  box-shadow:
    0
    4px
    16px
    rgba(70,130,140,.12);

  cursor:pointer;

  transition:
    transform .18s ease,
    box-shadow .18s ease;

}

.region-card:hover{

  transform:
    translateY(-3px);

  box-shadow:
    0
    8px
    24px
    rgba(70,130,140,.18);

}

.region-images{

  height:185px;

  background:#9de0cc;

  position:relative;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:8px;

  padding:
    18px
    12px;

  overflow:hidden;

}

.region-images:before{

  content:"";

  position:absolute;

  inset:0;

  opacity:.16;

  background-image:

    radial-gradient(
      circle at 20px 20px,
      #fff 0 10px,
      transparent 11px
    ),

    radial-gradient(
      circle at 65px 65px,
      #fff 0 10px,
      transparent 11px
    );

  background-size:
    90px
    90px;

}

.region-image{

  width:31%;

  max-width:135px;

  aspect-ratio:1;

  object-fit:contain;

  position:relative;

  z-index:1;

  filter:
    drop-shadow(
      0
      3px
      4px
      rgba(0,0,0,.2)
    );

  transition:
    transform .18s ease;

}

.region-card:hover
.region-image{

  transform:
    scale(1.04);

}

.region-empty{

  color:#fff;

  font-weight:700;

  position:relative;

  z-index:1;

}

.region-info{

  background:#fff;

  padding:
    17px
    12px
    18px;

  text-align:center;

}

.region-name{

  font-size:22px;

  font-weight:900;

  color:#4c7f86;

  margin-bottom:6px;

}

.region-count{

  color:#27bea9;

  font-size:27px;

  font-weight:900;

}

.region-percent{

  margin-top:3px;

  color:#83a3a7;

  font-size:13px;

}


/* =========================================================
   Map
========================================================= */

.map-box{

  background:#fff;

  border-radius:20px;

  padding:12px;

  box-shadow:
    0
    4px
    16px
    rgba(70,130,140,.12);

  margin-top:22px;

}

.map-title{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:
    5px
    8px
    12px;

}

.map-title h2{

  margin:0;

  font-size:21px;

  color:#397b83;

}

.map-title span{

  font-size:12px;

  color:#829a9e;

}

#map{

  height:680px;

  width:100%;

  border-radius:15px;

  overflow:hidden;

}


/* =========================================================
   Leaflet
========================================================= */

.leaflet-control-zoom{

  border:0 !important;

  box-shadow:
    0
    3px
    12px
    rgba(0,0,0,.15) !important;

}

.leaflet-control-zoom a{

  color:#397b83 !important;

}


/* =========================================================
   Point Marker
========================================================= */

.poke-marker{

  width:18px;

  height:18px;

  border-radius:50%;

  border:3px solid #fff;

  box-shadow:
    0
    2px
    7px
    rgba(0,0,0,.4),

    0
    0
    0
    1px
    rgba(0,0,0,.15);

  transition:
    transform .15s ease;

}

.poke-marker.not-obtained{

  background:#ef4b55;

}

.poke-marker.obtained{

  background:#27c978;

}

.poke-marker:hover{

  transform:
    scale(1.25);

}


/* =========================================================
   Prefecture Tooltip
========================================================= */

.pref-tooltip{

  background:#fff;

  border:0 !important;

  border-radius:
    12px !important;

  box-shadow:
    0
    4px
    16px
    rgba(0,0,0,.2);

  color:#397b83;

  font-weight:800;

  padding:
    8px
    12px !important;

}

.pref-tooltip:before{

  border-top-color:
    #fff !important;

}


/* =========================================================
   Point Status
========================================================= */

.point-status{

  margin-top:10px;

  padding:
    12px
    15px;

  background:#f2fbfa;

  border-radius:12px;

  color:#397b83;

  font-size:14px;

  display:none;

}

.point-status.show{

  display:block;

}


/* =========================================================
   Detail Modal
========================================================= */

.modal-overlay{

  position:fixed;

  inset:0;

  z-index:9999;

  background:
    rgba(
      20,
      55,
      60,
      .45
    );

  display:none;

  align-items:center;

  justify-content:center;

  padding:18px;

  touch-action:none;

}

.modal-overlay.show{

  display:flex;

}

.poke-modal{

  width:
    min(
      430px,
      calc(100vw - 28px)
    );

  max-height:
    calc(
      100vh - 35px
    );

  overflow:auto;

  background:#fff;

  border-radius:24px;

  box-shadow:
    0
    20px
    70px
    rgba(0,0,0,.35);

  position:relative;

  touch-action:auto;

  animation:
    modalIn
    .18s ease;

}

@keyframes modalIn{

  from{

    opacity:0;

    transform:
      translateY(12px)
      scale(.97);

  }

  to{

    opacity:1;

    transform:none;

  }

}

.modal-close{

  position:absolute;

  top:12px;

  right:12px;

  z-index:5;

  width:38px;

  height:38px;

  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  font-size:25px;

  line-height:38px;

  cursor:pointer;

  box-shadow:
    0
    2px
    10px
    rgba(0,0,0,.15);

}

.modal-image-wrap{

  background:#9de0cc;

  padding:18px;

  text-align:center;

}

.modal-image{

  width:
    min(
      300px,
      80vw
    );

  aspect-ratio:1;

  object-fit:contain;

  display:block;

  margin:auto;

  filter:
    drop-shadow(
      0
      5px
      8px
      rgba(0,0,0,.2)
    );

}

.modal-content{

  padding:20px;

}

.modal-pref{

  font-size:13px;

  color:#7b999d;

}

.modal-city{

  font-size:25px;

  font-weight:900;

  color:#397b83;

  margin:
    3px
    0
    10px;

}

.modal-address{

  color:#637f83;

  font-size:14px;

  line-height:1.6;

  margin-bottom:12px;

}

.coordinate{

  display:inline-block;

  padding:
    9px
    12px;

  background:#f0f8f7;

  color:#277e77;

  border-radius:10px;

  font-family:monospace;

  font-size:14px;

  cursor:pointer;

  user-select:none;

}

.copy-hint{

  display:inline-block;

  margin-left:8px;

  color:#27bd7a;

  font-size:13px;

  font-weight:800;

  opacity:0;

  transition:.2s;

}

.copy-hint.show{

  opacity:1;

}


/* =========================================================
   Navigation Buttons
========================================================= */

.map-navigation{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;

  margin-top:16px;

}

.navigation-btn{

  border:0;

  border-radius:13px;

  padding:
    12px
    10px;

  cursor:pointer;

  font-weight:900;

  transition:
    transform .15s ease,
    opacity .15s ease;

}

.navigation-btn:hover{

  transform:
    translateY(-2px);

}

.navigation-btn:active{

  transform:
    translateY(0);

}

.apple-map-btn{

  background:#111;

  color:#fff;

}

.google-map-btn{

  background:#4285f4;

  color:#fff;

}


/* =========================================================
   Obtain
========================================================= */

.obtain-row{

  margin-top:18px;

  border-top:
    1px solid
    #edf1f1;

  padding-top:16px;

}

.obtain-label{

  display:flex;

  align-items:center;

  gap:12px;

  cursor:pointer;

  font-size:18px;

  font-weight:900;

  color:#397b83;

}

.obtain-label input{

  appearance:none;

  width:28px;

  height:28px;

  border:
    3px solid
    #b8cdcf;

  border-radius:8px;

  position:relative;

  cursor:pointer;

  background:#fff;

}

.obtain-label input:checked{

  background:#27c978;

  border-color:#27c978;

}

.obtain-label input:checked:after{

  content:"✓";

  position:absolute;

  color:#fff;

  font-size:20px;

  font-weight:900;

  left:3px;

  top:-1px;

}

.save-status{

  margin-top:8px;

  color:#27bd7a;

  font-size:13px;

  min-height:18px;

}


/* =========================================================
   Collection Panel
========================================================= */

.collection-panel{

  position:fixed;

  inset:0;

  z-index:10000;

  background:
    rgba(
      20,
      55,
      60,
      .52
    );

  display:none;

  align-items:center;

  justify-content:center;

  padding:14px;

}

.collection-panel.show{

  display:flex;

}

.collection-window{

  width:
    min(
      1100px,
      100%
    );

  max-height:
    calc(
      100vh - 28px
    );

  background:#f7fcfc;

  border-radius:26px;

  overflow:hidden;

  box-shadow:
    0
    20px
    80px
    rgba(0,0,0,.35);

  display:flex;

  flex-direction:column;

}

.collection-header{

  background:
    linear-gradient(
      135deg,
      #c8edf5,
      #aee0ed
    );

  padding:
    20px
    22px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  flex-shrink:0;

}

.collection-header-left{

  min-width:0;

}

.collection-title{

  margin:0;

  color:#397b83;

  font-size:25px;

  font-weight:900;

}

.collection-summary{

  margin-top:5px;

  color:#58919a;

  font-size:14px;

}

.collection-close{

  width:42px;

  height:42px;

  border:0;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  color:#397b83;

  font-size:27px;

  cursor:pointer;

  flex-shrink:0;

}

.collection-toolbar{

  background:#fff;

  padding:
    12px
    20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  flex-wrap:wrap;

  gap:8px;

  border-bottom:
    1px solid
    #e7eeee;

}

.collection-legend{

  display:flex;

  gap:16px;

  font-size:13px;

  color:#637f83;

}

.legend-item{

  display:flex;

  align-items:center;

  gap:6px;

}

.legend-dot{

  width:12px;

  height:12px;

  border-radius:50%;

}

.legend-dot.green{

  background:#27c978;

  box-shadow:
    0
    0
    9px
    rgba(
      39,
      201,
      120,
      .9
    );

}

.legend-dot.red{

  background:#ef4b55;

  box-shadow:
    0
    0
    9px
    rgba(
      239,
      75,
      85,
      .9
    );

}

.collection-grid{

  padding:20px;

  overflow:auto;

  display:grid;

  grid-template-columns:
    repeat(
      5,
      minmax(0,1fr)
    );

  gap:20px;

}


/* =========================================================
   Collection Item
========================================================= */

.collection-item{

  background:#fff;

  border-radius:18px;

  padding:10px;

  cursor:pointer;

  text-align:center;

  transition:
    transform .18s ease,
    box-shadow .18s ease;

}

.collection-item:hover{

  transform:
    translateY(-4px);

}


/*
 * 已收集：
 * 圖片外圍綠色光暈
 */

.collection-item.obtained{

  box-shadow:

    0
    0
    0
    2px
    rgba(
      39,
      201,
      120,
      .50
    ),

    0
    0
    24px
    rgba(
      39,
      201,
      120,
      .85
    ),

    0
    8px
    20px
    rgba(
      39,
      201,
      120,
      .15
    );

}


/*
 * 未收集：
 * 圖片外圍紅色光暈
 */

.collection-item.not-obtained{

  box-shadow:

    0
    0
    0
    2px
    rgba(
      239,
      75,
      85,
      .45
    ),

    0
    0
    24px
    rgba(
      239,
      75,
      85,
      .75
    ),

    0
    8px
    20px
    rgba(
      239,
      75,
      85,
      .12
    );

}


/*
 * 圖片本身不改色
 */

.collection-image-wrap{

  width:100%;

  aspect-ratio:1;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:14px;

  background:#9de0cc;

  overflow:hidden;

}

.collection-image{

  width:100%;

  height:100%;

  object-fit:contain;

  transition:
    transform .18s ease;

  filter:
    drop-shadow(
      0
      3px
      5px
      rgba(0,0,0,.22)
    );

}

.collection-item:hover
.collection-image{

  transform:
    scale(1.05);

}

.collection-city{

  margin-top:9px;

  color:#397b83;

  font-size:14px;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}

.collection-status{

  margin-top:3px;

  font-size:11px;

  font-weight:800;

}

.collection-item.obtained
.collection-status{

  color:#27bd7a;

}

.collection-item.not-obtained
.collection-status{

  color:#ef4b55;

}


/* =========================================================
   History
========================================================= */

.history-box{

  background:#fff;

  border-radius:20px;

  padding:18px;

  box-shadow:
    0
    4px
    16px
    rgba(70,130,140,.12);

  margin-top:22px;

}

.history-box h2{

  margin-top:0;

  color:#397b83;

}

.history-card{

  border-bottom:
    1px solid
    #eee;

  padding:
    12px
    0;

  font-size:14px;

}

.history-card:last-child{

  border-bottom:0;

}

.muted{

  color:#81999d;

}


/* =========================================================
   Download
========================================================= */

.download-box{

  margin-top:22px;

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:8px;

}

.download-btn{

  border:0;

  border-radius:999px;

  padding:
    10px
    18px;

  background:#397b83;

  color:#fff;

  cursor:pointer;

  font-weight:800;

}

.download-btn:hover{

  background:#2f6d74;

}


/* =========================================================
   Loading / Error
========================================================= */

.loading{

  text-align:center;

  padding:40px;

  color:#6f9095;

}

.error-box{

  margin:
    10px
    0;

  padding:16px;

  border-radius:12px;

  background:#fff4f4;

  color:#bd4c4c;

  font-size:14px;

  line-height:1.7;

}


/* =========================================================
   Mobile
========================================================= */

@media(max-width:900px){

  .collection-grid{

    grid-template-columns:
      repeat(
        4,
        minmax(0,1fr)
      );

  }

}


@media(max-width:700px){

  .container{

    padding:10px;

  }

  .header{

    border-radius:18px;

    padding:
      22px
      15px
      18px;

  }

  .logo-title h1{

    font-size:23px;

  }

  .progress-bar{

    font-size:18px;

    padding:
      10px
      12px;

    gap:8px;

  }

  .progress-bar .ball{

    font-size:18px;

  }

  .region-grid{

    grid-template-columns:
      1fr 1fr;

    gap:10px;

  }

  .region-images{

    height:120px;

    padding:
      9px
      5px;

    gap:3px;

  }

  .region-info{

    padding:
      12px
      5px
      14px;

  }

  .region-name{

    font-size:17px;

  }

  .region-count{

    font-size:21px;

  }

  .region-percent{

    font-size:11px;

  }

  .map-box{

    margin-top:14px;

    padding:7px;

  }

  .map-title{

    padding:
      5px
      6px
      9px;

  }

  .map-title h2{

    font-size:18px;

  }

  .map-title span{

    display:none;

  }

  #map{

    height:520px;

  }

  .poke-marker{

    width:20px;

    height:20px;

  }

  .modal-overlay{

    padding:10px;

  }

  .poke-modal{

    width:
      calc(
        100vw - 20px
      );

    max-height:
      calc(
        100vh - 20px
      );

    border-radius:20px;

  }

  .modal-image{

    width:
      min(
        260px,
        78vw
      );

  }

  .modal-city{

    font-size:22px;

  }

  .collection-panel{

    padding:7px;

  }

  .collection-window{

    max-height:
      calc(
        100vh - 14px
      );

    border-radius:20px;

  }

  .collection-header{

    padding:
      15px;

  }

  .collection-title{

    font-size:21px;

  }

  .collection-toolbar{

    padding:
      10px
      14px;

  }

  .collection-grid{

    padding:12px;

    gap:12px;

    grid-template-columns:
      repeat(

<script>

/* =========================================================
   Basic Settings
========================================================= */

const DATA_URL =
  "data/data.json";

const GEOJSON_URL =
  "prefectures.geojson";

const HISTORY_URL =
  "history.json";


/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
  "YOUR_SUPABASE_ANON_KEY";


let supabaseClient =
  null;


if(
  typeof window.supabase !== "undefined" &&

  SUPABASE_URL &&

  SUPABASE_ANON_KEY &&

  !SUPABASE_URL.includes("YOUR_") &&

  !SUPABASE_ANON_KEY.includes("YOUR_")
){

  try{

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

  }catch(error){

    console.error(
      "Supabase 初始化失敗:",
      error
    );

    supabaseClient =
      null;

  }

}


/* =========================================================
   Prefecture
========================================================= */

const PREF = {

  1:"北海道",
  2:"青森県",
  3:"岩手県",
  4:"宮城県",
  5:"秋田県",
  6:"山形県",
  7:"福島県",

  8:"茨城県",
  9:"栃木県",
  10:"群馬県",
  11:"埼玉県",
  12:"千葉県",
  13:"東京都",
  14:"神奈川県",

  15:"新潟県",
  16:"富山県",
  17:"石川県",
  18:"福井県",
  19:"山梨県",
  20:"長野県",
  21:"岐阜県",
  22:"静岡県",
  23:"愛知県",

  24:"三重県",
  25:"滋賀県",
  26:"京都府",
  27:"大阪府",
  28:"兵庫県",
  29:"奈良県",
  30:"和歌山県",

  31:"鳥取県",
  32:"島根県",
  33:"岡山県",
  34:"広島県",
  35:"山口県",

  36:"徳島県",
  37:"香川県",
  38:"愛媛県",
  39:"高知県",

  40:"福岡県",
  41:"佐賀県",
  42:"長崎県",
  43:"熊本県",
  44:"大分県",
  45:"宮崎県",
  46:"鹿児島県",
  47:"沖縄県"

};


/* =========================================================
   Regions
========================================================= */

const REGIONS = {

  "北海道・東北":{
    prefs:[
      1,2,3,4,5,6,7
    ]
  },

  "關東":{
    prefs:[
      8,9,10,11,12,13,14
    ]
  },

  "中部":{
    prefs:[
      15,16,17,18,19,
      20,21,22,23
    ]
  },

  "近畿":{
    prefs:[
      24,25,26,27,28,29,30
    ]
  },

  "中國・四國":{
    prefs:[
      31,32,33,34,35,
      36,37,38,39
    ]
  },

  "九州・沖繩":{
    prefs:[
      40,41,42,43,44,45,46,47
    ]
  }

};


/* =========================================================
   Data State
========================================================= */

let data = [];

let groups = {};

let obtainedIds =
  new Set();

let currentUser =
  null;

let currentItem =
  null;

let currentPrefecture =
  null;

let currentCollectionItems =
  [];


/* =========================================================
   Local Storage
========================================================= */

function localKey(){

  if(currentUser){

    return (
      "pokeLidsObtained_" +
      currentUser.id
    );

  }

  return (
    "pokeLidsObtained_guest"
  );

}


function loadLocalObtained(){

  try{

    const raw =
      localStorage.getItem(
        localKey()
      );


    if(!raw){

      obtainedIds =
        new Set();

      return;

    }


    const arr =
      JSON.parse(raw);


    if(!Array.isArray(arr)){

      throw new Error(
        "LocalStorage 格式錯誤"
      );

    }


    obtainedIds =
      new Set(

        arr
          .map(Number)
          .filter(Number.isFinite)

      );


  }catch(error){

    console.error(
      "LocalStorage 讀取失敗:",
      error
    );

    obtainedIds =
      new Set();

  }

}


function saveLocalObtained(){

  try{

    localStorage.setItem(

      localKey(),

      JSON.stringify(
        [...obtainedIds]
      )

    );

  }catch(error){

    console.error(
      "LocalStorage 儲存失敗:",
      error
    );

  }

}


/* =========================================================
   Google Login
========================================================= */

async function loginGoogle(){

  if(!supabaseClient){

    alert(

      "目前尚未設定 Supabase。\n\n" +

      "請先填入：\n" +

      "SUPABASE_URL\n" +

      "SUPABASE_ANON_KEY"

    );

    return;

  }


  try{

    const redirectTo =
      window.location.origin +
      window.location.pathname;


    const {
      error
    } =
      await supabaseClient
        .auth
        .signInWithOAuth({

          provider:
            "google",

          options:{
            redirectTo
          }

        });


    if(error){

      throw error;

    }

  }catch(error){

    console.error(
      "Google 登入失敗:",
      error
    );

    alert(
      "Google 登入失敗：\n" +
      error.message
    );

  }

}


/* =========================================================
   Logout
========================================================= */

async function logout(){

  try{

    if(supabaseClient){

      await supabaseClient
        .auth
        .signOut();

    }

  }catch(error){

    console.error(
      "登出失敗:",
      error
    );

  }


  currentUser =
    null;


  loadLocalObtained();

  renderUser();

  renderRegions();

  updateOverall();

  refreshMapMarkers();

  renderCollectionGrid();

  updateCollectionSummary();

}


/* =========================================================
   Load User Collection
========================================================= */

async function loadUserCollection(){

  if(
    !supabaseClient ||
    !currentUser
  ){

    loadLocalObtained();

    return;

  }


  try{

    const {
      data:rows,
      error
    } =
      await supabaseClient

        .from(
          "user_pokelid_collection"
        )

        .select(
          "pokelid_id"
        )

        .eq(
          "user_id",
          currentUser.id
        )

        .eq(
          "obtained",
          true
        );


    if(error){

      throw error;

    }


    obtainedIds =
      new Set(

        (rows || [])
          .map(
            x =>
              Number(
                x.pokelid_id
              )
          )
          .filter(
            Number.isFinite
          )

      );


  }catch(error){

    console.error(
      "Supabase 收藏資料讀取失敗:",
      error
    );


    /*
     * Supabase table 尚未建立、
     * RLS 錯誤、
     * 網路問題
     *
     * 都退回 LocalStorage
     */

    loadLocalObtained();

  }

}


/* =========================================================
   Set Obtained
========================================================= */

async function setObtained(
  id,
  value
){

  id =
    Number(id);


  /*
   * Guest
   */

  if(
    !supabaseClient ||
    !currentUser
  ){

    if(value){

      obtainedIds.add(id);

    }else{

      obtainedIds.delete(id);

    }


    saveLocalObtained();

    return;

  }


  /*
   * Logged in
   */

  if(value){

    const {
      error
    } =
      await supabaseClient

        .from(
          "user_pokelid_collection"
        )

        .upsert(

          {

            user_id:
              currentUser.id,

            pokelid_id:
              id,

            obtained:
              true,

            updated_at:
              new Date()
                .toISOString()

          },

          {

            onConflict:
              "user_id,pokelid_id"

          }

        );


    if(error){

      throw error;

    }


    obtainedIds.add(id);


  }else{

    const {
      error
    } =
      await supabaseClient

        .from(
          "user_pokelid_collection"
        )

        .delete()

        .eq(
          "user_id",
          currentUser.id
        )

        .eq(
          "pokelid_id",
          id
        );


    if(error){

      throw error;

    }


    obtainedIds.delete(id);

  }

}


/* =========================================================
   Auth
========================================================= */

async function initAuth(){

  /*
   * Supabase not configured
   */

  if(!supabaseClient){

    currentUser =
      null;

    loadLocalObtained();

    renderUser();

    return;

  }


  try{

    const {
      data:{
        session
      } = {}
    } =
      await supabaseClient
        .auth
        .getSession();


    currentUser =
      session?.user ||
      null;


    if(currentUser){

      await loadUserCollection();

    }else{

      loadLocalObtained();

    }

  }catch(error){

    console.error(
      "Session 讀取失敗:",
      error
    );

    currentUser =
      null;

    loadLocalObtained();

  }


  renderUser();


  if(!window.__authListener){

    window.__authListener =
      true;


    supabaseClient
      .auth
      .onAuthStateChange(

        async(
          event,
          session
        ) => {

          console.log(
            "Auth event:",
            event
          );


          currentUser =
            session?.user ||
            null;


          if(currentUser){

            await loadUserCollection();

          }else{

            loadLocalObtained();

          }


          renderUser();

          renderRegions();

          updateOverall();

          refreshMapMarkers();

          renderCollectionGrid();

          updateCollectionSummary();


          if(currentItem){

            updateModalObtained();

          }

        }

      );

  }

}


/* =========================================================
   User UI
========================================================= */

function renderUser(){

  const el =
    document.getElementById(
      "userArea"
    );


  if(!el){

    return;

  }


  if(!currentUser){

    el.innerHTML = `

      <button
        class="login-btn"
        onclick="loginGoogle()"
      >
        🔐 使用 Google 登入
      </button>

    `;

    return;

  }


  const meta =
    currentUser.user_metadata ||
    {};


  const name =
    meta.full_name ||
    meta.name ||
    currentUser.email ||
    "使用者";


  const avatar =
    meta.avatar_url ||
    meta.picture ||
    "";


  el.innerHTML = `

    <div class="user-box">

      ${
        avatar

        ?

        `
        <img
          class="user-avatar"
          src="${escapeHtml(avatar)}"
          alt=""
        >
        `

        :

        `👤`
      }


      <b>
        ${escapeHtml(name)}
      </b>


      <button
        class="logout-btn"
        onclick="logout()"
      >
        登出
      </button>

    </div>

  `;

}


/* =========================================================
   Load Main Data
========================================================= */

async function loadData(){

  const response =
    await fetch(

      DATA_URL +
      "?ts=" +
      Date.now(),

      {
        cache:"no-store"
      }

    );


  if(!response.ok){

    throw new Error(

      "data/data.json 無法取得。" +

      "\nHTTP " +
      response.status

    );

  }


  const json =
    await response.json();


  if(
    !json ||
    !Array.isArray(json.list)
  ){

    throw new Error(
      "data/data.json 格式錯誤，找不到 list。"
    );

  }


  data =
    json.list;


  groups =
    {};


  for(
    const item
    of data
  ){

    const pref =
      PREF[item.pref] ||
      String(item.pref);


    if(!groups[pref]){

      groups[pref] =
        [];

    }


    groups[pref].push(
      item
    );

  }

}


/* =========================================================
   Load GeoJSON
========================================================= */

async function loadGeoJSON(){

  const response =
    await fetch(

      GEOJSON_URL +
      "?ts=" +
      Date.now(),

      {
        cache:"no-store"
      }

    );


  if(!response.ok){

    throw new Error(

      "prefectures.geojson 無法取得。" +

      "\nHTTP " +
      response.status +

      "\n\n請確認檔案位於 index.html 同一層。"

    );

  }


  return await response.json();

}


/* =========================================================
   Main Loader
========================================================= */

async function loadAll(){

  /*
   * 1. Main Data
   */

  try{

    await loadData();

  }catch(error){

    console.error(
      "主要資料載入失敗:",
      error
    );


    document.getElementById(
      "regions"
    ).innerHTML = `

      <div
        class="error-box"
        style="grid-column:1/-1"
      >

        <b>
          ❌ Poké Lid 資料載入失敗
        </b>

        <br><br>

        ${escapeHtml(
          error.message
        )}

        <br><br>

        請確認：

        <br>
        ① data/data.json 是否存在
        <br>
        ② GitHub Pages 是否已更新
        <br>
        ③ data.json 格式是否正確

      </div>

    `;

    return;

  }


  /*
   * 2. Auth
   */

  await initAuth();


  /*
   * 3. Render basic UI first
   */

  renderRegions();

  updateOverall();


  /*
   * 4. GeoJSON independent
   */

  try{

    const geojson =
      await loadGeoJSON();


    initMap(
      geojson
    );


  }catch(error){

    console.error(
      "GeoJSON 載入失敗:",
      error
    );


    document.getElementById(
      "map"
    ).innerHTML = `

      <div
        class="error-box"
        style="margin:20px"
      >

        <b>
          ⚠️ 行政區地圖載入失敗
        </b>

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }


  /*
   * 5. History independent
   */

  await loadHistory();

}


/* =========================================================
   Overall Progress
========================================================= */

function updateOverall(){

  const total =
    data.length;


  const obtained =
    data.filter(

      x =>
        obtainedIds.has(
          Number(x.id)
        )

    ).length;


  document.getElementById(
    "totalCount"
  ).textContent =
    total;


  document.getElementById(
    "totalObtained"
  ).textContent =
    obtained;

}


/* =========================================================
   Region Cards
========================================================= */

function renderRegions(){

  const el =
    document.getElementById(
      "regions"
    );


  if(!el){

    return;

  }


  if(!data.length){

    el.innerHTML = `

      <div
        class="loading"
        style="grid-column:1/-1"
      >

        尚無資料

      </div>

    `;

    return;

  }


  el.innerHTML =
    "";


  for(
    const [
      regionName,
      region
    ]
    of Object.entries(
      REGIONS
    )
  ){

    const items =
      data.filter(

        x =>
          region.prefs.includes(
            Number(x.pref)
          )

      );


    const obtained =
      items.filter(

        x =>
          obtainedIds.has(
            Number(x.id)
          )

      ).length;


    const total =
      items.length;


    const percent =
      total

      ?

      Math.round(
        obtained /
        total *
        1000
      ) / 10

      :

      0;


    /*
     * 首頁仍然只顯示少量圖片
     * 點擊後才顯示全部章
     */

    const sample =
      items.slice(
        0,
        3
      );


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "region-card";


    card.onclick =
      () =>
        focusRegion(
          regionName
        );


    const imageHtml =
      sample.length

      ?

      sample

        .map(

          item => `

            <img
              class="region-image"
              src="${imageUrl(item.id)}"
              alt="${escapeHtml(
                item.city || ""
              )}"
              loading="lazy"
              onerror="
                this.style.visibility='hidden'
              "
            >

          `

        )

        .join("")

      :

      `

        <div class="region-empty">
          尚無資料
        </div>

      `;


    card.innerHTML = `

      <div class="region-images">

        ${imageHtml}

      </div>


      <div class="region-info">

        <div class="region-name">

          ${escapeHtml(
            regionName
          )}

        </div>


        <div class="region-count">

          ${obtained}
          /
          ${total}

        </div>


        <div class="region-percent">

          完成率
          ${percent}%

        </div>

      </div>

    `;


    el.appendChild(
      card
    );

  }

}


/* =========================================================
   Image URL
========================================================= */

  }


  const obtained =
    currentCollectionItems.filter(

      item =>

  el.textContent =

/* =========================================================
   Collection Grid
========================================================= */

function renderCollectionGrid(){

  const el =
    document.getElementById(
      "collectionGrid"
    );


  if(!el){

    return;

  }


  el.innerHTML =
    "";


  if(!currentCollectionItems.length){

    el.innerHTML = `

      <div
        class="loading"
        style="grid-column:1/-1"
      >

        此區目前沒有 Poké Lid 資料。

      </div>

    `;

    return;

  }


  for(
    const item
    of currentCollectionItems
  ){

    const id =
      Number(item.id);


    const obtained =
      obtainedIds.has(id);


    const card =
      document.createElement(
        "div"
      );


    /*
     * 紅／綠光暈
     */

    card.className =

      "collection-item " +

      (
        obtained
        ?
        "obtained"
        :
        "not-obtained"
      );


    /*
     * 點擊章圖片
     * → 詳細小卡
     */

    card.onclick = () => {

      const lat =
        Number(
          item.coords?.[0]
        );


      const lng =
        Number(
          item.coords?.[1]
        );


      openModal(

        item,

        PREF[item.pref] ||
        String(item.pref),

        lat,

        lng

      );

    };


    card.innerHTML = `

      <div class="collection-image-wrap">

        <img
          class="collection-image"
          src="${imageUrl(item.id)}"
          alt="${escapeHtml(
            item.city ||
            "Poké Lid"
          )}"
          loading="lazy"
          onerror="
            this.style.visibility='hidden'
          "
        >

      </div>


      <div class="collection-city">

        ${escapeHtml(
          item.city ||
          PREF[item.pref] ||
          ""
        )}

      </div>


      <div class="collection-status">

        ${
          obtained
          ?
          "● 已收集"
          :
          "● 未收集"
        }

      </div>

    `;


    el.appendChild(
      card
    );

  }

}


/* =========================================================
   Map
========================================================= */

let map =
  null;

let prefectureLayer =
  null;

let pointLayer =
  null;

let selectedLayer =
  null;

const JAPAN_CENTER =
  [36.2,138.3];

const JAPAN_ZOOM =
  6;


/* =========================================================
   Init Map
========================================================= */

function initMap(
  geojson
){

  if(map){

    return;

  }


  map =
    L.map(
      "map",
      {

        zoomControl:true,

        minZoom:4,

        maxZoom:18,

        tap:true

      }

    )

    .setView(

      JAPAN_CENTER,

      JAPAN_ZOOM

    );


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      maxZoom:19,

      attribution:
        "&copy; OpenStreetMap contributors"

    }

  ).addTo(
    map
  );


  pointLayer =
    L.layerGroup()
      .addTo(
        map
      );


  prefectureLayer =
    L.geoJSON(

      geojson,

      {

        style:
          prefectureStyle,

        onEachFeature:
          onEachPrefecture

      }

    )

    .addTo(
      map
    );


  map.on(
    "click",
    () => {

      if(currentPrefecture){

        clearPointLayer();

        closeModal();


        currentPrefecture =
          null;


        if(selectedLayer){

          prefectureLayer.resetStyle(
            selectedLayer
          );

          selectedLayer =
            null;

        }


        map.setView(
          JAPAN_CENTER,
          JAPAN_ZOOM
        );

      }

    }
  );

}


/* =========================================================
   Get Prefecture
========================================================= */

function getFeaturePrefecture(
  feature
){

  const p =
    feature?.properties ||
    {};


  const candidates = [

    p.pref,
    p.PREF,
    p.code,
    p.CODE,
    p.pref_code,
    p.prefCode,
    p.name_ja,
    p.name_local,
    p.nam_ja,
    p.N03_001,
    p.N03_003,
    p.name

  ];


  for(
    const value
    of candidates
  ){

    if(
      value == null
    ){

      continue;

    }


    const text =
      String(value);


    const digits =
      text.replace(
        /\D/g,
        ""
      );


    const number =
      parseInt(
        digits,
        10
      );


    if(
      number >= 1 &&
      number <= 47
    ){

      return PREF[number];

    }


    const found =
      Object.values(
        PREF
      ).find(

        name =>
          text.includes(name)

      );


    if(found){

      return found;

    }

  }


  return null;

}


/* =========================================================
   Prefecture Color
========================================================= */

function getColorByCount(
  count
){

  if(count >= 70)
    return "#38a169";

  if(count >= 50)
    return "#58b87b";

  if(count >= 30)
    return "#79c58c";

  if(count >= 20)
    return "#9bd49d";

  if(count >= 10)
    return "#b9dfae";

  if(count >= 5)
    return "#d5e9c4";

  return "#e6f1d9";

}


function prefectureStyle(
  feature
){

  const pref =
    getFeaturePrefecture(
      feature
    );


  const items =
    groups[pref] ||
    [];


  return {

    fillColor:
      getColorByCount(
        items.length
      ),

    weight:1.5,

    opacity:1,

    color:"#ffffff",

    fillOpacity:.85

  };

}


/* =========================================================
   Prefecture Event
========================================================= */

function onEachPrefecture(
  feature,
  layer
){

  const pref =
    getFeaturePrefecture(
      feature
    );


  const items =
    groups[pref] ||
    [];


  const count =
    items.length;


  layer.bindTooltip(

    `

      <b>
        ${escapeHtml(
          pref ||
          "行政區"
        )}
      </b>

      <br>

      Poké Lid：

      <strong>
        ${count}
      </strong>

      個

    `,

    {

      sticky:true,

      className:
        "pref-tooltip",

      direction:
        "top"

    }

  );


  layer.on({

    mouseover:function(){

      this.setStyle({

        weight:3,

        color:"#397b83",

        fillOpacity:.95

      });

    },


    mouseout:function(){

      if(
        this !==
        selectedLayer
      ){

        prefectureLayer.resetStyle(
          this
        );

      }

    },


    click:function(e){

      L.DomEvent.stopPropagation(
        e
      );


      showPrefecture(
        pref,
        layer
      );

    }

  });

}


/* =========================================================
   Show Prefecture
========================================================= */

function showPrefecture(
  pref,
  layer
){

  if(!pref){

    return;

  }


  currentPrefecture =
    pref;


  const items =
    groups[pref] ||
    [];


  clearPointLayer();


  if(selectedLayer){

    prefectureLayer.resetStyle(
      selectedLayer
    );

  }


  selectedLayer =
    layer;


  layer.setStyle({

    weight:4,

    color:"#397b83",

    fillOpacity:1

  });


  try{

    const bounds =
      layer.getBounds();


    if(
      bounds &&
      bounds.isValid()
    ){

      map.fitBounds(

        bounds,

        {

          padding:[
            30,
            30
          ],

          maxZoom:9

        }

      );

    }

  }catch(error){

    console.error(
      "地圖定位失敗:",
      error
    );

  }


  for(
    const item
    of items
  ){

    addPointMarker(
      item,
      pref
    );

  }


  updatePointStatus();

}


/* =========================================================
   Add Marker
========================================================= */

function addPointMarker(
  item,
  pref
){

  const lat =
    Number(
      item.coords?.[0]
    );


  const lng =
    Number(
      item.coords?.[1]
    );


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){

    return;

  }


  const obtained =
    obtainedIds.has(
      Number(item.id)
    );


  const icon =
    L.divIcon({

      className:"",

      html:`

        <div
          class="poke-marker ${
            obtained
            ?
            "obtained"
            :
            "not-obtained"
          }"
        ></div>

      `,

      iconSize:[
        18,
        18
      ],

      iconAnchor:[
        9,
        9
      ]

    });


  const marker =
    L.marker(

      [
        lat,
        lng
      ],

      {

        icon,

        riseOnHover:true

      }

    );


  marker.on(
    "click",
    function(e){

      L.DomEvent.stopPropagation(
        e
      );


      openModal(
        item,
        pref,
        lat,
        lng
      );

    }
  );


  marker.addTo(
    pointLayer
  );


  item.__marker =
    marker;

}

   Refresh Markers

  if(

  clearPointLayer();

/* =========================================================
   Copy Coordinate
========================================================= */

async function copyCoordinate(
  event
){

  if(event){

    event.stopPropagation();

  }


  if(!currentItem){

    return;

  }


  const text =
    document.getElementById(
      "modalCoordinate"
    )
    .textContent
    .trim();


  if(
    !text ||
    text === "無座標資料"
  ){

    return;

  }


  try{

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard.writeText(
        text
      );

    }else{

      throw new Error();

    }

  }catch{

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    textarea.style.position =
      "fixed";


    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.focus();

    textarea.select();


    try{

      document.execCommand(
        "copy"
      );

    }catch(error){

      console.error(
        "複製失敗:",
        error
      );

    }


    textarea.remove();

  }


  const hint =
    document.getElementById(
      "copyHint"
    );


  hint.classList.add(
    "show"
  );


  setTimeout(

    () =>
      hint.classList.remove(
        "show"
      ),

    1500

  );

}

/* =========================================================
   Downloads
========================================================= */

function safe(s){

  return String(s)
    .replace(
      /[\\/:*?"<>|]/g,
      "_"
    );

}


function blob(
  text,
  type =
    "text/plain;charset=utf-8"
){

  return new Blob(

    [
      "\ufeff",
      text
    ],

    {

      type

    }

  );

}


function save(
  blobData,
  filename
){

  const a =
    document.createElement(
      "a"
    );


  const url =
    URL.createObjectURL(
      blobData
    );


  a.href =
    url;


  a.download =
    filename;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(

    () => {

      URL.revokeObjectURL(
        url
      );

    },

    1000

  );

}


function txt(
  items,
  groupName
){

  return items

    .map(

      x =>

        `${x.coords?.[0] ?? ""},` +
        `${x.coords?.[1] ?? ""},` +
        `${x.city || groupName}`

    )

    .join("\n");

}


function downloadAll(){

  const out =
    [];


  for(
    const p
    of Object.keys(
      groups
    ).sort()
  ){

    out.push(

      `# ===== ` +
      `${p} ` +
      `(${groups[p].length}) ` +
      `=====`

    );


    out.push(
      txt(
        groups[p],
        p
      )
    );


    out.push("");

  }


  save(

    blob(
      out.join("\n")
    ),

    "poke_lid_2026_by_prefecture.txt"

  );

}


function downloadJSON(){

  const out =
    {};


  for(
    const p
    of Object.keys(
      groups
    ).sort()
  ){

    out[p] =
      groups[p].map(

        x => ({

          lat:
            String(
              x.coords?.[0] ??
              ""
            ),

          lng:
            String(
              x.coords?.[1] ??
              ""
            ),

          title:
            String(
              x.city ||
              p
            )

        })

      );

  }


  save(

    new Blob(

      [
        JSON.stringify(
          out,
          null,
          2
        )
      ],

      {

        type:
          "application/json;charset=utf-8"

      }

    ),

    "poke_lid_2026_favorite_lists.json"

  );

}


function downloadCSV(){

  const rows = [

    [
      "id",
      "prefecture",
      "city",
      "lat",
      "lng",
      "name",
      "address",
      "pokemons"
    ]

  ];


  for(
    const x
    of data
  ){

    rows.push([

      x.id,

      PREF[x.pref] ||
      x.pref,

      x.city ||
      "",

      x.coords?.[0] ||
      "",

      x.coords?.[1] ||
      "",

      x.city ||
      "",

      x.address ||
      "",

      (x.pokemons || [])
        .join("|")

    ]);

  }


  const csv =
    rows

      .map(

        row =>

          row

            .map(

              value =>

                `"${String(value)
                  .replaceAll(
                    '"',
                    '""'
                  )}"`

            )

            .join(",")

      )

      .join("\n");


  save(

    blob(
      csv,
      "text/csv;charset=utf-8"
    ),

    "poke_lid_2026.csv"

  );

}

    const response =
      await fetch(

        HISTORY_URL +
        "?ts=" +
        Date.now(),

        {
          cache:
            "no-store"
        }

      );


    if(!response.ok){

      throw new Error(
        "History HTTP " +
        response.status
      );

    }


    const history =
      await response.json();


    const logs =
      history.history ||
      [];


    if(
      !Array.isArray(logs) ||
      !logs.length
    ){

      el.innerHTML = `

        <span class="muted">

          尚無更新紀錄。

        </span>

      `;

      return;

    }


    el.innerHTML =

      logs

        .slice()

        .reverse()

        .slice(
          0,
          30
        )

        .map(

          item => {

            const added =
              item.added ||
              [];


            const removed =
              item.removed ||
              [];


            const changed =
              item.changed ||
              [];


            return `

              <div class="history-card">

                <b>
                  ${escapeHtml(
                    item.time ||
                    ""
                  )}
                </b>


                <br>


                <span class="muted">

                  版本：
                  ${escapeHtml(
                    item.total ??
                    ""
                  )}
                  筆

                </span>


                <br>


                🟢 新增
                ${added.length}

                　

                🔴 移除
                ${removed.length}

                　

                🟡 修改
                ${changed.length}

              </div>

            `;

          }

        )

        .join("");


  }catch(error){

    console.error(
      "History 載入失敗:",
      error
    );


    el.innerHTML = `

      <span class="muted">

        尚無 History 資料。

      </span>

    `;

  }

}


/* =========================================================
   HTML Escape
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

    .replace(

      /[&<>"']/g,

      m => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m])

    );

}


/* =========================================================
   Start
========================================================= */

loadAll();
